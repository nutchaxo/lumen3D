<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >From the tracks.json file to the spheres on screen</text><rect x="20" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="20" y="60" width="178" height="34" rx="14" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><rect x="20" y="78" width="178" height="16" rx="0" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><text x="109" y="83" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >1 · The file</text><text x="109" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">tracks.json</text><text x="32" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >One entry per cell:</text><text x="32" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >positions frame by frame</text><text x="32" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >in µm (stabilised and raw),</text><text x="32" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >region, lineage.</text><rect x="30" y="262" width="158" height="38" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="109" y="278" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >demo: 32,675 bytes</text><text x="109" y="291" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >(10,991 as .gz)</text><line x1="200" y1="185" x2="214" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="216" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="216" y="60" width="178" height="34" rx="14" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><rect x="216" y="78" width="178" height="16" rx="0" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><text x="305" y="83" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >2 · The worker</text><text x="305" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">tracks-load-worker.js</text><text x="228" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Downloads (the .gz first),</text><text x="228" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >decompresses, parses the</text><text x="228" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >JSON, packs everything</text><text x="228" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >into typed arrays. Off the</text><text x="228" y="214.24" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >main thread.</text><rect x="226" y="262" width="158" height="38" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2" /><text x="305" y="278" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle" >the page never freezes</text><line x1="396" y1="185" x2="410" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="412" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="412" y="60" width="178" height="34" rx="14" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><rect x="412" y="78" width="178" height="16" rx="0" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><text x="501" y="83" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >3 · The tables</text><text x="501" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >32-bit, transferred</text><text x="424" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Per frame: positions + cell</text><text x="424" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >numbers. Per cell: lineage,</text><text x="424" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >region, events, lifespan.</text><rect x="422" y="262" width="158" height="38" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="501" y="278" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle" >demo: 8,048 bytes in all</text><line x1="592" y1="185" x2="606" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="608" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="608" y="60" width="178" height="34" rx="14" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><rect x="608" y="78" width="178" height="16" rx="0" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><text x="697" y="83" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >4 · The layer</text><text x="697" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >TrackingOverlay</text><text x="620" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >One sphere per cell</text><text x="620" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(instanced mesh). The five</text><text x="620" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >tools read the same tables</text><text x="620" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >through ctx.tracking.</text><rect x="618" y="262" width="158" height="38" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="697" y="278" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >a single copy of the data</text><rect x="20" y="326" width="760" height="52" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="349" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Why a worker? Meanwhile the viewer downloads and decodes 64³-voxel bricks: parsing several MB of JSON on the main thread</text><text x="36" y="365.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >would show as a stutter.</text></svg>