<text x="664" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">served file,</text>
<text x="664" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">same for</text>
<text x="664" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">every visitor</text>
<text x="24" y="240" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">Stylesheet order (the last one wins):</text>
