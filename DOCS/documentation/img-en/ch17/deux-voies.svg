<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="504" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Two lanes, one journal</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >The browser and the server share the same list of units.</text><rect x="24" y="70" width="300" height="292" rx="14" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8" /><text x="174" y="96" font-size="14.5" font-weight="800" fill="#3b5bdb" text-anchor="middle" >“This browser” lane</text><text x="40" y="126" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >① read the input bytes</text><text x="40" y="150" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >   (read_ranges: 1 request)</text><text x="40" y="174" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >② decode the lossless WebP</text><text x="40" y="198" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >③ re-cut and encode as PNG</text><text x="40" y="222" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >④ send the result (unit_put)</text><rect x="40" y="252" width="268" height="50" rx="8" fill="#fff" stroke="#3b5bdb" stroke-width="1.3" /><text x="174" y="272" font-size="11.8" font-weight="700" fill="#3b5bdb" text-anchor="middle" >Web Workers: at most 2 × 2 units</text><text x="174" y="290" font-size="10.2" font-weight="400" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >migration-worker.js + js/migrations/m00x.js</text><text x="174" y="330" font-size="11.8" font-weight="700" fill="#c92a2a" text-anchor="middle" >The tab must stay open</text><text x="174" y="348" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >(closing = pausing)</text><rect x="476" y="70" width="300" height="292" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><text x="626" y="96" font-size="14.5" font-weight="800" fill="#e67700" text-anchor="middle" >“The server” lane</text><text x="492" y="126" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >① the tab calls unit_run</text><text x="492" y="150" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >   (≤ 20 s per call, bounded)</text><text x="492" y="174" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >② the server reads the bricks</text><text x="492" y="198" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >③ decodes, re-cuts, encodes</text><text x="492" y="222" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >④ writes to the store, ticks</text><rect x="492" y="252" width="268" height="50" rx="8" fill="#fff" stroke="#e67700" stroke-width="1.3" /><text x="626" y="272" font-size="11.8" font-weight="700" fill="#e67700" text-anchor="middle" >Pillow (Python) or GD (PHP)</text><text x="626" y="290" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >lossless WebP decode + encode</text><text x="626" y="330" font-size="11.8" font-weight="700" fill="#c92a2a" text-anchor="middle" >The tab loops, but computes nothing</text><text x="626" y="348" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >(hosts without background processes)</text><rect x="338" y="110" width="124" height="160" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2" /><text x="400" y="134" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Journal</text><text x="400" y="152" font-size="14" font-weight="700" fill="#2b8a3e" text-anchor="middle" >+</text><text x="400" y="172" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >tile</text><text x="400" y="188" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >store</text><text x="400" y="216" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploads/</text><text x="400" y="232" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >migrations/</text><text x="400" y="256" font-size="10.5" font-weight="600" fill="#4a5468" text-anchor="middle" >never served</text><line x1="324" y1="190" x2="338" y2="190" stroke="#3b5bdb" stroke-width="2.4" marker-end="url(#arr)"/><line x1="476" y1="190" x2="462" y2="190" stroke="#e67700" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="376" width="300" height="56" rx="10" fill="#fff" stroke="#7048e8" stroke-width="1.5" /><text x="174" y="398" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle" >Network governor (NetGovernor)</text><text x="174" y="418" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >6 in flight · 4 to 6 requests/s · slows on 429/503</text><line x1="174" y1="376" x2="174" y2="362" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/><rect x="338" y="376" width="438" height="56" rx="10" fill="#fff" stroke="#2b8a3e" stroke-width="1.5" /><text x="557" y="398" font-size="12.3" font-weight="800" fill="#2b8a3e" text-anchor="middle" >When all units are done: finalize (always server-side)</text><text x="557" y="418" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="middle" >assembles, swaps, bumps the version — see below</text><rect x="24" y="444" width="752" height="44" rx="10" fill="#eef0f5" stroke="#c5cbd8" stroke-width="1.2" /><text x="400" y="471" font-size="11.8" font-weight="600" fill="#1c2333" text-anchor="middle" >One dataset = one executor at a time (locked while running); two datasets on two lanes advance in parallel.</text></svg>