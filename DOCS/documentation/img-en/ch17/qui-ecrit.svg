<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 484" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="484" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Three authors for one metadata.json</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Every field has an owner; the other two respect its choices.</text><rect x="24" y="70" width="245" height="262" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="38" y="92" font-size="14.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >1. The pipeline measures</text><text x="38" y="121" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >id, type, formatVersion</text><text x="38" y="142" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >dimensions, voxel_size</text><text x="38" y="163" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >physicalSizeUm, acquisitionExtentUm</text><text x="38" y="184" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >calibrationStatus / Note</text><text x="38" y="205" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >channels[] (starting values)</text><text x="38" y="226" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >volumeSources[], thumbnail</text><text x="38" y="247" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >timeline, intensityNormalization</text><text x="38" y="268" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >tracking, registration</text><text x="38" y="289" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >stage, embryo (read from the name)</text><text x="38" y="310" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >created, description (initial)</text><rect x="277" y="70" width="245" height="262" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="291" y="92" font-size="14.5" font-weight="800" fill="#e67700" text-anchor="start" >2. The operator adjusts</text><text x="291" y="121" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >name, description</text><text x="291" y="142" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >stage, stageNumeric, embryo</text><text x="291" y="163" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >voxel_size (hand calibration)</text><text x="291" y="184" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >channels[]: name, colour, window</text><text x="291" y="205" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >exposure</text><text x="291" y="226" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >orientation, orientationAxes</text><text x="291" y="247" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >upsideDown, orientation2d</text><text x="291" y="268" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gallery[] (captions, order)</text><text x="291" y="289" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >hidden (visibility)</text><text x="291" y="310" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >line, staining, reporter, tags…</text><rect x="530" y="70" width="245" height="262" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="544" y="92" font-size="14.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >3. The platform sets</text><text x="544" y="121" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >id, type, folderName (every save)</text><text x="544" y="142" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >configured = true</text><text x="544" y="163" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >lastModified</text><text x="544" y="184" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >formatVersion (migration)</text><text x="544" y="205" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >hidden = true (on publish)</text><text x="544" y="226" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gallery[]: thumb, added</text><text x="544" y="247" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >never: computed fields (staging…)</text><rect x="24" y="346" width="752" height="118" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="372" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >When the same dataset is redone or replaced</text><text x="40" y="398" font-size="12.5" font-weight="700" fill="#3b5bdb" text-anchor="start" >The pipeline redoes a dataset:</text><text x="215" y="398" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >measurements from the new run; the 20 “curated” keys of the old file win.</text><text x="40" y="424" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="start" >The import replaces a dataset:</text><text x="215" y="424" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >the new file wins; a curated key is carried only if it is missing.</text><text x="40" y="450" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="start" >In both cases:</text><text x="215" y="450" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >formatVersion is never taken from the old file (it describes the disk).</text></svg>