<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="474" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Les états d'un jeu en cours d'import</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Ce qu'on peut faire dans chaque état, et ce qui arrive à un import abandonné.</text><rect x="24" y="80" width="182" height="156" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><text x="115" y="104" font-size="11.4" font-weight="800" fill="#e67700" text-anchor="middle" >Envoi — non éditable</text><text x="115" y="122" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploading</text><text x="36" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >fichiers du palier ≤ 1</text><text x="36" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >pas encore tous là</text><text x="36" y="196" font-size="11.2" font-weight="700" fill="#e67700" text-anchor="start" >ouvrir : non</text><text x="36" y="213" font-size="11.2" font-weight="700" fill="#e67700" text-anchor="start" >éditer : non</text><rect x="214" y="80" width="182" height="156" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8" /><text x="305" y="104" font-size="11.4" font-weight="800" fill="#3b5bdb" text-anchor="middle" >Envoi — éditable</text><text x="305" y="122" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >editable</text><text x="226" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >metadata + manifeste</text><text x="226" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >+ niveau grossier</text><text x="226" y="196" font-size="11.2" font-weight="700" fill="#3b5bdb" text-anchor="start" >ouvrir : oui (basse résolution)</text><text x="226" y="213" font-size="11.2" font-weight="700" fill="#3b5bdb" text-anchor="start" >éditer : oui</text><rect x="404" y="80" width="182" height="156" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><text x="495" y="104" font-size="11.4" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Envoyé — à publier</text><text x="495" y="122" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >staged</text><text x="416" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >tous les fichiers</text><text x="416" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >terminés et vérifiés</text><text x="416" y="196" font-size="11.2" font-weight="700" fill="#2b8a3e" text-anchor="start" >vérifier, publier</text><text x="416" y="213" font-size="11.2" font-weight="700" fill="#2b8a3e" text-anchor="start" >jamais purgé</text><rect x="594" y="80" width="182" height="156" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.8" /><text x="685" y="104" font-size="11.4" font-weight="800" fill="#4a5468" text-anchor="middle" >Publié</text><text x="685" y="122" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >published</text><text x="606" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >déplacé dans DATA_WEB/</text><text x="606" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >masqué par défaut</text><text x="606" y="196" font-size="11.2" font-weight="700" fill="#4a5468" text-anchor="start" >journal supprimé</text><text x="606" y="213" font-size="11.2" font-weight="700" fill="#4a5468" text-anchor="start" >(visibilité à activer)</text><line x1="206" y1="158" x2="214" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><line x1="396" y1="158" x2="404" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><line x1="586" y1="158" x2="594" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="262" width="752" height="128" rx="12" fill="#fff" stroke="#c92a2a" stroke-width="1.6" /><text x="40" y="286" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Interrompu (stalled) puis purgé</text><text x="44" y="312" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• aucun bloc accepté depuis 7 jours (604 800 s) : l'état devient « stalled » (Interrompu) ;</text><text x="44" y="331" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• le nettoyage (à chaque affichage de la liste, ou action gc) efface alors ses fichiers et son journal ;</text><text x="44" y="350" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• un jeu « Envoyé — à publier » n'est JAMAIS purgé : c'est du travail fini qui n'attend que votre clic ;</text><text x="44" y="369" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• reglisser le même dossier relance le compte à rebours : seuls les blocs manquants repartent.</text><rect x="24" y="404" width="752" height="52" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="427" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" >« Éditable » = les fichiers de palier ≤ 1 sont terminés ET metadata.json ET (manifeste ou aperçu) sont arrivés.</text><text x="400" y="445" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Dès que vous enregistrez une édition, metadata.json est verrouillé (metaLocked) : le transfert ne le réécrit plus.</text></svg>