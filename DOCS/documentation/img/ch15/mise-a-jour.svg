<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="332" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Mettre à jour la plateforme : les plugins incompatibles s'effacent</text><rect x="24" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,90 V68 Q24,56 36,56 H254 Q266,56 266,68 V90 Z" fill="#e8edff"/><text x="145.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle">1 · Avant (rapport)</text><text x="145.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">pour chaque plugin :</text><text x="145.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">platformCompat accepte</text><text x="145.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">la version CIBLE ?</text><text x="145.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">→ ok  ou  willQuarantine</text><text x="145.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">blocage si plus aucun</text><text x="145.0" y="218" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">mode de rendu ne reste</text><line x1="268" y1="146" x2="276" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="278" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M278,90 V68 Q278,56 290,56 H508 Q520,56 520,68 V90 Z" fill="#fff4e6"/><text x="399.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle">2 · Après le basculement</text><text x="399.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">chaque découverte refiltre :</text><text x="399.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">incompatible → absent de</text><text x="399.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">la liste, fichiers intacts</text><text x="399.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">l'admin donne la raison</text><text x="399.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">(étiquette « incompatible »)</text><line x1="522" y1="146" x2="530" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="532" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M532,90 V68 Q532,56 544,56 H762 Q774,56 774,68 V90 Z" fill="#ebfbee"/><text x="653.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle">3 · Plus tard</text><text x="653.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">une nouvelle version du</text><text x="653.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">plugin (catalogue) ou de</text><text x="653.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">la plateforme le rend</text><text x="653.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">compatible → il revient</text><text x="653.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">tout seul, sans réinstaller</text><rect x="24" y="256" width="752" height="56" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="400" y="280" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle">Les plugins tiers déposés par l'opérateur survivent aux mises à jour</text><text x="400" y="300" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">(seuls les fichiers de la release précédente sont remplacés ; le magasin d'approbations est protégé)</text></svg>
