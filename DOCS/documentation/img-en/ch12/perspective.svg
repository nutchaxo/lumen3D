<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
  <rect width="800" height="300" rx="16" fill="#f8f9fd"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Why the 3D scale bar is exact at one depth only</text>
  <text x="60" y="165" font-size="34">👁</text>
  <!-- view cone -->
  <path d="M110,160 L720,62 L720,258 Z" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.5" opacity=".75"/>
  <!-- three planes -->
  <g stroke-width="3">
    <line x1="270" y1="127" x2="270" y2="193" stroke="#2b8a3e"/>
    <line x1="470" y1="95" x2="470" y2="225" stroke="#c92a2a"/>
    <line x1="640" y1="73" x2="640" y2="247" stroke="#e67700"/>
  </g>
  <!-- same real length 100 um segments -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="270" y="116" fill="#2b8a3e">nearer</text>
    <text x="270" y="212" fill="#2b8a3e">100 µm look</text><text x="270" y="228" fill="#2b8a3e">larger</text>
    <text x="470" y="84" fill="#c92a2a">centre of the specimen</text>
    <text x="470" y="242" fill="#c92a2a">the bar is exact here</text>
    <text x="640" y="62" fill="#e67700">farther</text>
    <text x="640" y="262" fill="#e67700">100 µm look</text><text x="640" y="278" fill="#e67700">smaller</text>
  </g>
  <rect x="440" y="118" width="60" height="14" rx="4" fill="#fff" stroke="#c92a2a"/><text x="470" y="129" text-anchor="middle" font-size="11" font-weight="800" fill="#c92a2a">bar</text>
  <text x="150" y="276" font-size="12" fill="#4a5468">Same real length, three depths: perspective shrinks it with distance.</text>
</svg>
