<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="600" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Le basculement : un superviseur, une sonde, un retour arrière</text><rect x="12" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M12,86 V68 a12,12 0 0 1 12,-12 H140 a12,12 0 0 1 12,12 V86 Z" fill="#e8edff"/><text x="82" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle">1 · Arrêt propre</text><text x="82" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">le serveur actuel</text><text x="82" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">cesse d&#x27;écouter</text><line x1="154" y1="106" x2="166" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="168" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M168,86 V68 a12,12 0 0 1 12,-12 H296 a12,12 0 0 1 12,12 V86 Z" fill="#e8edff"/><text x="238" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle">2 · Port libre ?</text><text x="238" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">le superviseur</text><text x="238" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">attend ≤ 30 s</text><line x1="310" y1="106" x2="322" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="324" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M324,86 V68 a12,12 0 0 1 12,-12 H452 a12,12 0 0 1 12,12 V86 Z" fill="#fff4e6"/><text x="394" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="middle">3 · Échange</text><text x="394" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">renommages</text><text x="394" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">journalisés</text><line x1="466" y1="106" x2="478" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="480" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M480,86 V68 a12,12 0 0 1 12,-12 H608 a12,12 0 0 1 12,12 V86 Z" fill="#f3f0ff"/><text x="550" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle">4 · Démarrage</text><text x="550" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">le serveur neuf</text><text x="550" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">est lancé</text><line x1="622" y1="106" x2="634" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="636" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M636,86 V68 a12,12 0 0 1 12,-12 H764 a12,12 0 0 1 12,12 V86 Z" fill="#e3fafc"/><text x="706" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="middle">5 · Sonde de santé</text><text x="706" y="108" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">/api/health</text><text x="706" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">≤ 30 s</text><path d="M742,158 V216" fill="none" stroke="#2b8a3e" stroke-width="2.4" marker-end="url(#arr)"/><text x="750" y="190" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="start">répond</text><path d="M690,158 V190 H205 V214" fill="none" stroke="#c92a2a" stroke-width="2.4" marker-end="url(#arr)"/><text x="450" y="184" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">aucune réponse en 30 s, ou mauvaise version</text><rect x="400" y="216" width="380" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="416" y="242" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">Réussi</text><text x="416" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">le journal est effacé, le dossier de préparation purgé,</text><text x="416" y="288" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">le résultat est mémorisé pour le panneau d&#x27;admin.</text><rect x="20" y="216" width="370" height="150" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="36" y="242" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Retour arrière automatique</text><text x="36" y="268" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">1. arrêt du serveur neuf, attente du port</text><text x="36" y="288" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">2. journal marqué « rolling_back » AVANT d&#x27;agir</text><text x="36" y="308" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">3. renommages inverses (l&#x27;ancien arbre revient)</text><text x="36" y="328" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">4. ancien serveur relancé, sonde de confirmation</text><text x="36" y="348" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">5. résultat « rolled_back » visible dans l&#x27;admin</text><rect x="20" y="392" width="760" height="186" rx="12" fill="#fff" stroke="#4a5468" stroke-width="1.2" stroke-dasharray="6 5"/><text x="36" y="418" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start">Et si le superviseur lui-même meurt (coupure de courant) ?</text><text x="36" y="444" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start">Au prochain démarrage, le serveur trouve le journal et décide :</text><rect x="36" y="460" width="350" height="96" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="46" y="496.2" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start">Aller de l&#x27;avant seulement si…</text><text x="46" y="512.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">phase « applied » ou « done », version = cible</text><text x="46" y="528.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">ET chaque fichier a le bon SHA-256</text><rect x="406" y="460" width="358" height="96" rx="10" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="416" y="496.2" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start">Dans tout autre cas : retour arrière</text><text x="416" y="512.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">(y compris un retour arrière interrompu :</text><text x="416" y="528.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">on ne se fie jamais à la seule version)</text></svg>