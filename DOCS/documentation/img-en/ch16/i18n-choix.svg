<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="470" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Which language? Which sentence?</text>
<text x="24" y="60" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" xml:space="preserve">A. On load, the language is chosen like this</text>
<rect x="24" y="72" width="360" height="360" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="36" y="94" width="30" height="30" rx="15.0" fill="#e8edff" stroke="#3b5bdb" stroke-width="1"/>
<text x="51.0" y="113.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">1</text>
<text x="78" y="106" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">Choice already made? </text>
<text x="78" y="124" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">iribhm-lang key of the browser</text>
<line x1="51" y1="132" x2="51" y2="162" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="36" y="168" width="30" height="30" rx="15.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/>
<text x="51.0" y="187.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">2</text>
<text x="78" y="180" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">Browser language</text>
<text x="78" y="198" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">“fr-BE” → “fr”</text>
<line x1="51" y1="206" x2="51" y2="236" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="36" y="242" width="30" height="30" rx="15.0" fill="#eef0f5" stroke="#4a5468" stroke-width="1"/>
<text x="51.0" y="261.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">3</text>
<text x="78" y="254" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">English</text>
<text x="78" y="272" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">fallback language, always there</text>
<text x="36" y="318" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">The language must exist in lang/ (list read via</text>
<text x="36" y="335" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">/api/languages, else lang/manifest.json).</text>
<text x="36" y="362" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">Loads “en” first, then the chosen language; if its</text>
<text x="36" y="379" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">file fails, the interface stays in English.</text>
<text x="36" y="406" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">A click in the menu stores the choice and tells</text>
<text x="36" y="423" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">the other open pages (“storage” event).</text>
<text x="416" y="60" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" xml:space="preserve">B. For each text, I18n.t('key') looks</text>
<rect x="416" y="72" width="368" height="360" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="428" y="94" width="30" height="30" rx="15.0" fill="#e8edff" stroke="#3b5bdb" stroke-width="1"/>
<text x="443.0" y="113.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">1</text>
<text x="470" y="106" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">current language</text>
<text x="470" y="124" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">fr: “Explorez les {specimenPlural}”</text>
<rect x="428" y="156" width="30" height="30" rx="15.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/>
<text x="443.0" y="175.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">2</text>
<text x="470" y="168" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">else English</text>
<text x="470" y="186" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">en: “Explore {SpecimenPlural}”</text>
<rect x="428" y="218" width="30" height="30" rx="15.0" fill="#fff0f0" stroke="#c92a2a" stroke-width="1"/>
<text x="443.0" y="237.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="middle" xml:space="preserve">3</text>
<text x="470" y="230" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">else the key itself</text>
<text x="470" y="248" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">“landing.heroTitle” (visible gap)</text>
<text x="428" y="288" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">Then each {token} is replaced:</text>
<text x="428" y="310" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">1. value passed by the caller</text>
<text x="428" y="330" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">2. instance value (brand, specimen…)</text>
<text x="428" y="350" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">3. otherwise the {token} stays as is</text>
<rect x="428" y="380" width="344" height="42" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/>
<text x="600" y="397" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">fr → “Explorez les embryons”</text>
<text x="600" y="414" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">nl → “Verken Embryos” (no nl in the specimen)</text>
</svg>
