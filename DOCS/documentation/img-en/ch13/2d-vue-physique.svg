<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrs_4a5468" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="330" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The split view exchanges a physical view, not pixels</text><rect x="20" y="56" width="340" height="140" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Left side: photo A (2 µm/px)</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >scale = 0.5 screen pixel per image pixel → umPerCss =</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >2 / 0.5 = 4 µm per screen pixel. centerUm = offset, in</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >µm, of the screen centre from the photo's centre.</text><line x1="364" y1="126" x2="436" y2="126" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)" marker-start="url(#arrs_4a5468)" /><text x="400" y="116" font-size="10.5" font-weight="800" fill="#4a5468" text-anchor="middle" >WM_SET_PHYSICAL_VIEW</text><rect x="440" y="56" width="340" height="140" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="454" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Right side: photo B (3.2 µm/px)</text><text x="454" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Receives umPerCss = 4 → scale = 3.2 / 4 = 0.8 screen</text><text x="454" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >pixel per image pixel, and recentres on the same offset</text><text x="454" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >in µm: same physical magnification.</text><rect x="20" y="216" width="760" height="100" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="240" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Anti-echo: the page that receives a view does not send it back (reason ≠ 'user'), and the plugin ignores what comes back</text><text x="36" y="257.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >while it applies it. A photo without calibration neither sends nor receives a physical view. In Compare the same rule applies</text><text x="36" y="274.5" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >to every calibrated photograph panel.</text></svg>