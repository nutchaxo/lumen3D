<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >“Linked” datasets: four rules, four kinds</text><rect x="20" y="60" width="520" height="56" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><text x="36" y="84" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >registered</text><text x="36" y="102" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >One of the two carries a registration block (registration transforms).</text><rect x="20" y="126" width="520" height="56" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="36" y="150" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >related</text><text x="36" y="168" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >one's relatedIds names the other (in either direction).</text><rect x="20" y="192" width="520" height="56" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><text x="36" y="216" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >same-embryo</text><text x="36" y="234" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Same embryo number and same stage.</text><rect x="20" y="258" width="520" height="56" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.3" /><text x="36" y="282" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >context</text><text x="36" y="300" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Same dissection date and same stage (possibly another embryo).</text><rect x="560" y="60" width="220" height="254" rx="12" fill="#f1f3f5" stroke="#4a5468" stroke-width="1.4" /><text x="574" y="84.8" font-size="13.5" font-weight="800" fill="#4a5468" text-anchor="start" >What it is for</text><text x="574" y="105.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The explorer shows the “Linked”</text><text x="574" y="121.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >badge; the 2D page and the</text><text x="574" y="138.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >viewer list linked datasets of</text><text x="574" y="155.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >another type (a photograph to its</text><text x="574" y="171.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >volume). The order shown is the</text><text x="574" y="188.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >order tested: the first that applies</text><text x="574" y="204.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gives the kind displayed.</text></svg>