<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 474" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="474" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The states of a dataset being imported</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >What you can do in each state, and what happens to an abandoned import.</text><rect x="24" y="80" width="182" height="156" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><text x="115" y="104" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="middle" >Sending — not editable</text><text x="115" y="122" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploading</text><text x="36" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >tier ≤ 1 files</text><text x="36" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >not all there yet</text><text x="36" y="196" font-size="11.2" font-weight="700" fill="#e67700" text-anchor="start" >open: no</text><text x="36" y="213" font-size="11.2" font-weight="700" fill="#e67700" text-anchor="start" >edit: no</text><rect x="214" y="80" width="182" height="156" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8" /><text x="305" y="104" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle" >Sending — editable</text><text x="305" y="122" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >editable</text><text x="226" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >metadata + manifest</text><text x="226" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >+ coarse level</text><text x="226" y="196" font-size="11.2" font-weight="700" fill="#3b5bdb" text-anchor="start" >open: yes (low resolution)</text><text x="226" y="213" font-size="11.2" font-weight="700" fill="#3b5bdb" text-anchor="start" >edit: yes</text><rect x="404" y="80" width="182" height="156" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><text x="495" y="104" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Sent — to publish</text><text x="495" y="122" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >staged</text><text x="416" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >every file</text><text x="416" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >finished and checked</text><text x="416" y="196" font-size="11.2" font-weight="700" fill="#2b8a3e" text-anchor="start" >validate, publish</text><text x="416" y="213" font-size="11.2" font-weight="700" fill="#2b8a3e" text-anchor="start" >never purged</text><rect x="594" y="80" width="182" height="156" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.8" /><text x="685" y="104" font-size="12.5" font-weight="800" fill="#4a5468" text-anchor="middle" >Published</text><text x="685" y="122" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >published</text><text x="606" y="148" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >moved to DATA_WEB/</text><text x="606" y="165" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" >hidden by default</text><text x="606" y="196" font-size="11.2" font-weight="700" fill="#4a5468" text-anchor="start" >journal deleted</text><text x="606" y="213" font-size="11.2" font-weight="700" fill="#4a5468" text-anchor="start" >(visibility to enable)</text><line x1="206" y1="158" x2="214" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><line x1="396" y1="158" x2="404" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><line x1="586" y1="158" x2="594" y2="158" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="262" width="752" height="128" rx="12" fill="#fff" stroke="#c92a2a" stroke-width="1.6" /><text x="40" y="286" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Interrupted (stalled), then purged</text><text x="44" y="312" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• no chunk accepted for 7 days (604,800 s): the state becomes “stalled” (Interrupted);</text><text x="44" y="331" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• the cleanup (on every list, or the gc action) then deletes its files and journal;</text><text x="44" y="350" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• a “Sent — to publish” dataset is NEVER purged: it is finished work waiting for your click;</text><text x="44" y="369" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• dropping the same folder again restarts the clock: only the missing chunks are resent.</text><rect x="24" y="404" width="752" height="52" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="427" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" >“Editable” = tier ≤ 1 files are finished AND metadata.json AND (manifest or preview) have arrived.</text><text x="400" y="445" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >As soon as you save an edit, metadata.json is locked (metaLocked): the transfer no longer rewrites it.</text></svg>