<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >What a Studio “document” is</text><rect x="20" y="56" width="440" height="448" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="36" y="82" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >document (version 2)</text><rect x="34" y="104" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="129" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">dataset</text><text x="222" y="124" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >id, name, type, path, dimensions</text><rect x="34" y="150" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="175" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">timepoint · sourceSlice</text><text x="222" y="170" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >frame, size and quality of the slice</text><rect x="34" y="196" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="221" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">planeSpec</text><text x="222" y="209.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >the plane: mode, axis, yaw, pitch, roll,</text><text x="222" y="223" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >thickness</text><rect x="34" y="242" width="410" height="40" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.1" /><text x="46" y="267" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">channelState[ ]</text><text x="222" y="255.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >colour, min, max, gamma, opacity of</text><text x="222" y="269" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >each channel</text><rect x="34" y="288" width="410" height="40" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.1" /><text x="46" y="313" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">calibration</text><text x="222" y="301.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >µm per pixel (x and y), span, physical</text><text x="222" y="315" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >size</text><rect x="34" y="334" width="410" height="40" rx="9" fill="#fff4e6" stroke="#e67700" stroke-width="1.1" /><text x="46" y="359" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" font-family="JetBrains Mono, monospace">layers[ ]</text><text x="222" y="354" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >the annotations, bottom to top</text><rect x="34" y="380" width="410" height="40" rx="9" fill="#fff4e6" stroke="#e67700" stroke-width="1.1" /><text x="46" y="405" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" font-family="JetBrains Mono, monospace">guides[ ] · groups[ ]</text><text x="222" y="400" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >alignment guides · groupings</text><rect x="34" y="426" width="410" height="40" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.1" /><text x="46" y="451" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">viewport</text><text x="222" y="446" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >zoom, pan, view rotation</text><rect x="34" y="472" width="410" height="40" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.1" /><text x="46" y="497" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" font-family="JetBrains Mono, monospace">layoutMaps[ ]</text><text x="222" y="485.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Compare: one cell per panel</text><text x="222" y="499" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >(rectangle, µm/px, channels)</text><rect x="484" y="56" width="296" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="498" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >In the JSON file</text><text x="498" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >All of the above, as text: layers, guides,</text><text x="498" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >channels, plane, calibration, Compare cells.</text><text x="498" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >No pixel. A file over 5 MB, 2,000 layers or</text><text x="498" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >10,000 points is refused on reading.</text><rect x="484" y="246" width="296" height="258" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="498" y="270.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Never in the file</text><text x="498" y="291.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >For each cell of a Compare figure, three</text><text x="498" y="308.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >runtime fields: the raw channel values (raw),</text><text x="498" y="325.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >the page frame (iframe) and the slice itself</text><text x="498" y="343.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >(sliceResult). They live in memory while the</text><text x="498" y="360.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Studio is open; _portableDocument() strips</text><text x="498" y="377.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >them at every export.</text></svg>