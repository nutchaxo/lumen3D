<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 396" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="396" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Une valeur « par langue » : qui répond quoi ?</text>
<rect x="24" y="56" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="40" y="82" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" xml:space="preserve">config/instance.json  →  specimen.plural</text>
<text x="40" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">{ "en": "embryos",  "fr": "embryons",  "es": "embriones" }</text>
<text x="40" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">Langue du visiteur</text>
<text x="240" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">Réponse</text>
<text x="430" y="156" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">Pourquoi</text>
<rect x="40" y="168" width="150" height="34" rx="17.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/>
<text x="115.0" y="189.55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">fr</text>
<line x1="196" y1="185" x2="232" y2="185" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="240" y="190" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">embryons</text>
<text x="430" y="190" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">la langue existe dans l'objet</text>
<rect x="40" y="212" width="150" height="34" rx="17.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/>
<text x="115.0" y="233.55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" xml:space="preserve">nl</text>
<line x1="196" y1="229" x2="232" y2="229" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="240" y="234" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">embryos</text>
<text x="430" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">absente → on prend « en »</text>
<rect x="40" y="256" width="150" height="34" rx="17.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/>
<text x="115.0" y="277.55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" xml:space="preserve">ja</text>
<line x1="196" y1="273" x2="232" y2="273" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="240" y="278" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">embryos</text>
<text x="430" y="278" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">absente → on prend « en »</text>
<rect x="40" y="300" width="150" height="34" rx="17.0" fill="#eef0f5" stroke="#4a5468" stroke-width="1"/>
<text x="115.0" y="321.55" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">(sans «en»)</text>
<line x1="196" y1="317" x2="232" y2="317" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="240" y="322" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" xml:space="preserve">1re valeur trouvée</text>
<text x="430" y="322" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">dernier recours : ni la langue ni « en »</text>
<text x="400" y="366" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">Ordre : langue du visiteur → « en » → première valeur.</text>
<text x="400" y="384" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">Une chaîne simple (sans accolades) vaut pour toutes les langues.</text>
</svg>
