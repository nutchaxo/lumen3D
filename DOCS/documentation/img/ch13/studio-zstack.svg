<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="392" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >De l'écran à la figure : le plan du Z-stack vient du repère de l'écran</text><rect x="20" y="56" width="240" height="150" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① Le repère de l'écran</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >getScreenFrameInVolume() : où</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >pointent la droite et le haut de l'écran</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >dans le volume (proportions</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >physiques), et vers quoi regarde la</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >caméra.</text><line x1="262" y1="130" x2="290" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="294" y="56" width="240" height="150" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="308" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② Face et roulis</text><text x="308" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >La face +Z (lacet 0) ou −Z (lacet</text><text x="308" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >180°, image miroir) la plus proche de</text><text x="308" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'écran, puis le roulis dans le plan : r</text><text x="308" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= atan2(r̂y − ûx ; r̂x + ûy).</text><line x1="536" y1="130" x2="564" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="568" y="56" width="212" height="150" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="582" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ Un plan oblique</text><text x="582" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >mode oblique, axe z, tangage 0,</text><text x="582" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >lacet 0 ou 180, roulis r, position</text><text x="582" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >c = (début + n/2)/z.</text><rect x="20" y="226" width="760" height="156" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="250" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Exemple du jeu de démonstration : curseur sur les coupes 59 à 70 (12 coupes) sur 112</text><circle cx="42" cy="270" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="274" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >indices 58 à 69 : c = (58 + 12/2) / 112 = 0,571 : le plan est posé au milieu des 12 coupes.</text><circle cx="42" cy="293.6" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="297.6" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >épaisseur = 12 échantillons, un par coupe (pas de 1/112) ; MIP dès que n &gt; 1.</text><circle cx="42" cy="317.2" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="321.2" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sur la face −Z la position devient 1 − c = 0,429 : les deux faces lisent les mêmes coupes.</text><circle cx="42" cy="340.8" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="344.8" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >série stabilisée : la tranche est prise dans la boîte d'affichage, échantillonnée à travers le même « warp » que l'écran.</text></svg>