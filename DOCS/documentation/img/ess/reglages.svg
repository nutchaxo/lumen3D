<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="250" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="16.5" font-weight="800" fill="#1c2333">Régler un canal : min, max, gamma — exemple d'un voxel de valeur 120</text><rect x="12" y="62" width="140" height="130" rx="14" fill="#fff" stroke="#c5cbd8"/><rect x="12" y="62" width="140" height="40" rx="14" fill="#e8edff"/><rect x="12" y="86" width="140" height="16" fill="#e8edff"/><text x="82.0" y="87" text-anchor="middle" font-size="11.5" font-weight="800" fill="#3b5bdb">Valeur stockée</text><text x="82.0" y="142" text-anchor="middle" font-size="22" font-weight="800" fill="#1c2333">120</text><text x="82.0" y="172" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">sur 0 – 255</text><line x1="153" y1="127" x2="166" y2="127" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="167" y="62" width="140" height="130" rx="14" fill="#fff" stroke="#c5cbd8"/><rect x="167" y="62" width="140" height="40" rx="14" fill="#f3f0ff"/><rect x="167" y="86" width="140" height="16" fill="#f3f0ff"/><text x="237.0" y="79" text-anchor="middle" font-size="11" font-weight="800" fill="#7048e8">Fenêtre min 20</text><text x="237.0" y="92" text-anchor="middle" font-size="11" font-weight="800" fill="#7048e8">/ max 220</text><text x="237.0" y="142" text-anchor="middle" font-size="22" font-weight="800" fill="#1c2333">0,500</text><text x="237.0" y="172" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">(120 − 20) / 200</text><line x1="308" y1="127" x2="321" y2="127" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="322" y="62" width="140" height="130" rx="14" fill="#fff" stroke="#c5cbd8"/><rect x="322" y="62" width="140" height="40" rx="14" fill="#e3fafc"/><rect x="322" y="86" width="140" height="16" fill="#e3fafc"/><text x="392.0" y="87" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0c8599">Gamma 0,5</text><text x="392.0" y="142" text-anchor="middle" font-size="22" font-weight="800" fill="#1c2333">0,707</text><text x="392.0" y="172" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">0,5 ^ 0,5</text><line x1="463" y1="127" x2="476" y2="127" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="477" y="62" width="140" height="130" rx="14" fill="#fff" stroke="#c5cbd8"/><rect x="477" y="62" width="140" height="40" rx="14" fill="#fff4e6"/><rect x="477" y="86" width="140" height="16" fill="#fff4e6"/><text x="547.0" y="87" text-anchor="middle" font-size="11.5" font-weight="800" fill="#e67700">Opacité 70 %</text><text x="547.0" y="142" text-anchor="middle" font-size="22" font-weight="800" fill="#1c2333">0,495</text><text x="547.0" y="172" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">0,707 × 0,7</text><line x1="618" y1="127" x2="631" y2="127" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="632" y="62" width="140" height="130" rx="14" fill="#fff" stroke="#c5cbd8"/><rect x="632" y="62" width="140" height="40" rx="14" fill="#ebfbee"/><rect x="632" y="86" width="140" height="16" fill="#ebfbee"/><text x="702.0" y="87" text-anchor="middle" font-size="11.5" font-weight="800" fill="#2b8a3e">Couleur du canal</text><text x="702.0" y="142" text-anchor="middle" font-size="16" font-weight="800" fill="#1c2333">vert × 0,495</text><text x="702.0" y="172" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">puis addition des canaux</text><text x="400" y="226" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5468" font-style="italic">Ces réglages ne changent que l'affichage : les données sur le serveur ne sont jamais modifiées.</text></svg>