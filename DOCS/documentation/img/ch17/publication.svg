<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 478" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="478" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Publier, et remplacer un jeu déjà publié</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Tout ou rien : le visiteur voit l'ancien jeu ou le nouveau, jamais un mélange.</text><rect x="24" y="72" width="178" height="124" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62" y="101" font-size="12.3" font-weight="800" fill="#3b5bdb" text-anchor="start" >Valider</text><text x="34" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >validate_dataset</text><text x="34" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >sinon 409</text><text x="34" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >validation_failed</text><rect x="215" y="72" width="178" height="124" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="235" cy="96" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="235" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="253" y="101" font-size="12.3" font-weight="800" fill="#7048e8" text-anchor="start" >Reprendre les clés curées</text><text x="225" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >si le dossier existe déjà</text><text x="225" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >et overwrite = true</text><text x="225" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >(clés absentes du nouveau)</text><line x1="202" y1="140" x2="215" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="406" y="72" width="178" height="124" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="426" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="426" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="444" y="101" font-size="12.3" font-weight="800" fill="#e67700" text-anchor="start" >Échanger les dossiers</text><text x="416" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >ancien → .replaced-&lt;jeu&gt;-&lt;date&gt;</text><text x="416" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >staging → DATA_WEB/…/&lt;jeu&gt;</text><text x="416" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >(deux renommages)</text><line x1="393" y1="140" x2="406" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="597" y="72" width="178" height="124" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.7" /><circle cx="617" cy="96" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="617" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="635" y="101" font-size="12.3" font-weight="800" fill="#2b8a3e" text-anchor="start" >Conclure</text><text x="607" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >galerie de l'ancien reprise</text><text x="607" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >.replaced supprimé</text><text x="607" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >journal supprimé</text><line x1="584" y1="140" x2="597" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="214" width="752" height="134" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="238" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Un essai réel (moteur d'import, dossier temporaire)</text><text x="44" y="262" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" >Avant : le jeu publié a été édité (orientation, galerie, un nom corrigé, hidden = false).</text><text x="44" y="279" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" >On reglisse le dossier du pipeline (qui contient son propre nom) puis : Publier → 409 already_exists.</text><text x="44" y="296" font-size="11.4" font-weight="700" fill="#1c2333" text-anchor="start" >Remplacer → carriedKeys = [gallery, orientation], carriedGallery = true,</text><text x="44" y="313" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" >mais le nom revient à celui du pipeline : le nouveau fichier l'énonce, il gagne.</text><text x="44" y="330" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" >formatVersion vaut 4 (celui du nouveau), jamais l'ancien chiffre.</text><rect x="24" y="364" width="752" height="96" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.5" /><text x="40" y="388" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Et si le serveur s'arrête au milieu ?</text><text x="44" y="410" font-size="11.3" font-weight="400" fill="#1c2333" text-anchor="start" >Au démarrage suivant, recover_publish_leftovers() règle ce qui reste dans DATA_WEB/&lt;type&gt;/ :</text><text x="44" y="428" font-size="11.3" font-weight="400" fill="#1c2333" text-anchor="start" >• .replaced-&lt;jeu&gt;-… sans le dossier &lt;jeu&gt; : la panne était entre les deux renommages → l'ancien est remis en place ;</text><text x="44" y="446" font-size="11.3" font-weight="400" fill="#1c2333" text-anchor="start" >• .replaced-&lt;jeu&gt;-… avec &lt;jeu&gt; : supprimé ; .incoming-&lt;jeu&gt;-… (copie partielle entre disques) : toujours supprimé.</text></svg>