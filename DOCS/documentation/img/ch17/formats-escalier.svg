" y="215" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="225" y="215" font-size="15" font-weight="800" fill="#e67700" text-anchor="start" >planes/</text><text x="191" y="245" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >un fichier par plan Z</text><text x="191" y="263" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >PNG 512² sans perte</text><text x="191" y="281" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >coupes XY rapides</text><rect x="187" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#e67700" stroke-width="1.3" /><text x="247.5" y="337" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m002-planes</text><line x1="165" y1="243" x2="177" y2="243" stroke="#e67700" stroke-width="2.4" marker-end="url(#arr)"/><rect x="330" y="151" width="141" height="203" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.8" /><circle cx="354" cy="177" r="15" fill="#0c8599" stroke="none" stroke-width="1"/><text x="354" y="183" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="378" y="183" font-size="15" font-weight="800" fill="#0c8599" text-anchor="start" >mips/</text><text x="344" y="213" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >MIP par couche de 64</text><text x="344" y="231" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >rangé comme planes/</text><text x="344" y="249" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >z-stack rapides</text><rect x="340" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#0c8599" stroke-width="1.3" /><text x="400.5" y="337" font-size="11.5" font-weight="700" fill="#0c8599" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m003-layer-mips</text><line x1="318" y1="211" x2="330" y2="211" stroke="#0c8599" stroke-width="2.4" marker-end="url(#arr)"/><rect x="483" y="119" width="141" height="235" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><circle cx="507" cy="145" r="15" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="507" y="151" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="531" y="151" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start" >briques v3</text><text x="497" y="181" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >briques 66³</text><text x="497" y="199" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >bordure, Z réduit</text><text x="497" y="217" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >index.bin, détail local</text><rect x="493" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#2b8a3e" stroke-width="1.3" /><text x="553.5" y="337" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m004-bricks-v3</text><line x1="471" y1="179" x2="483" y2="179" stroke="#2b8a3e" stroke-width="2.4" marker-end="url(#arr)"/><rect x="636" y="87" width="141" height="267" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8" /><circle cx="660" cy="113" r="15" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="660" y="119" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="684" y="119" font-size="15" font-weight="800" fill="#3b5bdb" text-anchor="start" >matrice</text><text x="650" y="149" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >niveaux 256·2ᵏ, tout Z</text><text x="650" y="167" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >5 compressions</text><text x="650" y="185" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >copies de coupe</text><rect x="646" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#3b5bdb" stroke-width="1.3" /><text x="706.5" y="337" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m005-matrix</text><line x1="624" y1="147" x2="636" y2="147" stroke="#3b5bdb" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="372" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="396" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >À retenir</text><text x="40" y="416" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• le viewer sait lire les formats 1 à 5 ; les marches 2 à 5 ne servent qu'à aller plus vite et plus beau ;</text><text x="40" y="434" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• le pipeline 0.22.0 écrit le format 4 (le 5 avec --format 5) ; l'onglet Mises à jour des données monte au 5.</text></svg>