<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="424" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Du dossier déposé au jeu publié</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Six étapes ; seules les trois du milieu transportent des octets.</text><rect x="24.0" y="72" width="118" height="124" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44.0" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44.0" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62.0" y="101" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Déposer</text><text x="34.0" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >glissez le dossier</text><text x="34.0" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >le navigateur le lit</text><text x="34.0" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >(8 fichiers à la fois)</text><rect x="150.8" y="72" width="118" height="124" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="170.8" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="170.8" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="188.8" y="101" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Planifier</text><text x="160.8" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >1 requête par jeu :</text><text x="160.8" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >la liste des fichiers</text><text x="160.8" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >+ leurs tailles</text><rect x="277.6" y="72" width="118" height="124" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="297.6" cy="96" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="297.6" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="315.6" y="101" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Envoyer</text><text x="287.6" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >blocs de 8 Mio</text><text x="287.6" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >SHA-256 par bloc</text><text x="287.6" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >4 en parallèle</text><rect x="404.4" y="72" width="118" height="124" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="424.4" cy="96" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="424.4" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="442.4" y="101" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Refermer</text><text x="414.4" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >un fichier fini :</text><text x="414.4" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >taille + contenu +</text><text x="414.4" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >empreinte globale</text><rect x="531.2" y="72" width="118" height="124" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="551.2" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="551.2" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="569.2" y="101" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Vérifier</text><text x="541.2" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >le jeu est-il</text><text x="541.2" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >entier et cohérent ?</text><text x="541.2" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >(codes d'erreur)</text><rect x="658.0" y="72" width="118" height="124" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.7" /><circle cx="678.0" cy="96" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="678.0" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="696.0" y="101" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >Publier</text><text x="668.0" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >un renommage</text><text x="668.0" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >vers DATA_WEB/</text><text x="668.0" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >masqué par défaut</text><rect x="24" y="214" width="366" height="28" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="207" y="233" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >dans le navigateur (un Web Worker fait tout le transfert)</text><rect x="400" y="214" width="376" height="28" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.3" /><text x="588" y="233" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" >sur le serveur : staging jamais servi, puis DATA_WEB/</text><rect x="24" y="258" width="752" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="282" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Les trois garanties qui font la différence</text><text x="44" y="312" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Reprise : </text><text x="130" y="312" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >un journal note chaque bloc reçu ; reglisser le dossier reprend au bloc près, même sous l'autre serveur.</text><text x="44" y="342" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Contrôle : </text><text x="130" y="342" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >rien n'est écrit avant d'avoir vérifié le chemin (liste blanche) et l'empreinte du bloc.</text><text x="44" y="372" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Priorité : </text><text x="130" y="372" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >les fichiers qui rendent le jeu ouvrable partent d'abord (paliers) : on peut l'éditer avant la fin.</text><text x="44" y="396" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="start" >Rien n'atteint DATA_WEB/ sans votre clic sur Publier.</text></svg>