<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="448" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">La vie d'un plugin dans la page</text><rect x="24" y="70" width="182" height="104" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="70" width="182" height="30" rx="12" fill="#eef0f5" stroke="#c5cbd8" stroke-width="1.2"/><text x="115" y="91" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#4a5468" text-anchor="middle">registered</text><text x="115" y="128" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">index.js exécuté</text><rect x="35" y="140" width="160" height="24" rx="12.0" fill="#eef0f5" stroke="#4a5468" stroke-width="1"/><text x="115.0" y="156.3" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a5468" text-anchor="middle">implement(id, {…})</text><rect x="214" y="70" width="182" height="104" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="214" y="70" width="182" height="30" rx="12" fill="#e8edff" stroke="#c5cbd8" stroke-width="1.2"/><text x="305" y="91" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle">initialized</text><text x="305" y="128" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">contexte reçu</text><rect x="225" y="140" width="160" height="24" rx="12.0" fill="#e8edff" stroke="#3b5bdb" stroke-width="1"/><text x="305.0" y="156.3" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle">prepare → init(ctx)</text><rect x="404" y="70" width="182" height="104" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="404" y="70" width="182" height="30" rx="12" fill="#ebfbee" stroke="#c5cbd8" stroke-width="1.2"/><text x="495" y="91" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle">active</text><text x="495" y="128" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">outil ou bascule en marche</text><rect x="415" y="140" width="160" height="24" rx="12.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="495.0" y="156.3" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle">activate()</text><rect x="594" y="70" width="182" height="104" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="594" y="70" width="182" height="30" rx="12" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1.2"/><text x="685" y="91" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle">disposed</text><text x="685" y="128" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">page quittée</text><rect x="605" y="140" width="160" height="24" rx="12.0" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/><text x="685.0" y="156.3" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle">dispose()</text><line x1="206" y1="122" x2="212" y2="122" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><line x1="396" y1="122" x2="402" y2="122" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><line x1="586" y1="122" x2="592" y2="122" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><path d="M495,178 C495,205 305,205 305,180" fill="none" stroke="#2b8a3e" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="216" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">deactivate() : retour à « initialized »</text><rect x="24" y="236" width="752" height="50" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="400" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#c92a2a" text-anchor="middle">quarantined</text><text x="400" y="277" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#4a5468" text-anchor="middle">implement() jamais appelé · init() qui lève une exception · retiré à chaud (révocation)</text><text x="24" y="316" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Crochets facultatifs, appelés quand la page en a besoin :</text><rect x="24" y="330" width="372" height="38" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="34" y="354" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="start">getState / setState</text><text x="190" y="354" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="start">enregistrer / rétablir l'espace de travail</text><rect x="404" y="330" width="372" height="38" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="414" y="354" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="start">reset</text><text x="570" y="354" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="start">retour à l'état « dataset neuf »</text><rect x="24" y="374" width="372" height="38" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="34" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="start">onLanguageChange</text><text x="190" y="398" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="start">repeindre les textes dynamiques</text><rect x="404" y="374" width="372" height="38" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="414" y="398" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="start">getExports / getGraph</text><text x="570" y="398" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="start">alimenter le Centre de téléchargement</text><text x="400" y="438" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#4a5468" text-anchor="middle">Chaque appel est isolé par try/catch : un plugin en panne ne bloque jamais les autres.</text></svg>
