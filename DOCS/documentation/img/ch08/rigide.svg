<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="348" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Un mouvement rigide : tourner et glisser, sans déformer</text><rect x="30" y="60" width="220" height="200" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><circle cx="95.0" cy="110.0" r="6" fill="#3b5bdb"/><circle cx="155.0" cy="120.0" r="6" fill="#3b5bdb"/><circle cx="185.0" cy="170.0" r="6" fill="#3b5bdb"/><circle cx="125.0" cy="200.0" r="6" fill="#3b5bdb"/><circle cx="85.0" cy="160.0" r="6" fill="#3b5bdb"/><polygon points="95.0,110.0 155.0,120.0 185.0,170.0 125.0,200.0 85.0,160.0" fill="#b2c8ff" fill-opacity=".35" stroke="#3b5bdb" stroke-width="1.6"/><text x="140" y="285" font-size="12.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >Image 1 : position de référence</text><rect x="290" y="60" width="220" height="200" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><circle cx="380.0" cy="98.0" r="6" fill="#e67700"/><circle cx="428.3" cy="135.0" r="6" fill="#e67700"/><circle cx="431.3" cy="193.2" r="6" fill="#e67700"/><circle cx="364.2" cy="191.5" r="6" fill="#e67700"/><circle cx="347.7" cy="137.5" r="6" fill="#e67700"/><polygon points="380.0,98.0 428.3,135.0 431.3,193.2 364.2,191.5 347.7,137.5" fill="#ffd8a8" fill-opacity=".35" stroke="#e67700" stroke-width="1.6"/><text x="400" y="285" font-size="12.5" font-weight="700" fill="#e67700" text-anchor="middle" >Image 4 : l'embryon a bougé</text><line x1="252" y1="160" x2="288" y2="160" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><line x1="512" y1="160" x2="548" y2="160" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><rect x="550" y="60" width="220" height="200" rx="