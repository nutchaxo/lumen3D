<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="344" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >La planche de figure : même échelle physique ou même taille</text><text x="400" y="58" font-size="12.5" font-weight="600" fill="#4a5468" text-anchor="middle" >Exemple : photo A 1920 × 1440 px à 2,0 µm/px · photo B 1600 × 1200 px à 3,2 µm/px</text><rect x="20" y="76" width="370" height="250" rx="14" fill="#fff" stroke="#2b8a3e" stroke-width="1.4" /><text x="205" y="100" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Même échelle physique</text><rect x="40" y="116" width="160" height="120" rx="4" fill="#f8f9fa" stroke="#c5cbd8" stroke-width="1" stroke-dasharray="3 3"/><rect x="60" y="131" width="120" height="90" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="120" y="181" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" >A · 1200 × 900</text><rect x="215" y="116" width="160" height="120" rx="4" fill="#f8f9fa" stroke="#c5cbd8" stroke-width="1" stroke-dasharray="3 3"/><rect x="215" y="116" width="160" height="120" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="295" y="181" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" >B · 1600 × 1200</text><text x="36" y="276" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Chaque photo est ramenée au pixel le plus grossier (3,2</text><text x="36" y="292.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >µm). A × 0,625 → 1200 × 900 ; B reste 1:1. Une seule barre</text><text x="36" y="309.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >vaut pour les deux. Jamais d'agrandissement.</text><rect x="410" y="76" width="370" height="250" rx="14" fill="#fff" stroke="#3b5bdb" stroke-width="1.4" /><text x="595" y="100" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle" >Même taille d'image</text><rect x="430" y="116" width="160" height="120" rx="4" fill="#f8f9fa" stroke="#c5cbd8" stroke-width="1" stroke-dasharray="3 3"/><rect x="430" y="116" width="160" height="120" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="510" y="181" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >A · 1600 × 1200</text><rect x="605" y="116" width="160" height="120" rx="4" fill="#f8f9fa" stroke="#c5cbd8" stroke-width="1" stroke-dasharray="3 3"/><rect x="605" y="116" width="160" height="120" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="685" y="181" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >B · 1600 × 1200</text><text x="426" y="276" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Chaque photo remplit la même cellule (1600 × 1200). A ×</text><text x="426" y="292.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >0,833, B × 1. Chaque panneau porte sa propre barre</text><text x="426" y="309.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d'échelle.</text><text x="215" y="312" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >barre commune sous la planche</text><text x="595" y="312" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >une barre par panneau</text></svg>