<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 516" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="516" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The life of a migration job</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >States written in the journal; each arrow carries the API call that causes it.</text><text x="56" y="123" font-size="12" font-weight="600" fill="#4a5468" text-anchor="middle" >(none)</text><rect x="170" y="90" width="140" height="60" rx="14" fill="#e8edff" stroke="#3b5bdb" stroke-width="2" /><text x="240.0" y="112" font-size="15" font-weight="800" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >running</text><text x="240.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >unit_put / unit_run</text><rect x="380" y="90" width="150" height="56" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="2" /><text x="455.0" y="112" font-size="15" font-weight="800" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >assembling</text><text x="455.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >resumable assembly</text><rect x="590" y="90" width="130" height="56" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2" /><text x="655.0" y="112" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >swapped</text><text x="655.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >swap done</text><rect x="380" y="226" width="150" height="56" rx="14" fill="#fff0f0" stroke="#c92a2a" stroke-width="2" /><text x="455.0" y="248" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >failed</text><text x="455.0" y="266" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >source_changed…</text><rect x="560" y="226" width="200" height="56" rx="14" fill="#fff" stroke="#2b8a3e" stroke-width="2" /><text x="660" y="250" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle" >finished</text><text x="660" y="268" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >journal and tiles deleted</text><line x1="86" y1="120" x2="170" y2="120" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="128" y="110" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >plan</text><line x1="310" y1="118" x2="380" y2="118" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="345" y="108" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><line x1="530" y1="118" x2="590" y2="118" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="560" y="108" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><line x1="655" y1="146" x2="660" y2="226" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="668" y="190" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><line x1="455" y1="146" x2="455" y2="226" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="463" y="190" font-size="10.8" font-weight="600" fill="#c92a2a" text-anchor="start" >the manifest changed</text><path d="M 270 150 L 270 254 L 380 254" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 4"/><path d="M 380 272 L 205 272 L 205 152" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="293" y="290" font-size="10.5" font-weight="600" fill="#c92a2a" text-anchor="middle" >plan: start clean</text><rect x="24" y="312" width="752" height="188" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="336" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >What to know</text><text x="44" y="362" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• Pause: it is the tab that stops, not the journal — it stays “running” and resumes as is.</text><text x="44" y="388" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• finalize answers complete:false until done: call it again (assembly in pieces).</text><text x="44" y="414" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• swapped = the new files are in place, the version is not bumped yet. A crash here is harmless.</text><text x="44" y="440" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• failed + source_changed (from running or assembling): the dataset was re-processed; plan empties the tiles and restarts.</text><text x="44" y="466" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• cancel (the cross): deletes journal and tiles; the dataset stays exactly as it was.</text></svg>