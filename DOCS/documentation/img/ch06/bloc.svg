<text x="165" y="163" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >72</text>
<text x="320" y="70" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >coupe z + 1</text>
<rect x="250" y="82" width="70" height="50" fill="rgb(84,84,84)" stroke="#fff" stroke-width="2"/>
