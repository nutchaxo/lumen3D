<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="358" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Le trajet d'une image de galerie</text><rect x="20" y="56" width="178" height="176" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >1 · Envoi</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >L'administrateur glisse</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >une image (capture</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >annotée, figure). Le corps</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >part brut, sans</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >conversion.</text><line x1="200" y1="140" x2="212" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="214" y="56" width="178" height="176" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="228" y="80.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >2 · Contrôles</text><text x="228" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Le type vient des octets</text><text x="228" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >magiques (WebP, PNG,</text><text x="228" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >JPEG, GIF), jamais du</text><text x="228" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >nom. Au plus 8 Mio, 40</text><text x="228" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >images par jeu.</text><line x1="394" y1="140" x2="406" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="408" y="56" width="178" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="422" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >3 · Stockage</text><text x="422" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gallery/&lt;nom&gt;.ext, nom</text><text x="422" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >nettoyé. Une vignette de</text><text x="422" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >320 px (WebP, sinon</text><text x="422" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >JPEG) dans</text><text x="422" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gallery/thumbs/. Ordre et</text><text x="422" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >légendes dans</text><text x="422" y="200.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.json.</text><line x1="588" y1="140" x2="600" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="602" y="56" width="178" height="176" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="616" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >4 · Affichage</text><text x="616" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Un dock dans le coin du</text><text x="616" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >canevas (3D et 2D) : grille</text><text x="616" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >de vignettes, puis</text><text x="616" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >visionneuse plein écran.</text><text x="616" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Trois états : ouvert, large,</text><text x="616" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >puce.</text><rect x="20" y="252" width="760" height="88" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="276" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.json garde « gallery: [{ file, thumb, title, caption, added }] » : le catalogue la transporte sans rien de plus. À chaque</text><text x="36" y="292.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >enregistrement, la liste est réconciliée avec le dossier dans les deux sens (un fichier orphelin est ajouté, une entrée sans fichier</text><text x="36" y="309.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >est retirée). Le dock se souvient de son état (clé iribhm-gallery-dock).</text></svg>