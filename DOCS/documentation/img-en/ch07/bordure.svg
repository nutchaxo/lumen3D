<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="366" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >A brick: 64 useful voxels + a 1-voxel border on every side</text><rect x="10" y="85" width="70" height="200" rx="6" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1" /><rect x="310" y="85" width="70" height="200" rx="6" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1" /><rect x="80" y="70" width="230" height="230" rx="6" fill="#ffe8cc" stroke="#e67700" stroke-width="2" /><rect x="96" y="86" width="198" height="198" rx="4" fill="#d0ebff" stroke="#3b5bdb" stroke-width="2" /><text x="195.0" y="181.0" font-size="17" font-weight="800" fill="#3b5bdb" text-anchor="middle" >64 × 64 × 64</text><text x="195.0" y="203.0" font-size="13" font-weight="400" fill="#1c2333" text-anchor="middle" >the brick's own voxels</text><text x="195.0" y="62" font-size="12.5" font-weight="700" fill="#e67700" text-anchor="middle" >cross-section of the stored brick: 66 × 66 × 66</text><text x="45" y="190.0" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >neighbour</text><text x="345" y="190.0" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >neighbour</text><line x1="74" y1="130" x2="86" y2="130" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="316" y1="130" x2="304" y2="130" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="400" y="96" width="370" height="74" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="414" y="122" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start" >The interior (blue)</text><text x="414" y="143" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >64³ = 262,144 voxels: the brick's own place</text><text x="414" y="160" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >in the grid.</text><rect x="400" y="184" width="370" height="74" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="414" y="210" font-size="14" font-weight="800" fill="#e67700" text-anchor="start" >The border (orange)</text><text x="414" y="231" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >1 voxel copied from each neighbour: 66³ =</text><text x="414" y="248" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >287,496 voxels, i.e. 9.7 % more.</text><rect x="400" y="272" width="370" height="74" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="414" y="298" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start" >The neighbours</text><text x="414" y="319" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Their first voxel becomes this brick's</text><text x="414" y="336" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >border, and vice versa.</text><text x="400" y="358" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" font-style="italic">Outside the volume, the border repeats the last voxel (“clamp to edge”). An absent brick is zero, border included.</text></svg>