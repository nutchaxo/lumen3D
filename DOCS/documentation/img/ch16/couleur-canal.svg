<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">D'où vient la couleur de départ d'un canal ?</text>
<text x="24" y="62" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start">Le viewer prend la première réponse non vide, de haut en bas (exemple : un canal nommé « Pecam1 ») :</text>
