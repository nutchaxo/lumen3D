<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 418" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="418" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Le test de vitesse de 5 secondes</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Les deux exécutants convertissent en même temps le même bloc synthétique.</text><rect x="24" y="70" width="752" height="60" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="94" font-size="12" font-weight="600" fill="#1c2333" text-anchor="start" >Le bloc : js/migrations/speedtest-brick.webp (≈ 128 ko, taches gaussiennes + bruit de Poisson)</text><text x="40" y="114" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >= ce que fait une unité pour chaque brique : décoder la mosaïque WebP, encoder ses voxels en une tuile PNG 512².</text><text x="24" y="160" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Navigateur</text><text x="24" y="232" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Serveur</text><line x1="130" y1="262" x2="740" y2="262" stroke="#4a5468" stroke-width="1.5"/><line x1="130.0" y1="258" x2="130.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="130.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >0 s</text><line x1="252.0" y1="258" x2="252.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="252.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >1 s</text><line x1="374.0" y1="258" x2="374.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="374.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >2 s</text><line x1="496.0" y1="258" x2="496.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="496.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >3 s</text><line x1="618.0" y1="258" x2="618.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="618.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >4 s</text><line x1="740.0" y1="258" x2="740.0" y2="266" stroke="#4a5468" stroke-width="1.5"/><text x="740.0" y="282" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >5 s</text><rect x="130.0" y="142" width="128.20000000000002" height="36" rx="6" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="194.10000000000002" y="158" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >lot de 16</text><text x="194.10000000000002" y="172" font-size="10" font-weight="400" fill="#4a5468" text-anchor="middle" >2 requêtes</text><rect x="273.96" y="142" width="128.20000000000002" height="36" rx="6" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="338.06" y="158" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >lot de 16</text><text x="338.06" y="172" font-size="10" font-weight="400" fill="#4a5468" text-anchor="middle" >2 requêtes</text><rect x="417.91999999999996" y="142" width="128.20000000000002" height="36" rx="6" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="482.02" y="158" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >lot de 16</text><text x="482.02" y="172" font-size="10" font-weight="400" fill="#4a5468" text-anchor="middle" >2 requêtes</text><rect x="561.88" y="142" width="128.20000000000002" height="36" rx="6" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="625.98" y="158" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >lot de 16</text><text x="625.98" y="172" font-size="10" font-weight="400" fill="#4a5468" text-anchor="middle" >2 requêtes</text><rect x="703.4" y="142" width="36.6" height="36" rx="6" fill="#fff" stroke="#c5cbd8" stroke-width="1" stroke-dasharray="3 3"/><rect x="130.0" y="214" width="116.0" height="36" rx="6" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="188.0" y="237" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >speedtest ≤ 1 s</text><rect x="252.0" y="214" width="116.0" height="36" rx="6" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="310.0" y="237" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >speedtest ≤ 1 s</text><rect x="374.0" y="214" width="116.0" height="36" rx="6" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="432.0" y="237" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >speedtest ≤ 1 s</text><rect x="496.0" y="214" width="116.0" height="36" rx="6" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="554.0" y="237" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >speedtest ≤ 1 s</text><rect x="618.0" y="214" width="116.0" height="36" rx="6" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="676.0" y="237" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >speedtest ≤ 1 s</text><text x="24" y="316" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• le navigateur télécharge 16 copies du bloc (1 requête), les décode et les encode, renvoie 16 tuiles (1 requête) — sous le régulateur ;</text><text x="24" y="338" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• le serveur enchaîne des appels d'au plus 1 s, un à la fois, jusqu'à la fin de la fenêtre ;</text><text x="24" y="360" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• score = blocs par seconde × 10, mesuré sur le temps du dernier lot ou appel terminé ; le plus haut gagne.</text><text x="24" y="382" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >• le gagnant devient l'exécutant par défaut de chaque jeu dont l'opérateur n'a pas choisi ; aucune donnée n'est lue ni écrite.</text></svg>