<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="340" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Trois poses, deux produits de quaternions</text><rect x="20" y="56" width="236" height="120" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Q_base · le repère</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.orientation : la pose du</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >cube pour laquelle les axes de</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'anatomie coïncident avec ceux de</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'écran (R→+X, A→+Y, V→+Z).</text><rect x="282" y="56" width="236" height="120" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="296" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Q_anat · l'anatomie</text><text x="296" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >La pose de l'anatomie à l'écran :</text><text x="296" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Q_anat = Q_cube · Q_base⁻¹. C'est</text><text x="296" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ce qui oriente la boussole, et ce que</text><text x="296" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >stocke une vue par défaut.</text><rect x="544" y="56" width="236" height="120" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="558" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Q_cube · le volume</text><text x="558" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >La pose réelle du cube : Q_cube =</text><text x="558" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Q_anat · Q_base. Une vue par défaut</text><text x="558" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >est appliquée avant la première</text><text x="558" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >brique.</text><rect x="20" y="196" width="760" height="128" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="220" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Six préréglages = deux contraintes anatomiques</text><text x="52" y="246" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >ventral</text><text x="250" y="246" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >V → caméra, A → haut</text><text x="52" y="268" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >dorsal</text><text x="250" y="268" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >D → caméra, A → haut</text><text x="52" y="290" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >gauche · droite</text><text x="250" y="290" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >L / R → caméra, A → haut</text><text x="52" y="312" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >antérieur · postérieur</text><text x="250" y="312" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >A / P → caméra, D → haut</text><text x="420" y="246" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Les deux contraintes (quelle direction regarde la caméra,</text><text x="420" y="262.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >laquelle pointe vers le haut) fixent une rotation unique. Les</text><text x="420" y="279.12" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >arêtes R/L, A/P, V/D sont des identifiants de stockage : vous</text><text x="420" y="295.68" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >les nommez comme vous voulez (« antérieur », « dorsal »).</text></svg>