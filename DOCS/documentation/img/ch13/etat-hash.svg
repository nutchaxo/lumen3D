<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >De l'état de la page au #state= de l'adresse</text><rect x="20" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="20" y="62" width="172" height="32" rx="14" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><rect x="20" y="78" width="172" height="16" rx="0" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><text x="106" y="84" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >État</text><text x="106" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >ui · viewer · plugins</text><text x="106" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >2 580 caractères en JSON</text><text x="106" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >(E95 de démonstration)</text><line x1="194" y1="128" x2="210" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="212" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="212" y="62" width="172" height="32" rx="14" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><rect x="212" y="78" width="172" height="16" rx="0" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><text x="298" y="84" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Compression</text><text x="298" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">deflate-raw</text><text x="298" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >CompressionStream du</text><text x="298" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >navigateur</text><line x1="386" y1="128" x2="402" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="404" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="404" y="62" width="172" height="32" rx="14" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><rect x="404" y="78" width="172" height="16" rx="0" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><text x="490" y="84" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >Texte</text><text x="490" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">base64url</text><text x="490" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >sans + / = : sûr dans une</text><text x="490" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >adresse</text><line x1="578" y1="128" x2="594" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="596" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="596" y="62" width="172" height="32" rx="14" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><rect x="596" y="78" width="172" height="16" rx="0" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><text x="682" y="84" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >Adresse</text><text x="682" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">#state=…</text><text x="682" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >1 362 caractères ici</text><rect x="20" y="214" width="244" height="170" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4" /><text x="34" y="238.8" font-size="13.5" font-weight="800" fill="#0c8599" text-anchor="start" >Écrit seulement si utile</text><text x="34" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Toutes les secondes, on compare une</text><text x="34" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >empreinte de l'état. Rien n'a changé :</text><text x="34" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >rien n'est écrit. Retour exact à l'état</text><text x="34" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >d'ouverture : l'adresse est nettoyée.</text><text x="34" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Les compteurs qui bougent seuls</text><text x="34" y="338.7" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >(cache de briques) sont ignorés.</text><rect x="278" y="214" width="244" height="170" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="292" y="238.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Trois plafonds</text><text x="292" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Écrit : 64 Kio de texte au plus (au-delà,</text><text x="292" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >l'adresse n'est plus mise à jour). Lu : 2</text><text x="292" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Mio de texte. Gonflé : 16 Mio, pour</text><text x="292" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >qu'un lien piégé ne puisse pas «</text><text x="292" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >exploser » en mémoire.</text><rect x="536" y="214" width="244" height="170" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="550" y="238.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >À l'ouverture d'un lien</text><text x="550" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Le viewer demande : « Ouvrir la vue</text><text x="550" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >enregistrée » ou « Ouvrir le jeu de</text><text x="550" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >données à neuf ». Échap = ouvrir la</text><text x="550" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >vue (ce que faisait un lien avant la</text><text x="550" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >question). Un lien illisible est</text><text x="550" y="338.7" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >simplement oublié.</text></svg>