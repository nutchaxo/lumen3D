<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="340" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Le chargement en deux temps</text><line x1="40" y1="250" x2="770" y2="250" stroke="#4a5468" stroke-width="1.6" marker-end="url(#arr)" /><text x="770" y="270" font-size="12" font-weight="600" fill="#4a5468" text-anchor="end" >temps</text><text x="24" y="92" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">preview.webp</text><rect x="180" y="78" width="80" height="22" rx="6" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="220" y="93" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >640 px</text><text x="24" y="142" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">image.webp</text><rect x="180" y="128" width="440" height="22" rx="6" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="400" y="143" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >natif (ici 1920 × 1440, plusieurs Mo en vrai)</text><text x="24" y="192" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start" font-family="JetBrains Mono, monospace">canvas</text><rect x="180" y="178" width="80" height="22" rx="6" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="1" /><rect x="260" y="178" width="360" height="22" rx="6" fill="#ffe8cc" stroke="#e67700" stroke-width="1" /><rect x="620" y="178" width="150" height="22" rx="6" fill="#d0ebff" stroke="#3b5bdb" stroke-width="1" /><text x="220" y="193" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle" >vide</text><text x="440" y="193" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" >aperçu étiré (flou mais immédiat)</text><text x="695" y="193" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >image native</text><line x1="260" y1="70" x2="260" y2="244" stroke="#2b8a3e" stroke-width="1.4" stroke-dasharray="4 3" /><line x1="620" y1="70" x2="620" y2="244" stroke="#3b5bdb" stroke-width="1.4" stroke-dasharray="4 3" /><text x="260" y="262" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >l'aperçu se décode</text><text x="620" y="262" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >le natif se décode</text><rect x="24" y="282" width="752" height="40" rx="10" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="304" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >Règle : une image plus petite ne remplace jamais une plus grande déjà affichée. Au parcours ←/→, le natif attend 150 ms que la</text><text x="40" y="319.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >touche se calme.</text></svg>