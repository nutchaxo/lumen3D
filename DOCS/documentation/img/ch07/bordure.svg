<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 366" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="366" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Une brique : 64 voxels utiles + 1 voxel de bordure de chaque côté</text><rect x="10" y="85" width="70" height="200" rx="6" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1" /><rect x="310" y="85" width="70" height="200" rx="6" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1" /><rect x="80" y="70" width="230" height="230" rx="6" fill="#ffe8cc" stroke="#e67700" stroke-width="2" /><rect x="96" y="86" width="198" height="198" rx="4" fill="#d0ebff" stroke="#3b5bdb" stroke-width="2" /><text x="195.0" y="181.0" font-size="17" font-weight="800" fill="#3b5bdb" text-anchor="middle" >64 × 64 × 64</text><text x="195.0" y="203.0" font-size="13" font-weight="400" fill="#1c2333" text-anchor="middle" >voxels « à elle »</text><text x="195.0" y="62" font-size="12.5" font-weight="700" fill="#e67700" text-anchor="middle" >coupe à travers la brique stockée : 66 × 66 × 66</text><text x="45" y="190.0" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >voisine</text><text x="345" y="190.0" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >voisine</text><line x1="74" y1="130" x2="86" y2="130" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="316" y1="130" x2="304" y2="130" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="400" y="96" width="370" height="74" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="414" y="122" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start" >L'intérieur (bleu)</text><text x="414" y="143" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >64³ = 262 144 voxels : la place de la brique</text><text x="414" y="160" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >dans la grille.</text><rect x="400" y="184" width="370" height="74" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="414" y="210" font-size="14" font-weight="800" fill="#e67700" text-anchor="start" >La bordure (orange)</text><text x="414" y="231" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >1 voxel copié depuis chaque voisine : 66³ =</text><text x="414" y="248" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >287 496 voxels, soit 9,7 % de plus.</text><rect x="400" y="272" width="370" height="74" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="414" y="298" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start" >Les voisines</text><text x="414" y="319" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Leur premier voxel devient la bordure de</text><text x="414" y="336" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >cette brique, et inversement.</text><text x="400" y="358" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" font-style="italic">Hors du volume, la bordure répète le dernier voxel (« clamp to edge »). Une brique absente vaut zéro, bordure comprise.</text></svg>