<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="300" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Two ways to “stabilise” images</text><rect x="20" y="56" width="370" height="226" rx="14" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="205" y="84" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="middle" >Resample (not used)</text><circle cx="44" cy="112" r="4" fill="#c92a2a" stroke="#c92a2a" stroke-width="1" /><text x="58" y="116" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Build, for each frame, a rotated and shifted copy of</text><text x="58" y="133.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >the volume.</text><circle cx="44" cy="161" r="4" fill="#c92a2a" stroke="#c92a2a" stroke-width="1" /><text x="58" y="165" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Every voxel is recomputed by interpolation: slightly</text><text x="58" y="182.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >blurred, so no longer the measurement.</text><circle cx="44" cy="210" r="4" fill="#c92a2a" stroke="#c92a2a" stroke-width="1" /><text x="58" y="214" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Cost: the whole volume, at every frame.</text><circle cx="44" cy="241.75" r="4" fill="#c92a2a" stroke="#c92a2a" stroke-width="1" /><text x="58" y="245.75" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Irreversible once the bricks are written.</text><rect x="410" y="56" width="370" height="226" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="595" y="84" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Move the gaze (Lumen3D)</text><circle cx="434" cy="112" r="4" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="448" y="116" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >The texture is never touched: the voxels stay those</text><text x="448" y="133.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >of the measurement.</text><circle cx="434" cy="161" r="4" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="448" y="165" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Only the reading point changes: each ray is sent</text><text x="448" y="182.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >through the frame's matrix.</text><circle cx="434" cy="210" r="4" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="448" y="214" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Cost: one 4 × 4 matrix per frame.</text><circle cx="434" cy="241.75" r="4" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="448" y="245.75" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Reversible in one click (stabilised ⇄ raw).</text></svg>