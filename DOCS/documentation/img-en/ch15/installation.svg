anchor="middle">5</text><text x="702" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Zip downloaded</text><text x="702" y="128" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">(≤ 8 MiB)</text><rect x="24" y="206" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="206" width="140" height="28" rx="12" fill="#fff4e6" stroke="#c5cbd8" stroke-width="1.2"/><text x="94" y="226" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle">6</text><text x="94" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">zip sha256 =</text><text x="94" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">signed catalogue</text><text x="94" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">sha256</text><line x1="165" y1="262" x2="175" y2="262" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="176" y="206" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="176" y="206" width="140" height="28" rx="12" fill="#fff4e6" stroke="#c5cbd8" stroke-width="1.2"/><text x="246" y="226" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle">7</text><text x="246" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Hardened</text><text x="246" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">extraction (≤ 500</text><text x="246" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">entries, 24 MiB)</text><line x1="317" y1="262" x2="327" y2="262" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="328" y="206" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="328" y="206" width="140" height="28" rx="12" fill="#fff4e6" stroke="#c5cbd8" stroke-width="1.2"/><text x="398" y="226" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle">8</text><text x="398" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">plugin.json:</text><text x="398" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">id and placement</text><text x="398" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">= catalogue</text><line x1="469" y1="262" x2="479" y2="262" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="480" y="206" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="480" y="206" width="140" height="28" rx="12" fill="#ebfbee" stroke="#c5cbd8" stroke-width="1.2"/><text x="550" y="226" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle">9</text><text x="550" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Folder swapped</text><text x="550" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">(old copy</text><text x="550" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">parked)</text><line x1="621" y1="262" x2="631" y2="262" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="632" y="206" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="632" y="206" width="140" height="28" rx="12" fill="#ebfbee" stroke="#c5cbd8" stroke-width="1.2"/><text x="702" y="226" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle">10</text><text x="702" y="262" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Approval pinned</text><text x="702" y="278" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">to the on-disk</text><text x="702" y="294" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">hash</text><rect x="24" y="360" width="752" height="58" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="400" y="384" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#c92a2a" text-anchor="middle">Any single check failing → js/modules/ is put back exactly as before</text><text x="400" y="404" font-family="Inter, sans-serif" font-size="11.5" font-weight="500" fill="#4a5468" text-anchor="middle">(for an upgrade: the old version, parked aside, is put back)</text><rect x="24" y="434" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="456" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#1c2333" text-anchor="start">Mode chosen at step 10:</text><text x="36" y="476" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="start">“sandbox” if plugin.json says sandbox: true (or a tool with declared capabilities);</text><text x="36" y="493" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="start">otherwise “in-page” (mandatory for channels and render modes).</text></svg>
