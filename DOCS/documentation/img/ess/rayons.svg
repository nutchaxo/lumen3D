<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="360" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Le lancer de rayons : un calcul par pixel, refait à chaque mouvement</text><text x="60" y="157" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">👁️</text><text x="60" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5468">votre œil</text><rect x="140" y="80" width="12" height="130" fill="#dee2e6"/><rect x="140" y="137" width="12" height="16" fill="#3b5bdb"/><text x="146" y="230" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5bdb">1 pixel</text><rect x="250" y="70" width="50" height="50" fill="#ffffff" stroke="#c5cbd8"/><rect x="250" y="120" width="50" height="50" fill="#ffffff" stroke="#c5cbd8"/><rect x="250" y="170" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="250" y="220" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="300" y="70" width="50" height="50" fill="#ffffff" stroke="#c5cbd8"/><rect x="300" y="120" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="300" y="170" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="300" y="220" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="350" y="70" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="350" y="120" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="350" y="170" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="350" y="220" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="400" y="70" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="400" y="120" width="50" height="50" fill="#ffffff" stroke="#c5cbd8"/><rect x="400" y="170" width="50" height="50" fill="#ebfbee" stroke="#c5cbd8"/><rect x="400" y="220" width="50" height="50" fill="#ffffff" stroke="#c5cbd8"/><line x1="80" y1="145" x2="466" y2="145" stroke="#e67700" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="305" cy="145" r="3.4" fill="#e67700"/><circle cx="315" cy="145" r="3.4" fill="#e67700"/><circle cx="325" cy="145" r="3.4" fill="#e67700"/><circle cx="335" cy="145" r="3.4" fill="#e67700"/><circle cx="345" cy="145" r="3.4" fill="#e67700"/><circle cx="355" cy="145" r="3.4" fill="#e67700"/><circle cx="365" cy="145" r="3.4" fill="#e67700"/><circle cx="375" cy="145" r="3.4" fill="#e67700"/><circle cx="385" cy="145" r="3.4" fill="#e67700"/><circle cx="395" cy="145" r="3.4" fill="#e67700"/><path d="M254,141 Q275.0,115 296,141" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><path d="M404,141 Q425.0,115 446,141" fill="none" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr)"/><circle cx="246" cy="290" r="4" fill="#e67700"/><text x="256" y="294" text-anchor="start" font-size="11.5" font-weight="700" fill="#e67700">1 échantillon par voxel traversé</text><line x1="240" y1="310" x2="252" y2="310" stroke="#c92a2a" stroke-width="2" stroke-dasharray="4 3"/><text x="256" y="314" text-anchor="start" font-size="11.5" font-weight="700" fill="#c92a2a">brique vide : le rayon saute par-dessus</text><text x="256" y="334" text-anchor="start" font-size="11.5" font-weight="600" fill="#4a5468">le volume (briques sur la carte graphique)</text><rect x="490" y="74" width="290" height="62" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1"/><text x="504" y="98" text-anchor="start" font-size="13.5" font-weight="800" fill="#3b5bdb">Fluorescence</text><text x="504" y="116" text-anchor="start" font-size="11.5" font-weight="400" fill="#1c2333">garde le maximum de chaque canal (comme</text><text x="504" y="130" text-anchor="start" font-size="11.5" font-weight="400" fill="#1c2333">une MIP)</text><rect x="490" y="150" width="290" height="62" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/><text x="504" y="174" text-anchor="start" font-size="13.5" font-weight="800" fill="#7048e8">Fluorescence naturelle</text><text x="504" y="192" text-anchor="start" font-size="11.5" font-weight="400" fill="#1c2333">chaque fluorophore brille, le dense cache</text><text x="504" y="206" text-anchor="start" font-size="11.5" font-weight="400" fill="#1c2333">ce qui est derrière</text><rect x="490" y="226" width="290" height="62" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1"/><text x="504" y="250" text-anchor="start" font-size="13.5" font-weight="800" fill="#0c8599">Structure (DVR)</text><text x="504" y="268" text-anchor="start" font-size="11.5" font-weight="400" fill="#1c2333">accumule une opacité, avant → arrière</text></svg>