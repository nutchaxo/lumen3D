<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="332" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Updating the platform: incompatible plugins step aside</text><rect x="24" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,90 V68 Q24,56 36,56 H254 Q266,56 266,68 V90 Z" fill="#e8edff"/><text x="145.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle">1 · Before (report)</text><text x="145.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">for each plugin:</text><text x="145.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">platformCompat accepts</text><text x="145.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">the TARGET version?</text><text x="145.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">→ ok  or  willQuarantine</text><text x="145.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">blocked if no render</text><text x="145.0" y="218" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">mode would remain</text><line x1="268" y1="146" x2="276" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="278" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M278,90 V68 Q278,56 290,56 H508 Q520,56 520,68 V90 Z" fill="#fff4e6"/><text x="399.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle">2 · After the swap</text><text x="399.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">each discovery re-filters:</text><text x="399.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">incompatible → absent from</text><text x="399.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">the list, files intact</text><text x="399.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">the admin gives the reason</text><text x="399.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">(“incompatible” label)</text><line x1="522" y1="146" x2="530" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="532" y="56" width="242" height="180" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M532,90 V68 Q532,56 544,56 H762 Q774,56 774,68 V90 Z" fill="#ebfbee"/><text x="653.0" y="78" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle">3 · Later</text><text x="653.0" y="118" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">a new version of the</text><text x="653.0" y="138" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">plugin (catalogue) or of</text><text x="653.0" y="158" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">the platform makes it</text><text x="653.0" y="178" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">compatible → it comes</text><text x="653.0" y="198" font-family="Inter, sans-serif" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="middle">back, no reinstall</text><rect x="24" y="256" width="752" height="56" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="400" y="280" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle">Third-party plugins dropped by the operator survive updates</text><text x="400" y="300" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">(only the previous release's files are replaced; the approval store is protected)</text></svg>
