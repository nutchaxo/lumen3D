<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 348" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="348" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">The demonstration dataset: from 297 MB of voxels to 9 MB of bricks</text><text x="36" y="86" text-anchor="start" font-size="13" font-weight="600" fill="#1c2333">Raw 16-bit voxels (3 channels)</text><rect x="300" y="70" width="360.0" height="28" rx="8" fill="#c92a2a"/><text x="670.0" y="89" text-anchor="start" font-size="13" font-weight="800" fill="#c92a2a">297.3 MB</text><text x="36" y="138" text-anchor="start" font-size="13" font-weight="600" fill="#1c2333">After conversion to 8 bits</text><rect x="300" y="122" width="179.9" height="28" rx="8" fill="#e67700"/><text x="489.93945509586274" y="141" text-anchor="start" font-size="13" font-weight="800" fill="#e67700">148.6 MB</text><text x="36" y="190" text-anchor="start" font-size="13" font-weight="600" fill="#1c2333">WebP bricks, 4 pyramid levels</text><rect x="300" y="174" width="11.3" height="28" rx="8" fill="#2b8a3e"/><text x="321.2613521695257" y="193" text-anchor="start" font-size="13" font-weight="800" fill="#2b8a3e">9.3 MB</text><text x="36" y="242" text-anchor="start" font-size="13" font-weight="600" fill="#1c2333">+ planes and projections (Studio)</text><rect x="300" y="226" width="11.0" height="28" rx="8" fill="#3b5bdb"/><text x="321.0191725529768" y="245" text-anchor="start" font-size="13" font-weight="800" fill="#3b5bdb">9.1 MB</text><text x="400" y="322" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5468" font-style="italic">Big win: the background becomes exactly 0, empty bricks are not stored and the rest compresses losslessly.</text></svg>