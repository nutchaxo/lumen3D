ext x="385" y="216" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >p00000.bin</text><text x="385" y="238" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="middle" >≤ 64 briques</text><text x="385" y="256" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="middle" >≤ 16 Mio</text><rect x="500" y="80" width="270" height="190" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="515" y="108" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Pourquoi des super-blocs ?</text><text x="515" y="132" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Une coupe en XZ ou YZ traverse</text><text x="515" y="150" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >une rangée de briques : avec des</text><text x="515" y="168" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >super-blocs, ces briques sont dans</text><text x="515" y="186" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >peu de paquets, donc peu de requêtes.</text><text x="515" y="204" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start" >Mesuré (simulation, embryon</text><text x="515" y="222" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="start" >5735² × 172) : coupe YZ = 66 paquets</text><text x="515" y="240" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="start" >au lieu de 668.</text><text x="400" y="326" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" font-style="italic">Un paquet contient toujours des super-blocs entiers ; un super-bloc trop gros est coupé dans l'ordre des briques.</text></svg>