<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 204" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="204" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >“Reset preview”: from the preview to the explorer thumbnail</text><rect x="20" y="56" width="236" height="126" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① The viewer preview</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >You orient the volume. If a slice or</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the Z-stack is open, that slice (1024</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >px) is what is photographed.</text><line x1="258" y1="118" x2="274" y2="118" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="276" y="56" width="236" height="126" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="290" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >② 512 × 512</text><text x="290" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The image is centred in a 512 px</text><text x="290" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >square, background #080a12,</text><text x="290" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >undistorted, then encoded as WebP</text><text x="290" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(quality 0.9).</text><line x1="514" y1="118" x2="530" y2="118" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="532" y="56" width="236" height="126" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="546" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ thumbnail.webp</text><text x="546" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The server checks the magic bytes</text><text x="546" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(≤ 5 MiB) and writes</text><text x="546" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >thumbnail.webp. The explorer grid</text><text x="546" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >shows it.</text></svg>