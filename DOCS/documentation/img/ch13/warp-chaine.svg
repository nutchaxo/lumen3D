<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="420" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >La chaîne de trois changements de repère du shader</text><rect x="20" y="62" width="170" height="168" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="20" y="62" width="170" height="34" rx="14" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><rect x="20" y="80" width="170" height="16" rx="0" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><text x="105" y="85" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >① Espace objet</text><text x="105" y="124" font-size="13.5" font-weight="700" fill="#1c2333" text-anchor="middle" >o ∈ [−½, ½]³</text><text x="30" y="150" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >là où le rayon avance</text><rect x="30" y="192" width="150" height="28" rx="14" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="105" y="210" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle" >(0 ; 0 ; 0)</text><line x1="192" y1="146" x2="214" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="216" y="62" width="170" height="168" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="216" y="62" width="170" height="34" rx="14" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><rect x="216" y="80" width="170" height="16" rx="0" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><text x="301" y="85" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >② µm stabilisés</text><text x="301" y="124" font-size="13.5" font-weight="700" fill="#1c2333" text-anchor="middle" >p = A + (o + ½)·S</text><text x="226" y="150" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >l'embryon immobile</text><rect x="226" y="192" width="150" height="28" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2" /><text x="301" y="210" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="middle" >(96 ; 96 ; 48)</text><line x1="388" y1="146" x2="410" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="412" y="62" width="170" height="168" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="412" y="62" width="170" height="34" rx="14" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><rect x="412" y="80" width="170" height="16" rx="0" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><text x="497" y="85" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >③ µm bruts</text><text x="497" y="124" font-size="13.5" font-weight="700" fill="#1c2333" text-anchor="middle" >q = M⁻¹ · p</text><text x="422" y="150" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >là où le microscope a</text><text x="422" y="166.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >posé l'embryon</text><rect x="422" y="192" width="150" height="28" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="497" y="210" font-size="12" font-weight="700" fill="#e67700" text-anchor="middle" >(101,65 ; 92,57 ; 49,89)</text><line x1="584" y1="146" x2="606" y2="146" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="608" y="62" width="170" height="168" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="608" y="62" width="170" height="34" rx="14" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><rect x="608" y="80" width="170" height="16" rx="0" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><text x="693" y="85" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >④ Texture</text><text x="693" y="124" font-size="13.5" font-weight="700" fill="#1c2333" text-anchor="middle" >uvw = (q − A) / S</text><text x="618" y="150" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >l'adresse à lire dans l'atlas</text><rect x="618" y="192" width="150" height="28" rx="14" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="693" y="210" font-size="12" font-weight="700" fill="#7048e8" text-anchor="middle" >(0,529 ; 0,482 ; 0,520)</text><text x="223" y="252" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >toUm</text><text x="419" y="252" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >M⁻¹</text><text x="615" y="252" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >toTex</text><rect x="20" y="272" width="760" height="130" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="296" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Une seule matrice 4 × 4 par image, calculée une fois par changement d'image :</text><text x="36" y="322" font-size="15" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">volumeWarp = toTex · M⁻¹ · toUm</text><text x="36" y="348" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >A = coin minimal de la boîte d'acquisition (0 ; 0 ; 0 µm), S = ses dimensions (192 ; 192 ; 96 µm). Exemple : l'image 4 du jeu de</text><text x="36" y="364.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >démonstration (rotation 7,03°, décalage −16,14 ; 16,39 ; −1,79 µm). Le centre de l'écran ① lit donc le voxel ④ et non le centre</text><text x="36" y="381.12" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >exact (0,5 ; 0,5 ; 0,5).</text></svg>