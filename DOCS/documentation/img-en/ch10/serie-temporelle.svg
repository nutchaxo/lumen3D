<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
  <rect width="800" height="330" rx="16" fill="#f8f9fd"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">A time series: one brick tree per timepoint</text>
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="40" y="56" width="150" height="100" rx="12" fill="#e8edff" stroke="#3b5bdb"/><text x="115" y="84" fill="#3b5bdb">t000</text><text x="115" y="106" fill="#1c2333" font-weight="400">bricks/t000/</text><text x="115" y="126" fill="#1c2333" font-weight="400">its own index.bin</text>
    <rect x="220" y="56" width="150" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e"/><text x="295" y="84" fill="#2b8a3e">t001</text><text x="295" y="106" fill="#1c2333" font-weight="400">bricks/t001/</text><text x="295" y="126" fill="#1c2333" font-weight="400">already in memory</text>
    <rect x="400" y="56" width="150" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e"/><text x="475" y="84" fill="#2b8a3e">t002</text><text x="475" y="106" fill="#1c2333" font-weight="400">bricks/t002/</text><text x="475" y="126" fill="#1c2333" font-weight="400">prefetched</text>
    <rect x="580" y="56" width="150" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-dasharray="5 4"/><text x="655" y="84" fill="#4a5468">t003</text><text x="655" y="106" fill="#4a5468" font-weight="400">bricks/t003/</text><text x="655" y="126" fill="#4a5468" font-weight="400">not loaded yet</text>
  </g>
  <!-- scrubber -->
  <rect x="40" y="200" width="720" height="14" rx="7" fill="#e9ecef"/>
  <rect x="40" y="200" width="540" height="14" rx="7" fill="#b2f2bb"/>
  <rect x="40" y="200" width="180" height="14" rx="7" fill="#3b5bdb"/>
  <circle cx="220" cy="207" r="11" fill="#fff" stroke="#3b5bdb" stroke-width="3"/>
  <g font-size="12.5" text-anchor="middle" fill="#1c2333"><text x="130" y="238"><tspan font-weight="700" fill="#3b5bdb">played</tspan> (already past)</text><text x="400" y="238"><tspan font-weight="700" fill="#2b8a3e">buffer</tspan> (already in memory)</text><text x="670" y="238" fill="#4a5468">upcoming</text></g>
  <text x="220" y="262" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">▲ playhead</text>
  <text x="400" y="304" text-anchor="middle" font-size="12.5" fill="#4a5468">Intermediate frames are dropped rather than queued: playback never lags behind the slider.</text>
</svg>
