<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="356" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Pourquoi des sphères et pas des « points »</text><rect x="20" y="56" width="370" height="288" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="205" y="82" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="middle" >Des points GPU (THREE.Points)</text><rect x="71" y="159" width="22" height="22" rx="0" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1.6" /><text x="82" y="220" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle" >carré, ≈ même taille</text><text x="82" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×1</text><rect x="194" y="159" width="22" height="22" rx="0" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1.6" /><text x="205" y="220" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle" >carré, ≈ même taille</text><text x="205" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×2</text><rect x="315" y="157" width="26" height="26" rx="0" fill="#ffc9c9" stroke="#c92a2a" stroke-width="1.6" /><text x="328" y="220" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle" >carré, ≈ même taille</text><text x="328" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×4</text><text x="38" y="258" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >La taille est un nombre de pixels d'écran, plafonnée par le</text><text x="38" y="274.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >pilote (63 px sur certains processeurs graphiques Intel) :</text><text x="38" y="291.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >zoomer ne fait plus grossir le point, et il est dessiné carré.</text><rect x="410" y="56" width="370" height="288" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="595" y="82" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Des sphères instanciées (ce que fait Lumen3D)</text><circle cx="472" cy="170" r="8" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="1.6" /><text x="472" y="220" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle" >rond, grandit</text><text x="472" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×1</text><circle cx="595" cy="170" r="16" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="1.6" /><text x="595" y="220" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle" >rond, grandit</text><text x="595" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×2</text><circle cx="718" cy="170" r="32" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="1.6" /><text x="718" y="220" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle" >rond, grandit</text><text x="718" y="112" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom ×4</text><text x="428" y="258" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Le diamètre est un nombre de micromètres (réglable de 2</text><text x="428" y="274.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >à 40). Chaque sphère compense l'étirement du cube, y</text><text x="428" y="291.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >compris l'étirement Z de l'opérateur : elle reste ronde et</text><text x="428" y="307.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >exacte à tout zoom.</text></svg>