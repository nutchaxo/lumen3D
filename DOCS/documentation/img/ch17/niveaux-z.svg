or="start" >niveau 4</text><text x="538" y="282" font-size="11.3" font-weight="600" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >237×237×33</text><text x="538" y="300" font-size="10.6" font-weight="400" fill="#4a5468" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >vxy 6.89</text><text x="538" y="314" font-size="10.6" font-weight="400" fill="#4a5468" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >vz  16.46</text><text x="538" y="330" font-size="10.8" font-weight="800" fill="#2b8a3e" text-anchor="start" >Z réduit</text><rect x="654" y="244" width="118" height="92" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="664" y="262" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="start" >niveau 5</text><text x="664" y="282" font-size="11.3" font-weight="600" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >119×119×17</text><text x="664" y="300" font-size="10.6" font-weight="400" fill="#4a5468" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >vxy 13.77</text><text x="664" y="314" font-size="10.6" font-weight="400" fill="#4a5468" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >vz  32.91</text><text x="664" y="330" font-size="10.8" font-weight="800" fill="#2b8a3e" text-anchor="start" >Z réduit</text><rect x="24" y="358" width="752" height="76" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="380" font-size="12.3" font-weight="800" fill="#1c2333" text-anchor="start" >Pourquoi ? Pour qu'un niveau grossier ait des voxels presque cubiques :</text><text x="40" y="400" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >tant que le voxel est bien plus épais en Z qu'en XY, on ne réduit que XY ; dès qu'il devient comparable, on réduit les trois axes.</text><text x="40" y="420" font-size="11.6" font-weight="400" fill="#4a5468" text-anchor="start" >On s'arrête quand max(X, Y) ≤ 128 voxels. La moyenne est entière, arrondie au plus proche (demi vers le haut).</text></svg>