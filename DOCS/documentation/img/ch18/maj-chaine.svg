="414" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">Message : « installation intacte ». Rien n&#x27;a été remplacé.</text><rect x="560" y="342" width="216" height="96" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="574" y="368" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Étape 8</text><text x="574" y="392" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">seule phase qui modifie</text><text x="574" y="414" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">le site (figure suivante)</text></svg>