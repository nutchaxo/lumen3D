<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="600" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Le serveur classe chaque plugin : le premier « oui » gagne</text><rect x="24" y="50" width="250" height="26" rx="13.0" fill="#eef0f5" stroke="#4a5468" stroke-width="1"/><text x="149.0" y="67.3" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle">Un plugin se présente (un dossier)</text><rect x="24" y="94" width="440" height="62" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="130" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start">1</text><foreignObject x="56" y="100" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 12.2px Inter,sans-serif;color:#1c2333;line-height:1.35;padding-top:8px">Tous ses fichiers figurent dans version.json (release), avec la même empreinte ?</div></foreignObject><line x1="468" y1="125" x2="526" y2="125" stroke="#2b8a3e" stroke-width="2.2" marker-end="url(#arr)"/><text x="497" y="116" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle">oui</text><rect x="530" y="100" width="246" height="50" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="653" y="122" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle">bundled</text><text x="653" y="140" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">exécuté dans la page</text><line x1="244" y1="157" x2="244" y2="174" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><text x="256" y="170" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start">non</text><rect x="24" y="176" width="440" height="62" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="212" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start">2</text><foreignObject x="56" y="182" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 12.2px Inter,sans-serif;color:#1c2333;line-height:1.35;padding-top:8px">Une approbation « bac à sable » valide (empreinte ET capacités) ?</div></foreignObject><line x1="468" y1="207" x2="526" y2="207" stroke="#7048e8" stroke-width="2.2" marker-end="url(#arr)"/><text x="497" y="198" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle">oui</text><rect x="530" y="182" width="246" height="50" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="653" y="204" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle">sandboxed</text><text x="653" y="222" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">exécuté dans l'iframe</text><line x1="244" y1="239" x2="244" y2="256" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><text x="256" y="252" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start">non</text><rect x="24" y="258" width="440" height="62" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="294" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start">3</text><foreignObject x="56" y="264" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 12.2px Inter,sans-serif;color:#1c2333;line-height:1.35;padding-top:8px">Mode développeur actif (--dev-trust-local) ?</div></foreignObject><line x1="468" y1="289" x2="526" y2="289" stroke="#e67700" stroke-width="2.2" marker-end="url(#arr)"/><text x="497" y="280" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle">oui</text><rect x="530" y="264" width="246" height="50" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="653" y="286" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle">dev</text><text x="653" y="304" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">exécuté dans la page</text><line x1="244" y1="321" x2="244" y2="338" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><text x="256" y="334" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start">non</text><rect x="24" y="340" width="440" height="62" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="376" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start">4</text><foreignObject x="56" y="346" width="400" height="52"><div xmlns="http://www.w3.org/1999/xhtml" style="font:600 12.2px Inter,sans-serif;color:#1c2333;line-height:1.35;padding-top:8px">Une approbation « in-page » valide (empreinte ET capacités) ?</div></foreignObject><line x1="468" y1="371" x2="526" y2="371" stroke="#3b5bdb" stroke-width="2.2" marker-end="url(#arr)"/><text x="497" y="362" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle">oui</text><rect x="530" y="346" width="246" height="50" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="653" y="368" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle">approved-trusted</text><text x="653" y="386" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle">exécuté dans la page</text><line x1="244" y1="403" x2="244" y2="420" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><text x="256" y="416" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start">non</text><rect x="24" y="422" width="440" height="54" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="244" y="446" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="middle">untrusted</text><text x="244" y="465" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#4a5468" text-anchor="middle">absent de la découverte : son code n'est jamais chargé</text><rect x="24" y="494" width="752" height="90" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="516" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start">Ensuite, côté navigateur :</text><text x="36" y="538" font-family="Inter, sans-serif" font-size="11.3" font-weight="400" fill="#4a5468" text-anchor="start">• il relit les octets exacts et recalcule l'empreinte : différente du verdict → untrusted ;</text><text x="36" y="555" font-family="Inter, sans-serif" font-size="11.3" font-weight="400" fill="#4a5468" text-anchor="start">• plugin.json avec  "sandbox": true  : les niveaux ci-dessus décident SEULEMENT s'il se charge ;</text><text x="36" y="572" font-family="Inter, sans-serif" font-size="11.3" font-weight="400" fill="#4a5468" text-anchor="start">   il tourne alors toujours dans l'iframe (niveau affiché : sandboxed).</text></svg>
