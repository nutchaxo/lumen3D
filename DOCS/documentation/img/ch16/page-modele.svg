<text x="596" y="200" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">largeur de 1 à 12</text>
<text x="596" y="216" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">(douzièmes), 6 colonnes</text>
<text x="596" y="232" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">au plus par section ;</text>
<text x="596" y="248" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">empilées sur mobile</text>
<text x="596" y="282" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start">Widget</text>
<text x="596" y="300" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">une brique de contenu :</text>
<text x="596" y="316" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">27 types, jusqu'à</text>
<text x="596" y="332" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">500 par colonne</text>
<text x="684" y="446" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">(≤ 2 Mo par page)</text>
