<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 568" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="568" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Finalize : l'échange et le changement de version</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Exemple m002 ; m003 est identique avec mips/, m004 ajoute deux gestes (voir le texte).</text><rect x="24" y="68" width="752" height="38" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><circle cx="48" cy="87" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="48" y="92" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="70" y="92" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Tout est fait ?</text><text x="226" y="92" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >toutes les unités sont cochées et les manifestes sources n'ont pas changé</text><rect x="24" y="112" width="752" height="38" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><circle cx="48" cy="131" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="48" y="136" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="70" y="136" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Assembler</text><text x="226" y="136" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >un fichier zNNNNN.bin à la fois dans .planes-incoming/ ; chaque PNG a son en-tête vérifié</text><rect x="24" y="156" width="752" height="38" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><circle cx="48" cy="175" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="48" y="180" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="70" y="180" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Échanger</text><text x="226" y="180" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >planes/ → .planes-old/, puis .planes-incoming/ → planes/ : deux renommages</text><rect x="24" y="200" width="752" height="38" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><circle cx="48" cy="219" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="48" y="224" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="70" y="224" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >Monter la version</text><text x="226" y="224" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >formatVersion = 2, sous le verrou de metadata.json, fusionné dans le fichier courant</text><rect x="24" y="244" width="752" height="38" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.6" /><circle cx="48" cy="263" r="12" fill="#4a5468" stroke="none" stroke-width="1"/><text x="48" y="268" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="70" y="268" font-size="13" font-weight="800" fill="#4a5468" text-anchor="start" >Nettoyer</text><text x="226" y="268" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >supprime .planes-old/, le journal et le magasin de tuiles</text><text x="24" y="316" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Ce que voit le disque, instant après instant</text><rect x="24" y="328" width="330" height="56" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6" /><text x="189.0" y="351" font-size="12.2" font-weight="800" fill="#c92a2a" text-anchor="middle" >version 1 + ancien état</text><text x="189.0" y="370" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >tout est intact</text><rect x="354" y="328" width="206" height="56" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="457.0" y="351" font-size="12.2" font-weight="800" fill="#e67700" text-anchor="middle" >version 1 + nouveaux fichiers</text><text x="457.0" y="370" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >« à mettre à jour » : relançable</text><rect x="560" y="328" width="216" height="56" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="668.0" y="351" font-size="12.2" font-weight="800" fill="#2b8a3e" text-anchor="middle" >version 2</text><text x="668.0" y="370" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >terminé</text><line x1="354" y1="320" x2="354" y2="392" stroke="#e67700" stroke-width="2.2"/><text x="346" y="406" font-size="11" font-weight="700" fill="#e67700" text-anchor="end" >étape 3 : renommage</text><line x1="560" y1="320" x2="560" y2="392" stroke="#2b8a3e" stroke-width="2.6"/><text x="770" y="406" font-size="11.2" font-weight="800" fill="#2b8a3e" text-anchor="end" >étape 4 : la version monte = point de validation</text><rect x="24" y="424" width="752" height="128" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="448" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Et si ça plante ?</text><text x="44" y="472" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• pendant l'assemblage : l'ancien état est intact ; on rappelle finalize, il finit les fichiers manquants ;</text><text x="44" y="491" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• entre l'échange et la version : la structure neuve est là, la version est restée basse ; finalize est idempotent ;</text><text x="44" y="510" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• m004 : bricks/ est échangé avec .bricks-incoming/ ; les manifestes planes/ et mips/ sont re-signés AVANT la version ;</text><text x="44" y="529" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• m004 : l'ancien arbre (bricks.v2-old/) n'est supprimé qu'APRÈS le changement de version.</text></svg>