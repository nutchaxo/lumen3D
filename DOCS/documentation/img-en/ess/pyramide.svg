<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="330" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">The pyramid: the viewer loads the level the screen needs</text><rect x="165.0" y="62" width="210" height="40" rx="8" fill="#e3fafc" stroke="#0c8599" stroke-width="1.5"/><text x="270" y="87" text-anchor="middle" font-size="12" font-weight="700" fill="#0c8599">level 3 · 96 × 72 × 14</text><line x1="520" y1="82" x2="556" y2="82" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="562" y="66" width="200" height="32" rx="16" fill="#fff" stroke="#0c8599"/><text x="662" y="87" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0c8599">instant preview</text><rect x="135.0" y="114" width="270" height="40" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.5"/><text x="270" y="139" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">level 2 · 192 × 144 × 28</text><line x1="520" y1="134" x2="556" y2="134" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="562" y="118" width="200" height="32" rx="16" fill="#fff" stroke="#3b5bdb"/><text x="662" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">“512” (≤ 768 px)</text><rect x="100.0" y="166" width="340" height="40" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/><text x="270" y="191" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">level 1 · 384 × 288 × 56</text><line x1="520" y1="186" x2="556" y2="186" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="562" y="170" width="200" height="32" rx="16" fill="#fff" stroke="#7048e8"/><text x="662" y="191" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7048e8">“1024” (≤ 1536 px)</text><rect x="50.0" y="218" width="440" height="40" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5"/><text x="270" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#2b8a3e">level 0 · 768 × 576 × 112 (native)</text><line x1="520" y1="238" x2="556" y2="238" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="562" y="222" width="200" height="32" rx="16" fill="#fff" stroke="#2b8a3e"/><text x="662" y="243" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b8a3e">“Native”</text><text x="662" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#4a5468">“Quality” setting</text><text x="400" y="300" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5468" font-style="italic">Each level = mean of 2 × 2 blocks (× 2 in Z when voxels are thin enough in Z) of the level below.</text></svg>