<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 544" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="544" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The moving company's tally sheet</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Journal and tile store of a real m002 conversion (synthetic test dataset).</text><rect x="24" y="70" width="440" height="370" rx="12" fill="#fff" stroke="#3b5bdb" stroke-width="1.6" /><text x="40" y="94" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploads/migrations/3d__&lt;set&gt;__m002-planes.json</text><text x="40" y="122" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >{ "migration": "m002-planes",</text><text x="40" y="148" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "dataset": "3d/Synthetique-E95",</text><text x="40" y="174" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "sourceManifests": { "0": "46475b1a…" },</text><rect x="58" y="181" width="233.6" height="18" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1" /><text x="65" y="194" font-size="10.8" font-weight="600" fill="#3b5bdb" text-anchor="start" >fingerprint of the starting manifest</text><text x="40" y="216" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "units": { "total": 24, "empty": 1 },</text><rect x="58" y="223" width="258.0" height="18" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1" /><text x="65" y="236" font-size="10.8" font-weight="600" fill="#7048e8" text-anchor="start" >24 boxes, 1 of them empty from the start</text><text x="40" y="258" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "done": [ "t0.z0.c0.y0.x0", …(23) ],</text><rect x="58" y="265" width="160.39999999999998" height="18" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1" /><text x="65" y="278" font-size="10.8" font-weight="600" fill="#2b8a3e" text-anchor="start" >the boxes already ticked</text><text x="40" y="300" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "executors": { "browser": 0, "server": 23 },</text><rect x="58" y="307" width="172.6" height="18" rx="9" fill="#fff4e6" stroke="#e67700" stroke-width="1" /><text x="65" y="320" font-size="10.8" font-weight="600" fill="#e67700" text-anchor="start" >who carried how many boxes</text><text x="40" y="342" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "state": "running",</text><rect x="58" y="349" width="197.0" height="18" rx="9" fill="#fff0f0" stroke="#c92a2a" stroke-width="1" /><text x="65" y="362" font-size="10.8" font-weight="600" fill="#c92a2a" text-anchor="start" >running → assembling → swapped</text><text x="40" y="384" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >  "updatedAt": "2026-10-07T18:49:55Z" }</text><rect x="478" y="70" width="298" height="370" rx="12" fill="#fff" stroke="#2b8a3e" stroke-width="1.6" /><text x="494" y="94" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >The tile store</text><text x="494" y="122" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploads/migrations/</text><text x="494" y="144" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >└ 3d__…__m002-planes/</text><text x="494" y="166" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >   └ t0/</text><text x="494" y="188" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      ├ z0/  c0.y0.x0.png</text><text x="494" y="210" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      │      c0.y0.x1.png</text><text x="494" y="232" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      │      c0.y1.x0.png …</text><text x="494" y="254" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      ├ z1/  …</text><text x="494" y="276" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      └ z129/ …</text><text x="494" y="330" font-size="11.5" font-weight="600" fill="#4a5468" text-anchor="start" >one grey PNG per plane and per tile:</text><text x="494" y="348" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >one unit = up to 64 small files</text><text x="494" y="376" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="start" >here: 42.0 MB of tiles before assembly</text><text x="494" y="398" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >never served: a workshop, not a shop window</text><rect x="24" y="454" width="752" height="74" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="40" y="478" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Why a tally sheet?</text><text x="40" y="498" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Like a mover ticking each delivered box: if the truck breaks down, or you switch trucks,</text><text x="40" y="516" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(browser → server), you restart from the last ticked box. A box delivered twice bothers no one.</text></svg>