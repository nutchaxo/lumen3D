<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Two ways to update, depending on the server</text><rect x="212" y="54" width="270" height="40" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="347" y="78.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="middle">Python — dev_server.py</text><rect x="494" y="54" width="282" height="40" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="635" y="78.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="middle">PHP — api/_admin_lib.php</text><rect x="24" y="106" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="134" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Flow</text><text x="224" y="134" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">background task + supervisor</text><text x="506" y="134" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">a single synchronous request</text><rect x="24" y="156" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="184" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Zip backup</text><text x="224" y="184" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">yes (3 kept)</text><text x="506" y="184" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">no</text><rect x="24" y="206" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="234" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Dry run</text><text x="224" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">--check</text><text x="506" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">no</text><rect x="24" y="256" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="284" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">File swap</text><text x="224" y="284" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">journalled renames</text><text x="506" y="284" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">old file parked, then new one placed</text><rect x="24" y="306" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="334" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Restart + probe</text><text x="224" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">yes, /api/health</text><text x="506" y="334" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">n/a: PHP starts afresh every request</text><rect x="24" y="356" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="384" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Rollback</text><text x="224" y="384" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">automatic</text><text x="506" y="384" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">none: just run again (idempotent)</text><rect x="24" y="406" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="434" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Removed files</text><text x="224" y="434" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">diff of the version.json files</text><text x="506" y="434" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">fixed list (api/config.php)</text><rect x="24" y="456" width="752" height="46" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="38" y="484" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">Signature + SHA-256</text><text x="224" y="484" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">identical, fail-closed</text><text x="506" y="484" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">identical, fail-closed</text></svg>