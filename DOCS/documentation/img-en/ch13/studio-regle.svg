36" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="148" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><text x="40" y="248" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="start" >one pixel = 1 µm × 2 µm</text><text x="450" y="100" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="middle" >The same 100 µm ruler, turned</text><line x1="250" y1="210" x2="370" y2="210" stroke="#3b5bdb" stroke-width="4" /><text x="310" y="198" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >100 px</text><text x="310" y="232" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >0° · 100 µm</text><line x1="440" y1="250" x2="493.669" y2="196.331" stroke="#2b8a3e" stroke-width="4" /><text x="516" y="200" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="start" >63.25 px</text><text x="470" y="272" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >45° · 100 µm</text><line x1="660" y1="250" x2="660" y2="190" stroke="#e67700" stroke-width="4" /><text x="672" y="224" font-size="12" font-weight="800" fill="#e67700" text-anchor="start" >50 px</text><text x="660" y="272" font-size="12" font-weight="700" fill="#4a5468" text-anchor="middle" >90° · 100 µm</text><rect x="24" y="300" width="752" height="96" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="324" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >Length in pixels: L' = ℓ / √( (ux·psx)² + (uy·psy)² )</text><text x="40" y="348" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ℓ = length in µm (kept), (ux, uy) = the ruler's unit direction on screen, (psx, psy) = pixel size in µm. A “rigid” rotation in pixels</text><text x="40" y="364.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >would keep 100 px: at 45° it would read √(70.7² + 141.4²) = 158 µm, which is wrong. The Studio rewrites the pixel length at</text><text x="40" y="381.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >every turn: the displayed value does not move.</text></svg>