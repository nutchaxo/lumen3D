<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, sans-serif">
  <rect width="800" height="330" rx="16" fill="#f8f9fd"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Pourquoi le calcul se fait sur la carte graphique</text>
  <!-- CPU -->
  <rect x="24" y="52" width="360" height="250" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <rect x="24" y="52" width="360" height="36" rx="14" fill="#fff4e6"/><rect x="24" y="72" width="360" height="16" fill="#fff4e6"/>
  <text x="204" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#e67700">LE PROCESSEUR (CPU) : un grand chef</text>
  <text x="204" y="150" text-anchor="middle" font-size="64">👨‍🍳</text>
  <text x="204" y="188" text-anchor="middle" font-size="13" fill="#1c2333" font-weight="700">Très habile, mais seul</text>
  <text x="204" y="208" text-anchor="middle" font-size="13" fill="#4a5468">prépare les assiettes une par une</text>
  <rect x="64" y="226" width="280" height="22" rx="11" fill="#fff4e6"/>
  <text x="204" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e67700">1 920 × 1 080 pixels = 2 millions d'assiettes</text>
  <text x="204" y="280" text-anchor="middle" font-size="12.5" fill="#4a5468">→ trop lent pour tourner un embryon en direct</text>
  <!-- GPU -->
  <rect x="416" y="52" width="360" height="250" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <rect x="416" y="52" width="360" height="36" rx="14" fill="#ebfbee"/><rect x="416" y="72" width="360" height="16" fill="#ebfbee"/>
  <text x="596" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">LA CARTE GRAPHIQUE (GPU) : des milliers de commis</text>
  <g font-size="22" text-anchor="middle">
    <text x="452" y="124">🧑‍🍳</text><text x="488" y="124">🧑‍🍳</text><text x="524" y="124">🧑‍🍳</text><text x="560" y="124">🧑‍🍳</text><text x="596" y="124">🧑‍🍳</text><text x="632" y="124">🧑‍🍳</text><text x="668" y="124">🧑‍🍳</text><text x="704" y="124">🧑‍🍳</text><text x="740" y="124">🧑‍🍳</text>
    <text x="452" y="156">🧑‍🍳</text><text x="488" y="156">🧑‍🍳</text><text x="524" y="156">🧑‍🍳</text><text x="560" y="156">🧑‍🍳</text><text x="596" y="156">🧑‍🍳</text><text x="632" y="156">🧑‍🍳</text><text x="668" y="156">🧑‍🍳</text><text x="704" y="156">🧑‍🍳</text><text x="740" y="156">🧑‍🍳</text>
  </g>
  <text x="596" y="188" text-anchor="middle" font-size="13" fill="#1c2333" font-weight="700">Chacun fait le même petit geste</text>
  <text x="596" y="208" text-anchor="middle" font-size="13" fill="#4a5468">… chacun sur son propre pixel, tous en même temps</text>
  <rect x="456" y="226" width="280" height="22" rx="11" fill="#ebfbee"/>
  <text x="596" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2b8a3e">le petit geste = le « shader » (programme du pixel)</text>
  <text x="596" y="280" text-anchor="middle" font-size="12.5" fill="#4a5468">→ une image fluide, 60 fois par seconde visées</text>
</svg>
