<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="548" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Serveur trop lent : octants et reprise par le navigateur</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Hébergement PHP mutualisé : une requête qui dépasse max_execution_time est tuée. Les octants concernent m004.</text><rect x="24" y="72" width="364" height="104" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="46" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="46" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="68" y="101" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Le serveur lance l'unité entière</text><text x="40" y="124" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(m004 : un super-bloc 4×4×4, ≤ 64 briques)</text><text x="40" y="143" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >attempts[unité] monte de 1 AVANT le départ</text><text x="40" y="162" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(suivi tenu seulement si l'hôte limite le temps)</text><rect x="412" y="72" width="364" height="104" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="434" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="434" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="456" y="101" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >L'hôte tue la requête ?</text><text x="428" y="124" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >max_execution_time est dépassé : coupure</text><text x="428" y="143" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >au prochain appel, la même unité est</text><text x="428" y="162" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >reprise en 8 octants (2×2×2 briques)</text><rect x="24" y="188" width="364" height="104" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="46" cy="212" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="46" y="217" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="68" y="217" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >Octant par octant</text><text x="40" y="240" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >chacun est rangé puis noté dans le journal</text><text x="40" y="259" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(partial[unité] = [0, 3, 5…])</text><text x="40" y="278" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >l'unité est cochée quand tous y sont</text><rect x="412" y="188" width="364" height="104" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.7" /><circle cx="434" cy="212" r="12" fill="#c92a2a" stroke="none" stroke-width="1"/><text x="434" y="217" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="456" y="217" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Tuée une deuxième fois</text><text x="428" y="240" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >409 unit_timeout (au bout de 2 morts)</text><text x="428" y="259" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >le journal reste « running », rien n'est perdu</text><text x="428" y="278" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >→ le NAVIGATEUR reprend cette étape</text><line x1="388" y1="124" x2="412" y2="124" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="594" y1="176" x2="594" y2="188" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="412" y1="240" x2="388" y2="240" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="24" y="322" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Un super-bloc et ses 8 octants</text><rect x="40" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >0</text><rect x="88" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="110" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >1</text><rect x="40" y="386" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="413" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >2</text><rect x="88" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="110" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >3</text><rect x="190" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="212" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >4</text><rect x="238" y="338" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="365" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >5</text><rect x="190" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="212" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >6</text><rect x="238" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >7</text><text x="88" y="454" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >moitié basse</text><text x="238" y="454" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >moitié haute</text><text x="164" y="472" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle" >verts = déjà rangés (partial)</text><rect x="400" y="326" width="376" height="128" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.6" /><text x="414" y="348" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start" >Ce que garantit le mécanisme</text><text x="414" y="373.7" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• aucun travail déjà rangé n'est perdu ;</text><text x="414" y="391.4" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• un octant n'est lancé que s'il tient dans le temps restant ;</text><text x="414" y="409.09999999999997" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• un nouveau plan remet les compteurs à zéro ;</text><text x="414" y="426.79999999999995" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• le navigateur n'a pas ce plafond de temps.</text><rect x="24" y="488" width="752" height="44" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="515" font-size="11.5" font-weight="600" fill="#1c2333" text-anchor="middle" >« limits.resettable » dit si l'hôte honore set_time_limit() ; sinon l'échéance est le début de la requête + max_execution_time.</text></svg>