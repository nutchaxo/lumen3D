<text x="640" y="112" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >somme des 8 valeurs = 621</text>
<text x="640" y="134" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >+ 4 (pour arrondir au plus proche)</text>
<text x="640" y="160" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >÷ 8, partie entière : (621 + 4) ÷ 8 = 78</text>
