<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 492" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="492" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Qui garantit quoi : la chaîne des empreintes SHA-256</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Valeurs réelles du jeu de démonstration 3D (début des 64 caractères).</text><rect x="270" y="80" width="260" height="120" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="284" y="102" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start" >bricks/manifest.json</text><text x="284" y="128.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sha256 de ses octets :</text><text x="284" y="146.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >6557d1fe4813…</text><text x="284" y="164.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >index.sha256 = "aea0980…"</text><rect x="24" y="80" width="210" height="120" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6" /><text x="38" y="102" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start" >bricks/index.bin</text><text x="38" y="128.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >7 846 octets</text><text x="38" y="146.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sha256 = aea0980…</text><text x="38" y="164.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(vérifié avant usage)</text><rect x="566" y="80" width="210" height="120" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6" /><text x="580" y="102" font-size="14" font-weight="800" fill="#0c8599" text-anchor="start" >paquets l0/c0/p00000.bin</text><text x="580" y="128.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >URL + ?v=aea098088a2a</text><text x="580" y="146.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >→ cache d'un an</text><text x="580" y="164.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(12 premiers hex)</text><line x1="270" y1="140" x2="234" y2="140" stroke="#7048e8" stroke-width="2.2" marker-end="url(#arr)"/><line x1="530" y1="140" x2="566" y2="140" stroke="#0c8599" stroke-width="2.2" marker-end="url(#arr)"/><text x="252" y="130" font-size="10.5" font-weight="600" fill="#7048e8" text-anchor="middle" >index</text><text x="548" y="130" font-size="10.5" font-weight="600" fill="#0c8599" text-anchor="middle" >?v=</text><rect x="80" y="260" width="280" height="100" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="94" y="282" font-size="14" font-weight="800" fill="#e67700" text-anchor="start" >planes/manifest.json</text><text x="94" y="308.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >source.manifestSha256</text><text x="94" y="326.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= 6557d1fe4813…</text><text x="94" y="344.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= l'empreinte du manifeste des briques</text><rect x="440" y="260" width="280" height="100" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="454" y="282" font-size="14" font-weight="800" fill="#e67700" text-anchor="start" >mips/manifest.json</text><text x="454" y="308.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >source.manifestSha256</text><text x="454" y="326.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= 6557d1fe4813…</text><text x="454" y="344.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= la même empreinte</text><path d="M 400 200 L 400 232 L 220 232 L 220 258" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arr)"/><path d="M 400 232 L 580 232 L 580 258" fill="none" stroke="#e67700" stroke-width="2" marker-end="url(#arr)"/><text x="404" y="224" font-size="11.5" font-weight="600" fill="#e67700" text-anchor="start" >« ces plans ont été faits depuis CE manifeste »</text><rect x="24" y="384" width="752" height="90" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="408" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Qui relit ces empreintes ?</text><text x="40" y="430" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• le viewer vérifie l'index avant de s'en servir, et signe les URL de paquets (?v=) ;</text><text x="40" y="448" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• l'import refuse un dossier dont l'index ne correspond pas (index_hash_mismatch) ;</text><text x="40" y="466" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• une migration annule son travail si le manifeste change en route (source_changed) et re-signe planes/ et mips/ après la v3.</text></svg>