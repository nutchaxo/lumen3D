<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Du fichier tracks.json aux sphères de l'écran</text><rect x="20" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="20" y="60" width="178" height="34" rx="14" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><rect x="20" y="78" width="178" height="16" rx="0" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><text x="109" y="83" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >1 · Le fichier</text><text x="109" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">tracks.json</text><text x="32" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Une entrée par cellule :</text><text x="32" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >positions image par image</text><text x="32" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >en µm (stabilisées et</text><text x="32" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >brutes), région, lignée.</text><rect x="30" y="262" width="158" height="38" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="109" y="278" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >démo : 32 675 octets (10</text><text x="109" y="291" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" >991 en .gz)</text><line x1="200" y1="185" x2="214" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="216" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="216" y="60" width="178" height="34" rx="14" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><rect x="216" y="78" width="178" height="16" rx="0" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><text x="305" y="83" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >2 · Le worker</text><text x="305" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">tracks-load-worker.js</text><text x="228" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Télécharge (le .gz</text><text x="228" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d'abord), décompresse, lit</text><text x="228" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >le JSON, range tout dans</text><text x="228" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >des tableaux typés. Hors</text><text x="228" y="214.24" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >du fil principal.</text><rect x="226" y="262" width="158" height="38" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2" /><text x="305" y="278" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle" >jamais de gel de la page</text><line x1="396" y1="185" x2="410" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="412" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="412" y="60" width="178" height="34" rx="14" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><rect x="412" y="78" width="178" height="16" rx="0" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><text x="501" y="83" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >3 · Les tableaux</text><text x="501" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >32 bits, transférés</text><text x="424" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Par image : positions +</text><text x="424" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >numéros de cellule. Par</text><text x="424" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >cellule : lignée, région,</text><text x="424" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >événements, durée de vie.</text><rect x="422" y="262" width="158" height="38" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="501" y="278" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle" >démo : 8 048 octets en</text><text x="501" y="291" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle" >tout</text><line x1="592" y1="185" x2="606" y2="185" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="608" y="60" width="178" height="250" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="608" y="60" width="178" height="34" rx="14" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><rect x="608" y="78" width="178" height="16" rx="0" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><text x="697" y="83" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >4 · La couche</text><text x="697" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >TrackingOverlay</text><text x="620" y="148" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Une sphère par cellule</text><text x="620" y="164.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(maillage instancié). Les</text><text x="620" y="181.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >cinq outils lisent les</text><text x="620" y="197.68" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >mêmes tableaux par</text><text x="620" y="214.24" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ctx.tracking.</text><rect x="618" y="262" width="158" height="38" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="697" y="278" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >une seule copie des</text><text x="697" y="291" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >données</text><rect x="20" y="326" width="760" height="52" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="349" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Pourquoi un worker ? Pendant ce temps le viewer télécharge et décode des briques de 64³ voxels : une lecture JSON de</text><text x="36" y="365.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >plusieurs Mo sur le fil principal se verrait comme un saccade.</text></svg>