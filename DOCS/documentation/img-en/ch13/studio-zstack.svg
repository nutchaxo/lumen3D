<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 392" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="392" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >From the screen to the figure: the Z-stack plane comes from the screen's frame</text><rect x="20" y="56" width="240" height="150" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① The screen's frame</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >getScreenFrameInVolume(): where</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the screen's right and up point inside</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the volume (physical proportions),</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >and what the camera looks along.</text><line x1="262" y1="130" x2="290" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="294" y="56" width="240" height="150" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="308" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② Face and roll</text><text x="308" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The +Z face (yaw 0) or −Z face (yaw</text><text x="308" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >180°, mirror image) nearest the</text><text x="308" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >screen, then the in-plane roll: r =</text><text x="308" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >atan2(r̂y − ûx; r̂x + ûy).</text><line x1="536" y1="130" x2="564" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="568" y="56" width="212" height="150" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="582" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ An oblique plane</text><text x="582" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >oblique mode, axis z, pitch 0,</text><text x="582" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >yaw 0 or 180, roll r, position c =</text><text x="582" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(start + n/2)/z.</text><rect x="20" y="226" width="760" height="156" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="250" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Demo example: cursor on slices 59 to 70 (12 slices) out of 112</text><circle cx="42" cy="270" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="274" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >indices 58 to 69: c = (58 + 12/2) / 112 = 0.571: the plane sits in the middle of the 12 slices.</text><circle cx="42" cy="293.6" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="297.6" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >thickness = 12 samples, one per slice (step 1/112); MIP as soon as n &gt; 1.</text><circle cx="42" cy="317.2" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="321.2" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >on the −Z face the position becomes 1 − c = 0.429: both faces read the same slices.</text><circle cx="42" cy="340.8" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="344.8" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >stabilised series: the slab is taken in the display box, sampled through the same “warp” as the screen.</text></svg>