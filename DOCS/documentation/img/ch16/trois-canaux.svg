<text x="289" y="280" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#4a5468" text-anchor="start">Pourquoi</text>
<text x="289" y="298" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">Logo, nom, pied de page, menu :</text>
<text x="289" y="314" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">tout ce qui est dans la page mais</text>
<text x="289" y="330" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">pas dans une phrase.</text>
