<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Étape 2 + 3 : du signal brut (16 bits) à l'image affichée (8 bits)</text><rect x="110" y="90" width="600" height="230" fill="#fff" stroke="#c5cbd8"/><rect x="110" y="90" width="150" height="230" fill="#fff0f0"/><rect x="580" y="90" width="130" height="230" fill="#fff4e6"/><polyline points="110,320 260,320 580,98 710,98" fill="none" stroke="#3b5bdb" stroke-width="4" stroke-linejoin="round"/><line x1="260" y1="90" x2="260" y2="326" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4"/><line x1="580" y1="90" x2="580" y2="326" stroke="#e67700" stroke-width="2" stroke-dasharray="5 4"/><text x="260" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c92a2a">plancher du fond</text><text x="260" y="358" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">99ᵉ centile des 8 coins</text><text x="580" y="342" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e67700">plafond du signal</text><text x="580" y="358" text-anchor="middle" font-size="11" font-weight="400" fill="#4a5468">99,9ᵉ centile du volume</text><text x="185.0" y="280" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">tout le fond → 0</text><text x="588" y="150" text-anchor="start" font-size="11" font-weight="700" fill="#e67700">0,1 % les plus brillants → 255</text><text x="510" y="250" text-anchor="start" font-size="12" font-weight="600" fill="#3b5bdb">ligne droite : pas de gamma</text><text x="410.0" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#4a5468">valeur brute du voxel (16 bits)</text><text x="64" y="205.0" trans