<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >From the page state to the address's #state=</text><rect x="20" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="20" y="62" width="172" height="32" rx="14" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><rect x="20" y="78" width="172" height="16" rx="0" fill="#e8edff" stroke="#e8edff" stroke-width="1" /><text x="106" y="84" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >State</text><text x="106" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >ui · viewer · plugins</text><text x="106" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >2,580 characters as JSON</text><text x="106" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >(demo E95)</text><line x1="194" y1="128" x2="210" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="212" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="212" y="62" width="172" height="32" rx="14" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><rect x="212" y="78" width="172" height="16" rx="0" fill="#ebfbee" stroke="#ebfbee" stroke-width="1" /><text x="298" y="84" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >Compression</text><text x="298" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">deflate-raw</text><text x="298" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >the browser's</text><text x="298" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >CompressionStream</text><line x1="386" y1="128" x2="402" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="404" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="404" y="62" width="172" height="32" rx="14" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><rect x="404" y="78" width="172" height="16" rx="0" fill="#fff4e6" stroke="#fff4e6" stroke-width="1" /><text x="490" y="84" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >Text</text><text x="490" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">base64url</text><text x="490" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >no + / = : safe in an</text><text x="490" y="161.87" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >address</text><line x1="578" y1="128" x2="594" y2="128" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="596" y="62" width="172" height="130" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="596" y="62" width="172" height="32" rx="14" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><rect x="596" y="78" width="172" height="16" rx="0" fill="#f3f0ff" stroke="#f3f0ff" stroke-width="1" /><text x="682" y="84" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >Address</text><text x="682" y="120" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" font-family="JetBrains Mono, monospace">#state=…</text><text x="682" y="146" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >1,362 characters here</text><rect x="20" y="214" width="244" height="170" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4" /><text x="34" y="238.8" font-size="13.5" font-weight="800" fill="#0c8599" text-anchor="start" >Written only when useful</text><text x="34" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Every second, a fingerprint of the state</text><text x="34" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >is compared. Nothing changed: nothing</text><text x="34" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >is written. Back to the exact opening</text><text x="34" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >state: the address is cleaned. Counters</text><text x="34" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >that move on their own (brick cache)</text><text x="34" y="338.7" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >are ignored.</text><rect x="278" y="214" width="244" height="170" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="292" y="238.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Three ceilings</text><text x="292" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Written: at most 64 KiB of text (beyond,</text><text x="292" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >the address is no longer updated).</text><text x="292" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Read: 2 MiB of text. Inflated: 16 MiB, so</text><text x="292" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >a booby-trapped link cannot “explode”</text><text x="292" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >in memory.</text><rect x="536" y="214" width="244" height="170" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="550" y="238.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >Opening a link</text><text x="550" y="259.35" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >The viewer asks: “Open the saved</text><text x="550" y="275.22" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >view” or “Open the dataset as new”.</text><text x="550" y="291.09" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Escape = open the view (what a link did</text><text x="550" y="306.96" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >before the question). An unreadable</text><text x="550" y="322.83" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >link is simply forgotten.</text></svg>