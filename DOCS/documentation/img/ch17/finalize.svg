<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 502" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="502" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Finalize : l'échange et le changement de version</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Exemple m002 ; m003 est identique avec mips/, m004 ajoute deux gestes (voir le texte).</text><rect x="24" y="72" width="140" height="138" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62" y="101" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Tout est fait ?</text><text x="34" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >toutes les unités cochées</text><text x="34" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >manifestes sources intacts</text><rect x="177" y="72" width="140" height="138" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="197" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="197" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="215" y="101" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Assembler</text><text x="187" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >un fichier zNNNNN.bin à la fois</text><text x="187" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >dans .planes-incoming/</text><text x="187" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >chaque PNG : en-tête vérifié</text><line x1="164" y1="140" x2="177" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="330" y="72" width="140" height="138" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="350" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="350" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="368" y="101" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" >Échanger</text><text x="340" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >planes/ → .planes-old/</text><text x="340" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >.planes-incoming/ → planes/</text><text x="340" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >(deux renommages)</text><line x1="317" y1="140" x2="330" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="483" y="72" width="140" height="138" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.7" /><circle cx="503" cy="96" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="503" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="521" y="101" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Monter la version</text><text x="493" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >formatVersion = 2</text><text x="493" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >sous le verrou de metadata.json</text><text x="493" y="166" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >fusionné, jamais écrasé</text><line x1="470" y1="140" x2="483" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="636" y="72" width="140" height="138" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.7" /><circle cx="656" cy="96" r="12" fill="#4a5468" stroke="none" stroke-width="1"/><text x="656" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="674" y="101" font-size="12.5" font-weight="800" fill="#4a5468" text-anchor="start" >Nettoyer</text><text x="646" y="128" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >supprime .planes-old/</text><text x="646" y="147" font-size="10.8" font-weight="400" fill="#1c2333" text-anchor="start" >journal et tuiles</text><line x1="623" y1="140" x2="636" y2="140" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="24" y="246" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Ce que voit le disque, instant après instant</text><rect x="24" y="258" width="330" height="56" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6" /><text x="189.0" y="281" font-size="12.2" font-weight="800" fill="#c92a2a" text-anchor="middle" >version 1 + ancien état</text><text x="189.0" y="300" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >tout est intact</text><rect x="354" y="258" width="206" height="56" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="457.0" y="281" font-size="12.2" font-weight="800" fill="#e67700" text-anchor="middle" >version 1 + nouveaux fichiers</text><text x="457.0" y="300" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >« à mettre à jour » : relançable</text><rect x="560" y="258" width="216" height="56" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="668.0" y="281" font-size="12.2" font-weight="800" fill="#2b8a3e" text-anchor="middle" >version 2</text><text x="668.0" y="300" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >terminé</text><line x1="354" y1="250" x2="354" y2="322" stroke="#e67700" stroke-width="2.2"/><text x="354" y="336" font-size="11" font-weight="700" fill="#e67700" text-anchor="middle" >renommage</text><line x1="560" y1="250" x2="560" y2="322" stroke="#2b8a3e" stroke-width="2.6"/><text x="560" y="336" font-size="11.2" font-weight="800" fill="#2b8a3e" text-anchor="middle" >◆ le changement de version = le point de validation</text><rect x="24" y="358" width="752" height="128" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="382" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Et si ça plante ?</text><text x="44" y="406" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• pendant l'assemblage : l'ancien état est intact ; on rappelle finalize, il finit les fichiers manquants ;</text><text x="44" y="425" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• entre l'échange et la version : la structure neuve est là, la version est restée basse ; finalize est idempotent ;</text><text x="44" y="444" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• m004 : bricks/ est échangé avec .bricks-incoming/ ; les manifestes planes/ et mips/ sont re-signés AVANT la version ;</text><text x="44" y="463" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• m004 : l'ancien arbre (bricks.v2-old/) n'est supprimé qu'APRÈS le changement de version.</text></svg>