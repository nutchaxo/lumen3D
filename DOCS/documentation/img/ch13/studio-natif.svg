<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >La passe « native » : de l'aperçu à la résolution maximale</text><rect x="20" y="56" width="760" height="56" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.4" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Aperçu (0 octet réseau) : la coupe que la carte graphique tient déjà, rendue en ≤ 2048 px → le Studio s'ouvre tout</text><text x="34" y="97.3" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >de suite.</text><line x1="400" y1="114" x2="400" y2="134" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="138" width="760" height="54" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="34" y="162.4" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Plan de la passe : quelles briques (et quels plans) le plan de coupe traverse-t-il ?</text><line x1="210" y1="194" x2="210" y2="216" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><line x1="590" y1="194" x2="590" y2="216" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="220" width="372" height="168" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="34" y="244.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Chemin « plan » (plan axial ou MIP, volume non</text><text x="34" y="262.35" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >déformé)</text><text x="34" y="282.9" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Une texture 2D à couches qui ne contient que les plans de</text><text x="34" y="299.46" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >voxels réellement échantillonnés. Pour une coupe XY, les</text><text x="34" y="316.02" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >octets viennent de planes/ (un plan = un fichier), de mips/</text><text x="34" y="332.58" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(maxima par couche de 64 plans) ou, à défaut, des briques.</text><rect x="408" y="220" width="372" height="168" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="422" y="244.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Chemin « atlas » (coupe oblique, série stabilisée,</text><text x="422" y="262.35" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >moyenne)</text><text x="422" y="282.9" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Un petit atlas 3D jetable, dimensionné dans le budget de</text><text x="422" y="299.46" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >mémoire vidéo, rempli brique par brique (plages d'octets</text><text x="422" y="316.02" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ciblées). Trop gros : on essaie le niveau juste en dessous.</text><line x1="210" y1="390" x2="400" y2="418" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><line x1="590" y1="390" x2="400" y2="418" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="420" width="760" height="84" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4" /><text x="34" y="444" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" >Rendu progressif : au plus toutes les 0,5 s, dès que 2 % des briques sont arrivées (ou après 2 s), la coupe est re-rendue</text><text x="34" y="460.25" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" >en valeurs brutes ; l'aperçu comble ce qui manque encore ; le Studio recolorie et redessine.</text></svg>