<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="410" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The 2D importer: one ImageJ TIFF → one dataset</text><rect x="20" y="56" width="230" height="232" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >The input file</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >TIFF exported by ImageJ/Fiji from a</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Leica .lif: three 8-bit planes (R, G,</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >B) with their colour tables, or an</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >RGB, or greyscale. Tags read: X/Y</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >resolution (282, 283), description</text><text x="34" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(270), ImageJ block (50839)</text><text x="34" y="200.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >carrying the Leica text.</text><line x1="254" y1="172" x2="290" y2="172" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="294" y="56" width="236" height="232" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="308" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >What is computed</text><text x="308" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Additive composite: output = Σ</text><text x="308" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >table_c[plane_c]. Pixel size = 1 /</text><text x="308" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >resolution, only if the unit is the</text><text x="308" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >micron. Leica settings: zoom,</text><text x="308" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >objective, exposure, gain… Stage,</text><text x="308" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >zoom, date and line read from the</text><text x="308" y="200.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >file name.</text><line x1="534" y1="172" x2="568" y2="172" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="572" y="56" width="208" height="232" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="586" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >DATA_WEB/2d/&lt;dataset&gt;/</text><text x="586" y="112" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >image.webp  (native, q 90)</text><text x="586" y="142" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >preview.webp  (640 px)</text><text x="586" y="172" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >thumbnail.webp  (512²)</text><text x="586" y="202" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >metadata.json</text><text x="586" y="232" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >download/  (option)</text><rect x="20" y="306" width="760" height="88" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="330" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Example: “DLL4xCD1 - E9.5 x3.2 240913 1.tif” → folder DLL4xCD1-E95-x3.2-240913-1, stage E9.5, line DLL4xCD1, zoom ×3.2,</text><text x="36" y="346.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >dissected 2024-09-13, index 1. Nothing is guessed: what the file does not say (staining, line) comes from the command line, and</text><text x="36" y="363.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >--force keeps what the lab corrected by hand.</text></svg>