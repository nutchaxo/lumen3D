<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="560" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">From the changelog to your server: the release chain</text><rect x="24" y="58" width="232" height="96" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,88 V70 a12,12 0 0 1 12,-12 H244 a12,12 0 0 1 12,12 V88 Z" fill="#e8edff"/><text x="38" y="79" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">1 · Developer</text><text x="38" y="106" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">changelog_X.Y.Z.md</text><text x="38" y="124" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">= the version</text><line x1="258" y1="106" x2="278" y2="106" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="280" y="58" width="232" height="96" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M280,88 V70 a12,12 0 0 1 12,-12 H500 a12,12 0 0 1 12,12 V88 Z" fill="#e8edff"/><text x="294" y="79" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">2 · Local checks</text><text x="294" y="106" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">run_all.py</text><text x="294" y="124" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">check_version.py</text><text x="294" y="142" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">--check</text><line x1="514" y1="106" x2="534" y2="106" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="536" y="58" width="232" height="96" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M536,88 V70 a12,12 0 0 1 12,-12 H756 a12,12 0 0 1 12,12 V88 Z" fill="#e8edff"/><text x="550" y="79" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">3 · make_release.py</text><text x="550" y="106" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">checks, tags</text><text x="550" y="124" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">vX.Y.Z, pushes</text><line x1="652" y1="154" x2="652" y2="178" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="24" y="180" width="752" height="160" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="40" y="206" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="start">4 · “test” job — nothing ships if it fails</text><rect x="40" y="224" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="215" y="242.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">tag = newest changelog</text><rect x="406" y="224" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="581" y="242.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">dev_server.py --check</text><rect x="40" y="260" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="215" y="278.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">201 test files (--strict-skips --check-clean)</text><rect x="406" y="260" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="581" y="278.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">no allow-same-origin in a sandbox</text><rect x="40" y="296" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="215" y="314.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">no eval() / new Function() in the code</text><rect x="406" y="296" width="350" height="28" rx="14.0" fill="#fff4e6" stroke="#e67700" stroke-width="1"/><text x="581" y="314.2" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#e67700" text-anchor="middle">no &lt;script src&gt; from the Internet</text><rect x="24" y="356" width="752" height="178" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="40" y="382" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">5 · “release” job — signed, then published at once</text><rect x="40" y="402" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="156" y="424.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">signing key mandatory</text><rect x="285" y="402" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="401" y="424.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">complete processing pack</text><rect x="530" y="402" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="646" y="424.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">signed zip + SHA256SUMS(.sig)</text><rect x="40" y="456" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="156" y="478.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">signature re-verified (pinned key)</text><rect x="285" y="456" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="401" y="478.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">draft → all assets</text><rect x="530" y="456" width="232" height="36" rx="18.0" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1"/><text x="646" y="478.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#2b8a3e" text-anchor="middle">publish as “latest”</text></svg>