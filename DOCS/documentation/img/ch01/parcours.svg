<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="16" fill="#f8f9fd"/>
  <text x="400" y="34" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Le voyage d'une acquisition : du microscope à l'écran</text>

  <!-- 1 microscope -->
  <g transform="translate(24,70)">
    <rect width="168" height="200" rx="14" fill="#fff" stroke="#c5cbd8"/>
    <rect width="168" height="36" rx="14" fill="#e8edff"/><rect y="20" width="168" height="16" fill="#e8edff"/>
    <text x="84" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#3b5bdb">1 · AU LABO</text>
    <text x="84" y="92" text-anchor="middle" font-size="44">🔬</text>
    <text x="84" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">Microscope confocal</text>
    <text x="84" y="150" text-anchor="middle" font-size="12" fill="#4a5468">+ logiciel Imaris</text>
    <rect x="34" y="164" width="100" height="24" rx="12" fill="#fff4e6"/>
    <text x="84" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#e67700">fichier .ims</text>
  </g>
  <line x1="196" y1="170" x2="222" y2="170" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- 2 pipeline -->
  <g transform="translate(226,70)">
    <rect width="168" height="200" rx="14" fill="#fff" stroke="#c5cbd8"/>
    <rect width="168" height="36" rx="14" fill="#ebfbee"/><rect y="20" width="168" height="16" fill="#ebfbee"/>
    <text x="84" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2b8a3e">2 · PRÉPARATION</text>
    <text x="84" y="92" text-anchor="middle" font-size="44">⚙️</text>
    <text x="84" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">Pipeline Python</text>
    <text x="84" y="150" text-anchor="middle" font-size="12" fill="#4a5468">nettoie, réduit, découpe</text>
    <rect x="24" y="164" width="120" height="24" rx="12" fill="#ebfbee"/>
    <text x="84" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#2b8a3e">dossier de briques</text>
  </g>
  <line x1="398" y1="170" x2="424" y2="170" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- 3 server -->
  <g transform="translate(428,70)">
    <rect width="168" height="200" rx="14" fill="#fff" stroke="#c5cbd8"/>
    <rect width="168" height="36" rx="14" fill="#f3f0ff"/><rect y="20" width="168" height="16" fill="#f3f0ff"/>
    <text x="84" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7048e8">3 · EN LIGNE</text>
    <text x="84" y="92" text-anchor="middle" font-size="44">🗄️</text>
    <text x="84" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">Serveur web</text>
    <text x="84" y="150" text-anchor="middle" font-size="12" fill="#4a5468">stocke et distribue</text>
    <rect x="30" y="164" width="108" height="24" rx="12" fill="#f3f0ff"/>
    <text x="84" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#7048e8">DATA_WEB/</text>
  </g>
  <line x1="600" y1="170" x2="626" y2="170" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- 4 browser -->
  <g transform="translate(630,70)">
    <rect width="148" height="200" rx="14" fill="#fff" stroke="#c5cbd8"/>
    <rect width="148" height="36" rx="14" fill="#e3fafc"/><rect y="20" width="148" height="16" fill="#e3fafc"/>
    <text x="74" y="24" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0c8599">4 · À L'ÉCRAN</text>
    <text x="74" y="92" text-anchor="middle" font-size="44">🖥️</text>
    <text x="74" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#1c2333">Navigateur</text>
    <text x="74" y="150" text-anchor="middle" font-size="12" fill="#4a5468">rendu 3D en direct</text>
    <rect x="24" y="164" width="100" height="24" rx="12" fill="#e3fafc"/>
    <text x="74" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#0c8599">viewer 3D</text>
  </g>

  <text x="108" y="300" text-anchor="middle" font-size="12" fill="#4a5468">quelques Go</text>
  <text x="310" y="300" text-anchor="middle" font-size="12" fill="#4a5468">minutes → heures</text>
  <text x="512" y="300" text-anchor="middle" font-size="12" fill="#4a5468">une seule fois</text>
  <text x="704" y="300" text-anchor="middle" font-size="12" fill="#4a5468">en secondes</text>
  <text x="400" y="336" text-anchor="middle" font-size="12.5" font-style="italic" fill="#4a5468">Le fichier d'origine n'est jamais modifié : le pipeline en fabrique une copie optimisée pour le web.</text>
</svg>
