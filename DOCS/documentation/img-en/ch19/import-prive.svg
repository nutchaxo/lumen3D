<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="206" rx="16" fill="#f8f9fd"/>
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Imported files are never served by URL</text>
<rect x="24" y="52" width="140" height="104" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="94.0" y="82" text-anchor="middle" font-size="24">🖥️</text>
<text x="94.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">Browser</text>
<text x="94.0" y="125" text-anchor="middle" font-size="11.5" fill="#1c2333">drags the folder</text>
<line x1="166" y1="104" x2="196" y2="104" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="198" y="52" width="160" height="104" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="278.0" y="82" text-anchor="middle" font-size="24">🛂</text>
<text x="278.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e67700">Allowlist</text>
<text x="278.0" y="125" text-anchor="middle" font-size="11" fill="#1c2333">no .php, .js,</text>
<text x="278.0" y="141" text-anchor="middle" font-size="11" fill="#1c2333">hidden file or ".."</text>
<line x1="360" y1="104" x2="390" y2="104" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="392" y="52" width="170" height="104" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="477.0" y="82" text-anchor="middle" font-size="24">🔒</text>
<text x="477.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7048e8">Private area</text>
<text x="477.0" y="125" text-anchor="middle" font-size="11" fill="#1c2333">uploads/staging/,</text>
<text x="477.0" y="141" text-anchor="middle" font-size="11" fill="#1c2333">no possible URL</text>
<line x1="564" y1="104" x2="594" y2="104" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="596" y="52" width="180" height="104" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="686.0" y="82" text-anchor="middle" font-size="24">🚀</text>
<text x="686.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2b8a3e">Publication</text>
<text x="686.0" y="125" text-anchor="middle" font-size="11" fill="#1c2333">validated, then a</text>
<text x="686.0" y="141" text-anchor="middle" font-size="11" fill="#1c2333">simple move</text>
<text x="400" y="186" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5468">Each block is verified (SHA-256) before being written; the admin preview reads the private area through a relay protected by the session.</text>
</svg>
