<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Jeux « liés » : quatre règles, quatre natures</text><rect x="20" y="60" width="520" height="56" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><text x="36" y="84" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >registered · recalé</text><text x="36" y="102" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >L'un des deux porte un bloc registration (transformations de recalage).</text><rect x="20" y="126" width="520" height="56" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="36" y="150" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >related · lié explicitement</text><text x="36" y="168" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >relatedIds de l'un cite l'autre (dans un sens ou dans l'autre).</text><rect x="20" y="192" width="520" height="56" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><text x="36" y="216" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >same-embryo · même embryon</text><text x="36" y="234" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Même numéro d'embryon et même stade.</text><rect x="20" y="258" width="520" height="56" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.3" /><text x="36" y="282" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >context · contexte</text><text x="36" y="300" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Même date de dissection et même stade (autre embryon possible).</text><rect x="560" y="60" width="220" height="254" rx="12" fill="#f1f3f5" stroke="#4a5468" stroke-width="1.4" /><text x="574" y="84.8" font-size="13.5" font-weight="800" fill="#4a5468" text-anchor="start" >À quoi ça sert</text><text x="574" y="105.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >L'explorateur affiche le badge «</text><text x="574" y="121.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Lié » ; la page 2D et le viewer</text><text x="574" y="138.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >listent les jeux liés d'un autre</text><text x="574" y="155.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >type (une photographie vers son</text><text x="574" y="171.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >volume). L'ordre ci-contre est</text><text x="574" y="188.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >celui qu'on teste : le premier qui</text><text x="574" y="204.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >s'applique donne la nature</text><text x="574" y="221.27" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >affichée.</text></svg>