ext-anchor="start">•</text><text x="54" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">mise à jour avec retour</text><text x="40" y="342" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start">•</text><text x="54" y="342" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">rien à installer</text><path d="M400,98 V116 H400 V132" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="284" y="134" width="232" height="250" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M284,168 V146 a12,12 0 0 1 12,-12 H504 a12,12 0 0 1 12,12 V168 Z" fill="#f3f0ff"/><text x="400" y="158" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#7048e8" text-anchor="middle">PHP 8.1 + Apache</text><text x="400" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">mutualisé d&#x27;université</text><rect x="298" y="206" width="204" height="30" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="400" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="middle">.htaccess + _serve.php</text><text x="300" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start">•</text><text x="314" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">même administration</text><text x="300" y="304" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start">•</text><text x="314" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">mise à jour sans retour</text><text x="300" y="342" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start">•</text><text x="314" y="342" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">php -S pour tester</text><path d="M400,98 V116 H660 V132" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="544" y="134" width="232" height="250" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M544,168 V146 a12,12 0 0 1 12,-12 H764 a12,12 0 0 1 12,12 V168 Z" fill="#eef0f5"/><text x="660" y="158" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="middle">Fichiers seulement</text><text x="660" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">stockage statique, GitHub Pages…</text><rect x="558" y="206" width="204" height="30" rx="8" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/><text x="660" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#4a5468" text-anchor="middle">aucun programme</text><text x="560" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">pas d&#x27;administration</text><text x="560" y="304" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">pas de catalogue généré</text><text x="560" y="342" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="342" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">pas de CSP à nonce</text><text x="400" y="414" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">fast_server.py : mêmes réponses publiques que dev_server.py, sans administration — pour mesurer les performances.</text></svg>