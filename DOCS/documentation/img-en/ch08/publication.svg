<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="332" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >“All or nothing” publication: the shop window changes only when the new one is ready</text><rect x="24" y="70" width="142" height="110" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="2" /><text x="95" y="98" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="middle" >1 · Build</text><text x="95" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >everything is built</text><text x="95" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >in a private folder</text><line x1="168" y1="125" x2="178" y2="125" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="70" width="142" height="110" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="2" /><text x="251" y="98" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="middle" >2 · Set aside</text><text x="251" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >marker written,</text><text x="251" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >old → .pre-swap</text><line x1="324" y1="125" x2="334" y2="125" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="336" y="70" width="142" height="110" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" /><text x="407" y="98" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="middle" >3 · Install</text><text x="407" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >new bricks/,</text><text x="407" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >planes/, mips/…</text><line x1="480" y1="125" x2="490" y2="125" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="492" y="70" width="142" height="110" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="2" /><text x="563" y="98" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="middle" >4 · Commit</text><text x="563" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >metadata.json written</text><text x="563" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >LAST</text><line x1="636" y1="125" x2="646" y2="125" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="648" y="70" width="142" height="110" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2" /><text x="719" y="98" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="middle" >5 · Clean up</text><text x="719" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >marker and .pre-swap</text><text x="719" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >removed</text><rect x="24" y="202" width="752" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="232" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >Failure BEFORE step 4: everything is put back; the published dataset never stopped working.</text><text x="40" y="257" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Crash in the middle: at the next launch, the marker lets the pipeline finish or undo cleanly,</text><text x="40" y="282" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >depending on whether metadata.json (its sha256 is stored in the marker) is already in place.</text></svg>