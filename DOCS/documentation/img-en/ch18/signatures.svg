<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="560" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">A release&#x27;s signature chain</text><text x="24" y="66" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start">1 · At the publisher (GitHub CI)</text><rect x="24" y="78" width="224" height="84" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="136" y="107.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">SHA256SUMS</text><text x="136" y="124.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">one line per published file:</text><text x="136" y="140.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">zip, packs, notes</text><rect x="288" y="78" width="224" height="84" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="400" y="107.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Ed25519 signature</text><text x="400" y="124.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">private seed = GitHub secret</text><text x="400" y="140.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">LUMEN_SIGNING_KEY</text><rect x="552" y="78" width="224" height="84" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="664" y="116.125" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">SHA256SUMS.sig</text><text x="664" y="132.625" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">128 hexadecimal characters</text><line x1="250" y1="120" x2="286" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><line x1="514" y1="120" x2="550" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><text x="400" y="196" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#4a5468" text-anchor="middle">▼  published together with the zip, as assets of the GitHub release  ▼</text><text x="24" y="232" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">2 · At your site (Python server, PHP server or installer)</text><rect x="24" y="246" width="172" height="86" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="110" y="276.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Pinned public key</text><text x="110" y="293.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">written in the code,</text><text x="110" y="309.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">in three copies</text><line x1="198" y1="289" x2="212" y2="289" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="214" y="246" width="172" height="86" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="300" y="276.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Signature valid?</text><text x="300" y="293.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">computed over the exact</text><text x="300" y="309.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">bytes of SHA256SUMS</text><line x1="388" y1="289" x2="402" y2="289" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="404" y="246" width="172" height="86" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="490" y="276.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Zip listed?</text><text x="490" y="293.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">recomputed SHA-256 =</text><text x="490" y="309.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">SHA256SUMS line</text><line x1="578" y1="289" x2="592" y2="289" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="594" y="246" width="172" height="86" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="680" y="276.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Extraction</text><text x="680" y="293.375" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">only after the</text><text x="680" y="309.875" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">two checks</text><rect x="24" y="356" width="752" height="186" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="40" y="384" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Refused outright (fail-closed): the update stops</text><text x="40" y="410" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• no SHA256SUMS in the release, or archive missing from the list</text><text x="40" y="432" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• no SHA256SUMS.sig although a key is pinned</text><text x="40" y="454" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• unreadable signature, or invalid for the pinned key</text><text x="40" y="476" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• zip digest different from the listed one</text><text x="40" y="498" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• several archives of that name, or name ≠ lumen3d-web-&lt;version&gt;.zip</text><text x="40" y="520" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">• never GitHub&#x27;s automatic “source” zip (not listed)</text></svg>