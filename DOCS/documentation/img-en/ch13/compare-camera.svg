<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="360" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Syncing the camera of two differently calibrated embryos</text><rect x="20" y="56" width="230" height="150" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Panel A</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Cube pose Q_A. Calibration</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Q_baseA (file axes → anatomy).</text><text x="34" y="168" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">Q_anat = Q_A · Q_baseA⁻¹</text><line x1="254" y1="130" x2="308" y2="130" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)" /><rect x="312" y="56" width="168" height="150" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="326" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >The host</text><text x="326" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Relays SYNC_CAMERA</text><text x="326" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >untouched, and keeps</text><text x="326" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the last message for a</text><text x="326" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >late panel.</text><line x1="484" y1="130" x2="538" y2="130" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)" /><rect x="542" y="56" width="238" height="150" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="556" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Panel B</text><text x="556" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Receives Q_anat and poses its cube</text><text x="556" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >with its own calibration:</text><text x="556" y="168" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">Q_B = Q_anat · Q_baseB</text><rect x="20" y="226" width="760" height="120" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="250" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Q_anat is a pose of the anatomy (“ventral face towards me, anterior up”), not file axes. Two embryos oriented differently in</text><text x="36" y="267.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >their files therefore look in the same anatomical direction. Without calibration, Q_base = identity.</text><text x="36" y="308" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >Channels sync by name (“Pecam1” to “Pecam1”); the Z-stack slice and the oblique plane by normalised position; a</text><text x="36" y="325.25" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >photograph by physical view (µm per screen pixel).</text></svg>