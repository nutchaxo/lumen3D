<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="224" rx="16" fill="#f8f9fd"/>
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Signed releases and catalogue (Ed25519)</text>
<rect x="24" y="52" width="230" height="118" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="139.0" y="82" text-anchor="middle" font-size="24">🖊️</text>
<text x="139.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">Publisher (CI)</text>
<text x="139.0" y="125" text-anchor="middle" font-size="11.5" fill="#1c2333">tests everything, then signs the</text>
<text x="139.0" y="141" text-anchor="middle" font-size="11.5" fill="#1c2333">SHA256SUMS list with the</text>
<text x="139.0" y="157" text-anchor="middle" font-size="11.5" fill="#1c2333">private (secret) key</text>
<line x1="256" y1="110" x2="296" y2="110" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="298" y="52" width="200" height="118" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="398.0" y="82" text-anchor="middle" font-size="24">📦</text>
<text x="398.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e67700">Published release</text>
<text x="398.0" y="125" text-anchor="middle" font-size="11.5" fill="#1c2333">archive + SHA256SUMS</text>
<text x="398.0" y="141" text-anchor="middle" font-size="11.5" fill="#1c2333">+ SHA256SUMS.sig</text>
<text x="398.0" y="157" text-anchor="middle" font-size="11.5" fill="#1c2333">(the "wax seal")</text>
<line x1="500" y1="110" x2="540" y2="110" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="542" y="52" width="234" height="118" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="659.0" y="82" text-anchor="middle" font-size="24">🔍</text>
<text x="659.0" y="106" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2b8a3e">Your server</text>
<text x="659.0" y="125" text-anchor="middle" font-size="11.5" fill="#1c2333">checks the seal with the</text>
<text x="659.0" y="141" text-anchor="middle" font-size="11.5" fill="#1c2333">public key in its code; otherwise</text>
<text x="659.0" y="157" text-anchor="middle" font-size="11.5" fill="#1c2333">refusal, no update</text>
<text x="400" y="204" text-anchor="middle" font-size="11.5" font-weight="400" fill="#4a5468">A second, separate key signs the plugin catalogue (with a serial number that prevents rolling back to an older catalogue).</text>
</svg>
