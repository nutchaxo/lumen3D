<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 414" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="414" rx="16" fill="#f8f9fd"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Une brique en difficulté : l'échelle des replis</text>
<rect x="24" y="56" width="224" height="74" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="136.0" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#3b5bdb">1 · Télécharger</text>
<text x="136.0" y="102" text-anchor="middle" font-size="12" fill="#4a5468">le pack, par le réseau</text>
<rect x="288" y="56" width="224" height="74" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="400.0" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">2 · Décoder</text>
<text x="400.0" y="102" text-anchor="middle" font-size="12" fill="#4a5468">un worker, en arrière-plan</text>
<rect x="552" y="56" width="224" height="74" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="664.0" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="#7048e8">3 · Afficher</text>
<text x="664.0" y="102" text-anchor="middle" font-size="12" fill="#4a5468">la carte graphique (WebGL2)</text>
<line x1="250" y1="93" x2="286" y2="93" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="514" y1="93" x2="550" y2="93" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="136" y1="132" x2="136" y2="160" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrr)"/>
<rect x="24" y="162" width="224" height="96" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="136.0" y="188" text-anchor="middle" font-size="12.5" fill="#1c2333">Pas de réponse pendant 30 s,</text>
<text x="136.0" y="207" text-anchor="middle" font-size="12.5" fill="#1c2333">erreur réseau, brique illisible :</text>
<text x="136.0" y="226" text-anchor="middle" font-size="12.5" fill="#1c2333">3 essais (attente 0,5 s puis 1 s)</text>
<line x1="136" y1="260" x2="136" y2="288" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="24" y="290" width="224" height="82" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="136.0" y="316" text-anchor="middle" font-size="12" fill="#1c2333">Toujours en échec :</text>
<text x="136.0" y="333" text-anchor="middle" font-size="12" fill="#1c2333">la brique est signalée,</text>
<text x="136.0" y="350" text-anchor="middle" font-size="12" fill="#1c2333">jamais livrée, comptée dans</text>
<text x="136.0" y="367" text-anchor="middle" font-size="12" fill="#1c2333">le bilan du lot (failed)</text>
<line x1="400" y1="132" x2="400" y2="160" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrr)"/>
<rect x="288" y="162" width="224" height="96" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="400.0" y="188" text-anchor="middle" font-size="12.5" fill="#1c2333">Worker planté ou figé (30 s) :</text>
<text x="400.0" y="207" text-anchor="middle" font-size="12.5" fill="#1c2333">il est remplacé (3 fois au plus),</text>
<text x="400.0" y="226" text-anchor="middle" font-size="12.5" fill="#1c2333">puis décodage dans la page</text>
<line x1="400" y1="260" x2="400" y2="288" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="288" y="290" width="224" height="82" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="400.0" y="316" text-anchor="middle" font-size="12" fill="#1c2333">La tâche repart sur un</text>
<text x="400.0" y="333" text-anchor="middle" font-size="12" fill="#1c2333">autre worker. Le reste du</text>
<text x="400.0" y="350" text-anchor="middle" font-size="12" fill="#1c2333">volume continue de</text>
<text x="400.0" y="367" text-anchor="middle" font-size="12" fill="#1c2333">s'afficher</text>
<line x1="664" y1="132" x2="664" y2="160" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrr)"/>
<rect x="552" y="162" width="224" height="96" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="664.0" y="188" text-anchor="middle" font-size="12.5" fill="#1c2333">Pas de textures 3D (WebGL2) :</text>
<text x="664.0" y="207" text-anchor="middle" font-size="12.5" fill="#1c2333">refus avec un message clair,</text>
<text x="664.0" y="226" text-anchor="middle" font-size="12.5" fill="#1c2333">jamais de plantage de l'onglet</text>
<line x1="664" y1="260" x2="664" y2="288" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="552" y="290" width="224" height="82" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="664.0" y="316" text-anchor="middle" font-size="12" fill="#1c2333">Aucune donnée corrompue</text>
<text x="664.0" y="333" text-anchor="middle" font-size="12" fill="#1c2333">n'atteint la mémoire</text>
<text x="664.0" y="350" text-anchor="middle" font-size="12" fill="#1c2333">graphique</text>
<text x="400" y="400" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2333">Règle d'or : une brique douteuse est écartée, jamais affichée de travers, et l'onglet ne plante pas.</text>
</svg>
