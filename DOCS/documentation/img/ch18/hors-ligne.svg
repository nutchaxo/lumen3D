<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="470" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Ce qui marche sans Internet, et ce qui en demande</text><rect x="24" y="54" width="380" height="394" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="40" y="82" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">Sans Internet (réseau fermé d&#x27;un institut)</text><text x="40" y="114" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="114" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">toutes les pages et leurs scripts</text><text x="40" y="154" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="154" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">Three.js, Lucide, Plotly : fichiers du site</text><text x="40" y="194" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="194" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">vos jeux de données et le catalogue</text><text x="40" y="234" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="234" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">le panneau d&#x27;administration</text><text x="40" y="274" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="274" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">l&#x27;import et les mises à jour de données</text><text x="40" y="314" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">✓</text><text x="64" y="314" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#1c2333" text-anchor="start">l&#x27;affichage 3D (carte graphique locale)</text><rect x="420" y="54" width="356" height="250" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="436" y="82" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start">Demande Internet — l&#x27;administrateur seulement</text><text x="436" y="114" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">api.github.com</text><text x="436" y="134" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">chercher une nouvelle version</text><text x="436" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">github.com</text><text x="436" y="190" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">télécharger la version et les packs</text><text x="436" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start">raw.githubusercontent.com</text><text x="436" y="246" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">lire le catalogue de plugins signé</text><text x="436" y="282" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#e67700" text-anchor="start">Un visiteur ne contacte jamais GitHub.</text><rect x="420" y="318" width="356" height="130" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/><text x="436" y="344" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start">La seule exception côté visiteur</text><text x="436" y="370" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#4a5468" text-anchor="start">fonts.googleapis.com  fonts.gstatic.com</text><text x="436" y="394" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">Les polices ne gênent pas l&#x27;affichage :</text><text x="436" y="414" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">sans réseau, la page s&#x27;affiche avec les polices</text><text x="436" y="432" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">du système.</text></svg>