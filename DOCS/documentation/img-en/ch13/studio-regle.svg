<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 412" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="412" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Turning a ruler on non-square pixels</text><text x="400" y="58" font-size="12.5" font-weight="600" fill="#4a5468" text-anchor="middle" >Example: pixels of 1 µm × 2 µm (a pixel is twice as tall as it is wide)</text><rect x="40" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="40" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="40" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="40" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="40" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="40" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="52" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="64" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="76" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="156" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="180" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="88" y="204" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="100" y="84" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="100" y="108" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="100" y="132" width="12" height="24" rx="0" fill="#fff" stroke="#dee2e6" stroke-width="0.7" /><rect x="100" y="156" width="12" height="24" rx