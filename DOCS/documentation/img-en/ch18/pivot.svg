<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="600" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">The switch: a supervisor, a probe, a rollback</text><rect x="12" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M12,86 V68 a12,12 0 0 1 12,-12 H140 a12,12 0 0 1 12,12 V86 Z" fill="#e8edff"/><text x="82" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle">1 · Clean stop</text><text x="82" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">the current server</text><text x="82" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">stops listening</text><line x1="154" y1="106" x2="166" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="168" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M168,86 V68 a12,12 0 0 1 12,-12 H296 a12,12 0 0 1 12,12 V86 Z" fill="#e8edff"/><text x="238" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle">2 · Port free?</text><text x="238" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">the supervisor</text><text x="238" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">waits ≤ 30 s</text><line x1="310" y1="106" x2="322" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="324" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M324,86 V68 a12,12 0 0 1 12,-12 H452 a12,12 0 0 1 12,12 V86 Z" fill="#fff4e6"/><text x="394" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="middle">3 · Swap</text><text x="394" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">renames</text><text x="394" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">journalled</text><line x1="466" y1="106" x2="478" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="480" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M480,86 V68 a12,12 0 0 1 12,-12 H608 a12,12 0 0 1 12,12 V86 Z" fill="#f3f0ff"/><text x="550" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle">4 · Start</text><text x="550" y="108" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">the new server</text><text x="550" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">is launched</text><line x1="622" y1="106" x2="634" y2="106" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="636" y="56" width="140" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M636,86 V68 a12,12 0 0 1 12,-12 H764 a12,12 0 0 1 12,12 V86 Z" fill="#e3fafc"/><text x="706" y="77" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="middle">5 · Health probe</text><text x="706" y="108" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">/api/health</text><text x="706" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle">≤ 30 s</text><path d="M742,158 V216" fill="none" stroke="#2b8a3e" stroke-width="2.4" marker-end="url(#arr)"/><text x="750" y="190" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="start">answers</text><path d="M690,158 V190 H205 V214" fill="none" stroke="#c92a2a" stroke-width="2.4" marker-end="url(#arr)"/><text x="450" y="184" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">no answer in 30 s, or wrong version</text><rect x="400" y="216" width="380" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="416" y="242" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">Success</text><text x="416" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">the journal is erased, the staging folder purged,</text><text x="416" y="288" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">the result is remembered for the admin panel.</text><rect x="20" y="216" width="370" height="150" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="36" y="242" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Automatic rollback</text><text x="36" y="268" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">1. stop the new server, wait for the port</text><text x="36" y="288" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">2. journal marked “rolling_back” BEFORE acting</text><text x="36" y="308" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">3. reverse renames (the old tree comes back)</text><text x="36" y="328" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">4. old server restarted, confirmation probe</text><text x="36" y="348" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">5. “rolled_back” result shown in the admin</text><rect x="20" y="392" width="760" height="186" rx="12" fill="#fff" stroke="#4a5468" stroke-width="1.2" stroke-dasharray="6 5"/><text x="36" y="418" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start">And if the supervisor itself dies (power cut)?</text><text x="36" y="444" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start">At the next start the server finds the journal and decides:</text><rect x="36" y="460" width="350" height="96" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="46" y="496.2" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start">Go forward only if…</text><text x="46" y="512.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">phase “applied” or “done”, version = target</text><text x="46" y="528.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">AND every file has the right SHA-256</text><rect x="406" y="460" width="358" height="96" rx="10" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="416" y="496.2" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start">In every other case: roll back</text><text x="416" y="512.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">(including an interrupted rollback:</text><text x="416" y="528.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">never trust the version alone)</text></svg>