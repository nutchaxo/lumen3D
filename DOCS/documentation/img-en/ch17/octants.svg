<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 548" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="548" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Server too slow: octants and browser takeover</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Shared PHP host: a request that exceeds max_execution_time is killed. Octants concern m004.</text><rect x="24" y="72" width="364" height="104" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="46" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="46" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="68" y="101" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >The server starts the whole unit</text><text x="40" y="124" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(m004: one 4×4×4 super-block, ≤ 64 bricks)</text><text x="40" y="143" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >attempts[unit] goes up by 1 BEFORE the start</text><text x="40" y="162" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(kept only when the host limits time)</text><rect x="412" y="72" width="364" height="104" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="434" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="434" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="456" y="101" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >The host kills the request?</text><text x="428" y="124" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >max_execution_time exceeded: cut off</text><text x="428" y="143" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >at the next call, the same unit is</text><text x="428" y="162" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >redone as 8 octants (2×2×2 bricks)</text><rect x="24" y="188" width="364" height="104" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="46" cy="212" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="46" y="217" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="68" y="217" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >Octant by octant</text><text x="40" y="240" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >each is stored then noted in the journal</text><text x="40" y="259" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >(partial[unit] = [0, 3, 5…])</text><text x="40" y="278" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >the unit is ticked when all are in</text><rect x="412" y="188" width="364" height="104" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.7" /><circle cx="434" cy="212" r="12" fill="#c92a2a" stroke="none" stroke-width="1"/><text x="434" y="217" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="456" y="217" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Killed a second time</text><text x="428" y="240" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >409 unit_timeout (after 2 deaths)</text><text x="428" y="259" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >the journal stays “running”, nothing is lost</text><text x="428" y="278" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >→ the BROWSER takes this step over</text><line x1="388" y1="124" x2="412" y2="124" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="594" y1="176" x2="594" y2="188" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><line x1="412" y1="240" x2="388" y2="240" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="24" y="322" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >A super-block and its 8 octants</text><rect x="40" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >0</text><rect x="88" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="110" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >1</text><rect x="40" y="386" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="413" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >2</text><rect x="88" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="110" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >3</text><rect x="190" y="338" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="212" y="365" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >4</text><rect x="238" y="338" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="365" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >5</text><rect x="190" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="212" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >6</text><rect x="238" y="386" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="413" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >7</text><text x="88" y="454" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >lower half</text><text x="238" y="454" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >upper half</text><text x="164" y="472" font-size="11" font-weight="600" fill="#2b8a3e" text-anchor="middle" >green = already stored (partial)</text><rect x="400" y="326" width="376" height="128" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.6" /><text x="414" y="348" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start" >What the mechanism guarantees</text><text x="414" y="373.7" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• no work already stored is lost;</text><text x="414" y="391.4" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• an octant starts only if it fits in the time left;</text><text x="414" y="409.09999999999997" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• a new plan resets the counters;</text><text x="414" y="426.79999999999995" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• the browser has no such time ceiling.</text><rect x="24" y="488" width="752" height="44" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="515" font-size="11.5" font-weight="600" fill="#1c2333" text-anchor="middle" >“limits.resettable” says whether the host honours set_time_limit(); otherwise the deadline is request start + max_execution_time.</text></svg>