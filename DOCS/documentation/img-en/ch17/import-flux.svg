<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="424" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >From the dropped folder to the published dataset</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Six steps; only the three in the middle move bytes.</text><rect x="24.0" y="72" width="118" height="124" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44.0" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44.0" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62.0" y="101" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Drop</text><text x="34.0" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >drag the folder</text><text x="34.0" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >the browser reads it</text><text x="34.0" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >(8 files at a time)</text><rect x="150.8" y="72" width="118" height="124" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="170.8" cy="96" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="170.8" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="188.8" y="101" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Plan</text><text x="160.8" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >1 request/dataset:</text><text x="160.8" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >the list of files</text><text x="160.8" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >+ their sizes</text><rect x="277.6" y="72" width="118" height="124" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="297.6" cy="96" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="297.6" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="315.6" y="101" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Send</text><text x="287.6" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >8 MiB chunks</text><text x="287.6" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >SHA-256 per chunk</text><text x="287.6" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >4 in parallel</text><rect x="404.4" y="72" width="118" height="124" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="424.4" cy="96" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="424.4" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="442.4" y="101" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Close</text><text x="414.4" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >a finished file:</text><text x="414.4" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >size + content +</text><text x="414.4" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >overall fingerprint</text><rect x="531.2" y="72" width="118" height="124" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="551.2" cy="96" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="551.2" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="569.2" y="101" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Validate</text><text x="541.2" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >is the dataset</text><text x="541.2" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >whole, consistent?</text><text x="541.2" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >(error codes)</text><rect x="658.0" y="72" width="118" height="124" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.7" /><circle cx="678.0" cy="96" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="678.0" y="101" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >6</text><text x="696.0" y="101" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >Publish</text><text x="668.0" y="128" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >one rename</text><text x="668.0" y="147" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >into DATA_WEB/</text><text x="668.0" y="166" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >hidden by default</text><rect x="24" y="214" width="366" height="28" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="207" y="233" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" >in the browser (a Web Worker does the whole transfer)</text><rect x="400" y="214" width="376" height="28" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.3" /><text x="588" y="233" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" >on the server: never-served staging, then DATA_WEB/</text><rect x="24" y="258" width="752" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="282" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >The three guarantees that make the difference</text><text x="44" y="312" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Resume: </text><text x="130" y="312" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >a journal notes every chunk received; dropping the folder again resumes to the chunk, even under the other server.</text><text x="44" y="342" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Control: </text><text x="130" y="342" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >nothing is written before the path (allowlist) and the chunk fingerprint are checked.</text><text x="44" y="372" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="start" >Priority: </text><text x="130" y="372" font-size="11.6" font-weight="400" fill="#1c2333" text-anchor="start" >the files that make the dataset openable go first (tiers): you can edit before the end.</text><text x="44" y="396" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="start" >Nothing reaches DATA_WEB/ without your click on Publish.</text></svg>