<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="372" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Three frames, one scale relation</text><rect x="20" y="56" width="232" height="130" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① Image (ix, iy)</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The photograph's pixels as stored</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(1920 × 1440 on the demo).</text><line x1="254" y1="120" x2="282" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="284" y="56" width="232" height="130" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="298" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② Oriented (ox, oy)</text><text x="298" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >After the mirror, then the rotation</text><text x="298" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >about the centre. Bounding box: w</text><text x="298" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >= W·|cos θ| + H·|sin θ|.</text><line x1="518" y1="120" x2="546" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="548" y="56" width="232" height="130" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="562" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ Canvas (sx, sy)</text><text x="562" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >CSS pixels of the screen: sx =</text><text x="562" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ox·scale + tx, sy = oy·scale + ty.</text><text x="268" y="206" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" >mirror + rotation</text><text x="532" y="206" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom + pan</text><rect x="20" y="222" width="760" height="132" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="246" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >The only calibration relation</text><text x="36" y="272" font-size="13" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">length L (µm)  →  L / pixelSizeUm × scale  CSS pixels, in all three frames</text><text x="36" y="298" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A rotation is rigid: it does not change the scale. Example: 2 µm per pixel, scale = 0.5 → 1 image pixel = 0.5 screen pixel, so 100</text><text x="36" y="314.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >µm = 100/2 × 0.5 = 25 CSS pixels. The scale bar, the grid, the measurements and the split view all rest on this one line.</text></svg>