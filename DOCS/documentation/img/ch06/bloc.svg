<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
<rect width="800" height="300" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Réduire : la moyenne d'un bloc 2 × 2 × 2 (valeurs réelles du jeu de démonstration)</text>
<text x="130" y="70" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >coupe z</text>
<rect x="60" y="82" width="70" height="50" fill="rgb(161,161,161)" stroke="#fff" stroke-width="2"/>
<text x="95" y="113" font-size="17" font-weight="800" fill="#1c2333" text-anchor="middle" >162</text>
<rect x="130" y="82" width="70" height="50" fill="rgb(126,126,126)" stroke="#fff" stroke-width="2"/>
<text x="165" y="113" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >115</text>
