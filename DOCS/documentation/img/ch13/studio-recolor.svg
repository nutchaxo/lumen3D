<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="430" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Recolorer sans refaire le rendu : des valeurs brutes aux couleurs</text><rect x="20" y="56" width="190" height="176" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① raw : les valeurs</text><text x="34" y="98.35" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >brutes</text><text x="34" y="118.9" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Pour chaque pixel de la</text><text x="34" y="136.15" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >coupe, les valeurs des</text><text x="34" y="153.4" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >canaux 0 à 3 telles que la</text><text x="34" y="170.65" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >carte graphique les a lues</text><text x="34" y="187.9" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >dans l'atlas (4 octets</text><text x="34" y="205.15" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >RGBA). Une seule fois, au</text><text x="34" y="222.4" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >rendu de la coupe.</text><line x1="214" y1="140" x2="246" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="250" y="56" width="300" height="176" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="264" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② SliceCompositor</text><text x="264" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Applique à chaque canal allumé exactement</text><text x="264" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >l'arithmétique du shader de coupe, sur son</text><text x="264" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >propre canevas WebGL2 (ou une table de</text><text x="264" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >256 valeurs si WebGL2 manque). Une passe</text><text x="264" y="170.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >par changement de réglage.</text><line x1="554" y1="140" x2="586" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="590" y="56" width="190" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="604" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ L'image du Studio</text><text x="604" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Les couleurs du document,</text><text x="604" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >pas celles du viewer. Les</text><text x="604" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >calques ne bougent pas :</text><text x="604" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >même cadre, mêmes</text><text x="604" y="170.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >pixels.</text><rect x="20" y="252" width="760" height="156" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="276" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >La formule, canal par canal (i = canaux allumés)</text><text x="40" y="300" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">vᵢ = clamp( (rawᵢ/255 − minᵢ) / max(maxᵢ − minᵢ ; 0,0001) ; 0 ; 1 )</text><text x="40" y="322" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">vᵢ = vᵢ ^ gammaᵢ</text><text x="40" y="344" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">rgb = clamp( Σ vᵢ · opacitéᵢ · couleurᵢ ; 0 ; 1 )</text><text x="40" y="374" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Transparent si |rgb| &lt; 0,005 pour une coupe simple ; opaque (noir si rien ne s'affiche) pour une tranche projetée en MIP ou en</text><text x="40" y="390.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >moyenne.</text></svg>