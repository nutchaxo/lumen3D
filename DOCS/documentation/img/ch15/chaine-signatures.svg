<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="500" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Deux clés, deux chaînes de signatures</text><rect x="24" y="56" width="752" height="198" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="56" width="752" height="30" rx="12" fill="#e8edff" stroke="#c5cbd8" stroke-width="1.2"/><text x="40" y="76" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start">Clé des releases (le logiciel)</text><rect x="40" y="100" width="210" height="66" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="145" y="122" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle">clé PRIVÉE (graine)</text><text x="145" y="141" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#4a5468" text-anchor="middle">LUMEN_SIGNING_KEY (CI)</text><text x="145" y="157" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="middle">chez l'éditeur seulement</text><line x1="254" y1="134" x2="298" y2="134" stroke="#3b5bdb" stroke-width="2.2" marker-end="url(#arr)"/><text x="276" y="122" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#3b5bdb" text-anchor="middle">signe</text><rect x="302" y="100" width="226" height="66" rx="10" fill="#fff" stroke="#3b5bdb" stroke-width="1.2"/><text x="415" y="124" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.6" font-weight="700" fill="#1c2333" text-anchor="middle">SHA256SUMS.sig</text><text x="415" y="146" font-family="Inter, sans-serif" font-size="9.6" font-weight="400" fill="#4a5468" text-anchor="middle">signe la liste des empreintes</text><rect x="538" y="100" width="226" height="66" rx="10" fill="#fff" stroke="#3b5bdb" stroke-width="1.2"/><text x="651" y="124" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.6" font-weight="700" fill="#1c2333" text-anchor="middle">lumen3d-web-X.Y.Z.zip</text><text x="651" y="146" font-family="Inter, sans-serif" font-size="9.6" font-weight="400" fill="#4a5468" text-anchor="middle">la plateforme, sans les plugins</text><rect x="40" y="182" width="720" height="56" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="52" y="202" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">clé PUBLIQUE épinglée dans le code source, livrée avec chaque version :</text><text x="52" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.4" font-weight="500" fill="#4a5468" text-anchor="start">_RELEASE_PUBKEY_HEX · LUMEN_RELEASE_PUBKEY · install.php</text><rect x="24" y="270" width="752" height="198" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="270" width="752" height="30" rx="12" fill="#f3f0ff" stroke="#c5cbd8" stroke-width="1.2"/><text x="40" y="290" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start">Clé du catalogue (les plugins)</text><rect x="40" y="314" width="210" height="66" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="145" y="336" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7048e8" text-anchor="middle">clé PRIVÉE (graine)</text><text x="145" y="355" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#4a5468" text-anchor="middle">LUMEN_MARKETPLACE_SIGNING_KEY</text><text x="145" y="371" font-family="Inter, sans-serif" font-size="10.5" font-weight="400" fill="#4a5468" text-anchor="middle">chez l'éditeur seulement</text><line x1="254" y1="348" x2="298" y2="348" stroke="#7048e8" stroke-width="2.2" marker-end="url(#arr)"/><text x="276" y="336" font-family="Inter, sans-serif" font-size="10.5" font-weight="700" fill="#7048e8" text-anchor="middle">signe</text><rect x="302" y="314" width="226" height="66" rx="10" fill="#fff" stroke="#7048e8" stroke-width="1.2"/><text x="415" y="338" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.6" font-weight="700" fill="#1c2333" text-anchor="middle">catalog.json.sig</text><text x="415" y="360" font-family="Inter, sans-serif" font-size="9.6" font-weight="400" fill="#4a5468" text-anchor="middle">signe le catalogue (+ serial)</text><rect x="538" y="314" width="226" height="66" rx="10" fill="#fff" stroke="#7048e8" stroke-width="1.2"/><text x="651" y="338" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.6" font-weight="700" fill="#1c2333" text-anchor="middle">plugin-&lt;id&gt;-&lt;ver&gt;.zip</text><text x="651" y="360" font-family="Inter, sans-serif" font-size="9.6" font-weight="400" fill="#4a5468" text-anchor="middle">un zip par plugin</text><rect x="40" y="396" width="720" height="56" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="52" y="416" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">clé PUBLIQUE épinglée dans le code source, livrée avec chaque version :</text><text x="52" y="436" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.4" font-weight="500" fill="#4a5468" text-anchor="start">_MARKETPLACE_PUBKEY_HEX · MARKETPLACE_PUBKEY</text><text x="400" y="262" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#c92a2a" text-anchor="middle">≠</text><text x="400" y="488" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#4a5468" text-anchor="middle">Perdre l'une ne compromet pas l'autre. Clé vide dans le code = authenticité non prouvée (avertissement).</text></svg>
