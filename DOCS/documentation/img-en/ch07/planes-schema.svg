<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 322" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="322" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >An XY cut: a whole layer of bricks, or a single plane</text><rect x="30" y="60" width="350" height="240" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="205" y="88" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle" >Without planes/: through the bricks</text><rect x="150" y="110" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="144" y="114" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="138" y="118" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="132" y="122" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="126" y="126" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="120" y="130" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="114" y="134" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="108" y="138" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="102" y="142" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="96" y="146" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="90" y="150" width="120" height="80" rx="2" fill="#ffe8cc" stroke="#e67700" stroke-width="1.1" /><rect x="90" y="150" width="120" height="80" rx="2" fill="#ffd8a8" stroke="#e67700" stroke-width="1.6" /><text x="225" y="245" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >the wanted cut is in here…</text><text x="205" y="268" font-size="12.5" font-weight="700" fill="#e67700" text-anchor="middle" >…but all 64 planes of the layer must be read</text><text x="205" y="288" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >(≈ 190 MB on a large embryo)</text><rect x="420" y="60" width="350" height="240" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="595" y="88" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >With planes/: one plane at a time</text><rect x="540" y="110" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="534" y="114" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="528" y="118" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="522" y="122" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="516" y="126" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="510" y="130" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="504" y="134" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="498" y="138" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="492" y="142" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="486" y="146" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="480" y="150" width="120" height="80" rx="2" fill="#f8f9fd" stroke="#c5cbd8" stroke-width="0.8" /><rect x="510" y="130" width="120" height="80" rx="2" fill="#b2f2bb" stroke="#2b8a3e" stroke-width="2.2" /><text x="595" y="268" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" >only the tiles of that plane are 