<path d="M584,90 L584,68 Q584,56 596,56 L772,56 Q784,56 784,68 L784,90 Z" fill="#eef0f5"/>
<text x="684.0" y="78" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#4a5468" text-anchor="middle">Les règles</text>
<text x="596" y="100" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start">Section</text>
<text x="596" y="118" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start"></text>
<text x="596" y="98" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start">Section</text>
<text x="596" y="116" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">une bande de la page,</text>
<text x="596" y="132" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">avec ses marges et</text>
<text x="596" y="148" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">son fond</text>
