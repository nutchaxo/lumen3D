<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="384" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Reading the depth under the cursor: two one-pixel passes</text><rect x="20" y="56" width="370" height="116" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Pass 0: x and y</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The shader renders ONE pixel (the camera window</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >recentred on your click) and writes into its 4 RGBA bytes: x</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >on 16 bits (high byte, low byte), y on 16 bits.</text><rect x="410" y="56" width="370" height="116" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="424" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Pass 1: z and the flag</text><text x="424" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Same ray: z on 16 bits in R and G, 255 in B and A. An alpha</text><text x="424" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >of 0 means “nothing found”: the click is refused (no</text><text x="424" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >structure under the cursor).</text><rect x="20" y="190" width="760" height="176" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="214" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Why two bytes: a single byte gives only 256 positions</text><text x="36" y="238" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A position q ∈ [0; 1] becomes the integer N = round(q × 65,535), written as high byte = ⌊N / 256⌋ and low byte = N − 256 ×</text><text x="36" y="254.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >high byte. Example: q = 0.7 → N = 45,875 = 179 × 256 + 51. The precision is therefore 1/65,535 of the box, i.e. 0.01 µm on a 600</text><text x="36" y="271.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >µm box.</text><text x="36" y="300" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Along the ray: one sample every ½ voxel, at most 4,096 steps. Step 1: the maximum m of the displayed values. Step 2: the first</text><text x="36" y="316.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >point where the value reaches max(0.02; 0.55 × m), interpolated between the two neighbouring samples. Same window,</text><text x="36" y="333.12" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >channels, clipping, Z-stack slab and stabilisation as the screen.</text></svg>