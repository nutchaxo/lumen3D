<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 466" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="466" rx="16" fill="#f8f9fd"/>
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Updating the platform: a switch-over with a safety net</text>
<rect x="24" y="54" width="166" height="74" rx="12" fill="#f1f3f7" stroke="#4a5468" stroke-width="1.6"/>
<text x="107.0" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a5468">1 Backup</text>
<text x="107.0" y="95" text-anchor="middle" font-size="11.5" fill="#1c2333">check zip</text>
<line x1="192" y1="91" x2="214" y2="91" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="216" y="54" width="166" height="74" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="299.0" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">2 Download</text>
<text x="299.0" y="95" text-anchor="middle" font-size="11.5" fill="#1c2333">checksum + signature</text>
<line x1="384" y1="91" x2="406" y2="91" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="408" y="54" width="166" height="74" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="491.0" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7048e8">3 Preparation</text>
<text x="491.0" y="95" text-anchor="middle" font-size="11.5" fill="#1c2333">copy alongside (staging)</text>
<line x1="576" y1="91" x2="598" y2="91" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="600" y="54" width="166" height="74" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="683.0" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0c8599">4 Self-test</text>
<text x="683.0" y="95" text-anchor="middle" font-size="11.5" fill="#1c2333">dry-run start</text>
<line x1="400" y1="130" x2="400" y2="160" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="24" y="162" width="340" height="112" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="194.0" y="192" text-anchor="middle" font-size="24">🔁</text>
<text x="194.0" y="216" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e67700">5 Switch-over</text>
<text x="194.0" y="235" text-anchor="middle" font-size="11.5" fill="#1c2333">clean stop, files swapped</text>
<text x="194.0" y="251" text-anchor="middle" font-size="11.5" fill="#1c2333">one by one (journalled), restart</text>
<line x1="366" y1="218" x2="430" y2="218" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="432" y="162" width="344" height="112" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="604.0" y="192" text-anchor="middle" font-size="24">🩺</text>
<text x="604.0" y="216" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">6 Health check (~30 s)</text>
<text x="604.0" y="235" text-anchor="middle" font-size="11.5" fill="#1c2333">the /api/health page must announce</text>
<text x="604.0" y="251" text-anchor="middle" font-size="11.5" fill="#1c2333">the expected version</text>
<line x1="500" y1="276" x2="350" y2="318" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="708" y1="276" x2="708" y2="318" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="24" y="320" width="380" height="100" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="214.0" y="350" text-anchor="middle" font-size="24">↩️</text>
<text x="214.0" y="374" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c92a2a">FAILURE → automatic rollback</text>
<text x="214.0" y="393" text-anchor="middle" font-size="11.5" fill="#1c2333">the old version is restored</text>
<text x="214.0" y="409" text-anchor="middle" font-size="11.5" fill="#1c2333">and restarted; the admin shows it</text>
<rect x="430" y="320" width="346" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="603.0" y="350" text-anchor="middle" font-size="24">✅</text>
<text x="603.0" y="374" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2b8a3e">SUCCESS → done</text>
<text x="603.0" y="393" text-anchor="middle" font-size="11.5" fill="#1c2333">journal and temporary copy deleted;</text>
<text x="603.0" y="409" text-anchor="middle" font-size="11.5" fill="#1c2333">your data is never touched</text>
<text x="400" y="446" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5468">Protected during the update: DATA_WEB, config/, uploads/, credentials, statistics, installed plugins.</text>
</svg>
