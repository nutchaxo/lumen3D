<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="512" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Les paliers : ouvrable en secondes, complet en heures</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Haut : les vrais octets du jeu de démonstration. Bas : le même partage appliqué à 10 Go de briques, à 5 Mo/s.</text><text x="24" y="84" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start" >palier</text><text x="250" y="84" font-size="11" font-weight="700" fill="#4a5468" text-anchor="start" >ce qu'il contient</text><text x="640" y="84" font-size="11" font-weight="700" fill="#4a5468" text-anchor="end" >fichiers</text><text x="770" y="84" font-size="11" font-weight="700" fill="#4a5468" text-anchor="end" >octets</text><rect x="24" y="91" width="752" height="22" rx="4" fill="#e8edff" stroke="none" stroke-width="0" /><circle cx="36" cy="102" r="5.5" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="48" y="106" font-size="11.8" font-weight="700" fill="#3b5bdb" text-anchor="start" >0 · cœur</text><text x="250" y="106" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.json, manifeste, index.bin, vignette</text><text x="640" y="106" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="end" >4</text><text x="770" y="106" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="end" >47,0 ko</text><rect x="24" y="115" width="752" height="22" rx="4" fill="#e3fafc" stroke="none" stroke-width="0" /><circle cx="36" cy="126" r="5.5" fill="#0c8599" stroke="none" stroke-width="1"/><text x="48" y="130" font-size="11.8" font-weight="700" fill="#0c8599" text-anchor="start" >1 · aperçu</text><text x="250" y="130" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >le niveau le plus grossier, tous canaux</text><text x="640" y="130" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="end" >3</text><text x="770" y="130" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="end" >31,9 ko</text><rect x="24" y="139" width="752" height="22" rx="4" fill="#ebfbee" stroke="none" stroke-width="0" /><circle cx="36" cy="150" r="5.5" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="48" y="154" font-size="11.8" font-weight="700" fill="#2b8a3e" text-anchor="start" >2 · niveaux intermédiaires</text><text x="250" y="154" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >les niveaux entre les deux, du plus grossier au plus fin</text><text x="640" y="154" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="end" >6</text><text x="770" y="154" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="end" >1,3 Mo</text><rect x="24" y="163" width="752" height="22" rx="4" fill="#fff4e6" stroke="none" stroke-width="0" /><circle cx="36" cy="174" r="5.5" fill="#e67700" stroke="none" stroke-width="1"/><text x="48" y="178" font-size="11.8" font-weight="700" fill="#e67700" text-anchor="start" >3 · niveau natif</text><text x="250" y="178" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >niveau 0 ; images 1, 2, 3… d'une série</text><text x="640" y="178" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="end" >6</text><text x="770" y="178" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="end" >7,9 Mo</text><rect x="24" y="187" width="752" height="22" rx="4" fill="#eef0f5" stroke="none" stroke-width="0" /><circle cx="36" cy="198" r="5.5" fill="#4a5468" stroke="none" stroke-width="1"/><text x="48" y="202" font-size="11.8" font-weight="700" fill="#4a5468" text-anchor="start" >4 · planes, mips, originaux</text><text x="250" y="202" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >planes/, mips/, download/ (hors les originaux : 530 Mo)</text><text x="640" y="202" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="end" >117</text><text x="770" y="202" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="end" >9,1 Mo</text><text x="24" y="258" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Scénario : 10 Go de briques (mêmes proportions) à 5 Mo/s</text><rect x="24" y="276" width="3.2169730060659036" height="40" rx="3" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="0" /><rect x="27.216973006065903" y="276" width="3" height="40" rx="3" fill="#0c8599" stroke="#0c8599" stroke-width="0" /><rect x="30.216973006065903" y="276" width="90.76798325648288" height="40" rx="3" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="0" /><text x="75.60096463430735" y="301" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >2</text><rect x="120.98495626254878" y="276" width="541.1210717394493" height="40" rx="3" fill="#e67700" stroke="#e67700" stroke-width="0" /><text x="391.54549213227347" y="301" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >3</text><rect x="662.1060280019981" y="276" width="113.89397199800192" height="40" rx="3" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2" stroke-dasharray="5 4"/><text x="719.053014000999" y="301" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" >palier 4 : ensuite</text><line x1="29.399080597288226" y1="322" x2="29.399080597288226" y2="346" stroke="#0c8599" stroke-width="2.2"/><text x="35.399080597288226" y="362" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" >≈ 17 s : ouvrable et éditable</text><line x1="120.1670638537711" y1="322" x2="120.1670638537711" y2="380" stroke="#2b8a3e" stroke-width="2.2"/><text x="126.1670638537711" y="396" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="start" >≈ 5 min : toutes les qualités sauf la native</text><line x1="661.2881355932204" y1="322" x2="661.2881355932204" y2="414" stroke="#e67700" stroke-width="2.2"/><text x="655.2881355932204" y="430" font-size="12" font-weight="700" fill="#e67700" text-anchor="end" >≈ 33 min : briques complètes</text><rect x="24" y="450" width="752" height="46" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="400" y="470" font-size="11.8" font-weight="600" fill="#1c2333" text-anchor="middle" >Dès le palier 1, le jeu est ouvrable en basse résolution ; une fois édité, metadata.json est verrouillé :</text><text x="400" y="487" font-size="11.8" font-weight="600" fill="#1c2333" text-anchor="middle" >la suite du transfert ne remplace pas vos réglages.</text></svg>