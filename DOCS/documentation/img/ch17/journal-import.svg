<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="512" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Le journal d'import : trois fichiers, un format commun</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >uploads/state/&lt;type&gt;__&lt;dossier&gt;.json / .files / .log — lus et écrits par Python comme par PHP.</text><rect x="24" y="70" width="752" height="138" rx="12" fill="#fff" stroke="#3b5bdb" stroke-width="1.6" /><text x="40" y="92" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >.json  — l'état de chaque fichier (réécrit rarement)</text><text x="40" y="118" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >"bricks/l0/c1/p00001.bin": { "size": 329046, "chunkSize": 262144,</text><text x="40" y="137" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >   "kind": "pack", "tier": 3, "id": 4, "done": true,</text><text x="40" y="156" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >   "bits": "Aw==", "sha": "0c7c826a73d9…" }</text><text x="40" y="184" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >bits = une case par bloc, en base 64 : « Aw== » = 0x03 = blocs 0 et 1 reçus. id : jamais réutilisé.</text><rect x="24" y="222" width="752" height="100" rx="12" fill="#fff" stroke="#7048e8" stroke-width="1.6" /><text x="40" y="244" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >.files  — la table des fichiers prévus : 16 octets d'en-tête puis 32 octets par fichier</text><text x="40" y="268" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="start" >enregistrement n° 4 :</text><rect x="160" y="255" width="175.29999999999998" height="20" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="166" y="270" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >56 05 05 00 00 00 00 00</text><text x="247.64999999999998" y="292" font-size="9.8" font-weight="600" fill="#3b5bdb" text-anchor="middle" >taille u64 = 329046</text><rect x="343.29999999999995" y="255" width="90.1" height="20" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="349.29999999999995" y="270" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >00 00 04 00</text><text x="388.34999999999997" y="292" font-size="9.8" font-weight="600" fill="#7048e8" text-anchor="middle" >bloc u32 = 262144</text><rect x="441.4" y="255" width="90.1" height="20" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="447.4" y="270" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >01 00 00 00</text><text x="486.45" y="292" font-size="9.8" font-weight="600" fill="#e67700" text-anchor="middle" >flags = 1 (vivant)</text><rect x="539.5" y="255" width="189.5" height="20" rx="4" fill="#e3fafc" stroke="#0c8599" stroke-width="1.2" /><text x="545.5" y="270" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >a2 19 10 cd 8c 64 ff 36 …</text><text x="634.25" y="292" font-size="9.8" font-weight="600" fill="#0c8599" text-anchor="middle" >16 octets : empreinte du chemin</text><text x="40" y="314" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start" >elle prouve qu'un numéro de fichier désigne bien le chemin envoyé, sans relire le journal</text><rect x="24" y="336" width="752" height="138" rx="12" fill="#fff" stroke="#2b8a3e" stroke-width="1.6" /><text x="40" y="358" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >.log  — le journal des blocs reçus : on AJOUTE 16 octets par bloc, on ne réécrit rien</text><text x="40" y="382" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="start" >bloc 0 de ce fichier :</text><rect x="210" y="369" width="90.1" height="20" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="216" y="384" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >04 00 00 00</text><text x="255.05" y="399" font-size="9.8" font-weight="600" fill="#3b5bdb" text-anchor="middle" >id u32 = 4</text><rect x="308.1" y="369" width="90.1" height="20" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="314.1" y="384" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >00 00 00 00</text><text x="353.15000000000003" y="399" font-size="9.8" font-weight="600" fill="#7048e8" text-anchor="middle" >bloc u32 = 0</text><rect x="406.20000000000005" y="369" width="139.8" height="20" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="412.20000000000005" y="384" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >4c 55 43 31 = LUC1</text><text x="476.1" y="399" font-size="9.8" font-weight="600" fill="#e67700" text-anchor="middle" >signature</text><rect x="554.0" y="369" width="90.1" height="20" rx="4" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2" /><text x="560.0" y="384" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >32 ea ec 49</text><text x="599.05" y="399" font-size="9.8" font-weight="600" fill="#c92a2a" text-anchor="middle" >crc32</text><text x="40" y="422" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="start" >bloc 1 de ce fichier :</text><rect x="210" y="409" width="90.1" height="20" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2" /><text x="216" y="424" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >04 00 00 00</text><text x="255.05" y="439" font-size="9.8" font-weight="600" fill="#3b5bdb" text-anchor="middle" >id u32 = 4</text><rect x="308.1" y="409" width="90.1" height="20" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2" /><text x="314.1" y="424" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >01 00 00 00</text><text x="353.15000000000003" y="439" font-size="9.8" font-weight="600" fill="#7048e8" text-anchor="middle" >bloc u32 = 1</text><rect x="406.20000000000005" y="409" width="139.8" height="20" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.2" /><text x="412.20000000000005" y="424" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >4c 55 43 31 = LUC1</text><text x="476.1" y="439" font-size="9.8" font-weight="600" fill="#e67700" text-anchor="middle" >signature</text><rect x="554.0" y="409" width="90.1" height="20" rx="4" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2" /><text x="560.0" y="424" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >ac ea 46 85</text><text x="599.05" y="439" font-size="9.8" font-weight="600" fill="#c92a2a" text-anchor="middle" >crc32</text><text x="40" y="466" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start" >un enregistrement n'est ajouté qu'APRÈS le fsync des octets ; queue tronquée ou CRC faux : ignoré (coûte un renvoi).</text><text x="400" y="494" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="middle" >Ajouter 16 octets coûte un millième de réécrire un journal de 20 000 fichiers : les 4 blocs parallèles ne s'attendent plus.</text></svg>