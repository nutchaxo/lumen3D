<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Pourquoi le thème clair ne clignote pas</text>
<text x="24" y="62" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start">Chaque page est livrée avec data-theme="dark". Un visiteur qui a choisi « clair » doit le recevoir AVANT le premier affichage :</text>
<rect x="16" y="84" width="186" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M16,118 L16,96 Q16,84 28,84 L190,84 Q202,84 202,96 L202,118 Z" fill="#eef0f5"/>
<text x="109.0" y="106" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4a5468" text-anchor="middle">1. Le &lt;head&gt; se lit</text>
<text x="28" y="140.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">feuilles de style</text>
<text x="28" y="156.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">(thème sombre par défaut)</text>
<rect x="210" y="84" width="186" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M210,118 L210,96 Q210,84 222,84 L384,84 Q396,84 396,96 L396,118 Z" fill="#ebfbee"/>
<text x="303.0" y="106" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle">2. theme-boot.js</text>
<text x="222" y="140.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">lit localStorage ;</text>
<text x="222" y="156.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">si « light » → data-theme</text>
<text x="222" y="172.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">passe à light</text>
<rect x="404" y="84" width="186" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M404,118 L404,96 Q404,84 416,84 L578,84 Q590,84 590,96 L590,118 Z" fill="#e8edff"/>
<text x="497.0" y="106" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle">3. Premier affichage</text>
<text x="416" y="140.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">la page apparaît déjà</text>
<text x="416" y="156.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">dans le bon thème</text>
<rect x="598" y="84" width="186" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M598,118 L598,96 Q598,84 610,84 L772,84 Q784,84 784,96 L784,118 Z" fill="#f3f0ff"/>
<text x="691.0" y="106" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7048e8" text-anchor="middle">4. Fin du &lt;body&gt; : theme.js</text>
<text x="610" y="140.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">branche le bouton,</text>
<text x="610" y="156.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">suit les autres onglets</text>
<line x1="206" y1="160" x2="212" y2="160" stroke="#4a5468" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="400" y1="160" x2="406" y2="160" stroke="#4a5468" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="594" y1="160" x2="600" y2="160" stroke="#4a5468" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="16" y="252" width="768" height="130" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="32" y="276" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• Sans theme-boot.js : un visiteur « clair » verrait d'abord une page sombre, puis un éclair blanc.</text>
<text x="32" y="300" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• Premier passage, sans choix mémorisé : le thème sombre (fort contraste pour la fluorescence).</text>
<text x="32" y="324" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• Le panneau d'administration a son propre réglage (clé adm-theme), indépendant du site public.</text>
<text x="32" y="348" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• Si le navigateur bloque le stockage : la page garde son thème par défaut, sans erreur.</text>
</svg>
