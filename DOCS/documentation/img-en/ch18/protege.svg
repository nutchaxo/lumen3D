<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">What an update touches, and what it never touches</text><rect x="24" y="54" width="360" height="440" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="40" y="82" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="start">Never touched</text><text x="40" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">DATA_WEB/</text><text x="40" y="116" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">your datasets</text><text x="40" y="138" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">uploads/</text><text x="40" y="154" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">imports in progress</text><text x="40" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">logs/  backups/  secrets/</text><text x="40" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">logs, copies, seeds</text><text x="40" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/admin_credential.json</text><text x="40" y="230" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">your password (hash)</text><text x="40" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/stats.json</text><text x="40" y="268" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">the usage counters</text><text x="40" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/plugin-trust.json …</text><text x="40" y="306" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">approvals, disabled plugins</text><text x="40" y="328" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/marketplace-state.json</text><text x="40" y="344" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">anti-rollback serial</text><text x="40" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">config/instance.json  theme  legal  pages/</text><text x="40" y="382" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">your customisation</text><text x="40" y="404" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/page-drafts/</text><text x="40" y="420" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">unpublished drafts</text><text x="40" y="442" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">install.php</text><text x="40" y="458" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">the installer stays locked</text><rect x="400" y="54" width="376" height="440" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="416" y="82" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start">Replaced by the new version</text><text x="416" y="100" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">HTML pages</text><text x="416" y="116" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">index, viewer, compare, 2d, admpan …</text><text x="416" y="138" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">js/ css/ lang/</text><text x="416" y="154" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">code, styles, translations</text><text x="416" y="176" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">api/*.php</text><text x="416" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">the server&#x27;s PHP code</text><text x="416" y="214" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">dev_server.py …</text><text x="416" y="230" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">Python server and engines</text><text x="416" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">changelog/</text><text x="416" y="268" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">release notes (the version = the newest)</text><text x="416" y="290" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">.htaccess</text><text x="416" y="306" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">LUMEN3D block rewritten, your lines kept</text><text x="416" y="328" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#1c2333" text-anchor="start">config/defaults/</text><text x="416" y="344" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">neutral templates</text><text x="416" y="378" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">An installed plugin&#x27;s code (js/modules/) is not</text><text x="416" y="396" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">in the release: it is therefore never overwritten.</text></svg>