<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="500" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Aligner deux séries de longueurs différentes : la fraction, pas le numéro</text><text x="24" y="78" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Série A : 100 images</text><text x="24" y="150" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >Série B : 10 images</text><rect x="200" y="62" width="560" height="22" rx="6" fill="#fff" stroke="#3b5bdb" stroke-width="1.4" /><rect x="200" y="134" width="560" height="22" rx="6" fill="#fff" stroke="#2b8a3e" stroke-width="1.4" /><line x1="200" y1="134" x2="200" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="200" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >0</text><line x1="262.222" y1="134" x2="262.222" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="262.222" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >1</text><line x1="324.444" y1="134" x2="324.444" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="324.444" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >2</text><line x1="386.667" y1="134" x2="386.667" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="386.667" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >3</text><line x1="448.889" y1="134" x2="448.889" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="448.889" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >4</text><line x1="511.111" y1="134" x2="511.111" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="511.111" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >5</text><line x1="573.333" y1="134" x2="573.333" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="573.333" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >6</text><line x1="635.556" y1="134" x2="635.556" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="635.556" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >7</text><line x1="697.778" y1="134" x2="697.778" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="697.778" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >8</text><line x1="760" y1="134" x2="760" y2="162" stroke="#2b8a3e" stroke-width="1.2" /><text x="760" y="176" font-size="10.5" font-weight="600" fill="#2b8a3e" text-anchor="middle" >9</text><line x1="482.828" y1="56" x2="482.828" y2="140" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 3" /><circle cx="482.828" cy="73" r="6" fill="#c92a2a" stroke="#fff" stroke-width="1.4" /><text x="492.828" y="52" font-size="12" font-weight="800" fill="#c92a2a" text-anchor="start" >A choisit l'image 50 → fraction 50/99 = 0,505</text><circle cx="511.111" cy="145" r="6" fill="#c92a2a" stroke="#fff" stroke-width="1.4" /><text x="511.111" y="200" font-size="12" font-weight="800" fill="#c92a2a" text-anchor="middle" >B tombe sur round(0,505 × 9) = image 5</text><text x="24" y="232" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Le piège : l'écho</text><rect x="24" y="244" width="360" height="134" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="38" y="268.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Sans protection</text><text x="38" y="289.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Si B signalait l'image 5 qu'on vient de lui demander, l'hôte</text><text x="38" y="305.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >la relaierait à A : 5 → fraction 5/9 = 0,556 → A sauterait à</text><text x="38" y="322.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'image 55, le signalerait à son tour : 50 → 5 → 55 …</text><rect x="416" y="244" width="360" height="134" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="430" y="268.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Avec CompareTimeSync</text><text x="430" y="289.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Les pages actuelles ne signalent pas une image chargée</text><text x="430" y="305.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sur ordre ; l'hôte double la garde : il note « j'ai demandé</text><text x="430" y="322.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'image 5 à B » (6 s, 16 ordres au plus) et ne relaie pas la</text><text x="430" y="339.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >réponse. Un geste de l'opérateur sur B, lui, est relayé.</text><rect x="24" y="392" width="752" height="92" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="416" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start" >La règle (viewer.js et compare-policy.js, identique des deux côtés) :</text><text x="40" y="440" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">si les longueurs diffèrent :  image = round( fraction × (N − 1) )   sinon : le même numéro</text><text x="40" y="464" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >fraction = image / (N − 1), envoyée avec le numéro et la longueur totale de la série qui parle.</text></svg>