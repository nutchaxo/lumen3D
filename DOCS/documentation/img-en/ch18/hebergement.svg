<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="440" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Which hosting to choose?</text><rect x="250" y="54" width="300" height="44" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="400" y="80.9" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="middle">What does your host offer?</text><path d="M400,98 V116 H140 V132" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="134" width="232" height="250" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,168 V146 a12,12 0 0 1 12,-12 H244 a12,12 0 0 1 12,12 V168 Z" fill="#e8edff"/><text x="140" y="158" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle">Python 3.10 or newer</text><text x="140" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">lab PC, VM, dedicated server</text><rect x="38" y="206" width="204" height="30" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="140" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#3b5bdb" text-anchor="middle">python dev_server.py</text><text x="40" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start">•</text><text x="54" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">everything included</text><text x="40" y="304" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-