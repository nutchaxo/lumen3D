<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Pourquoi le chemin « plan » : la mémoire vidéo d'une seule coupe</text><text x="24" y="70" font-size="13" font-weight="700" fill="#4a5468" text-anchor="start" >Coupe XY native d'un jeu de 5735 × 5735 voxels, 4 canaux (valeurs du code, barres à la même échelle)</text><rect x="24" y="92" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="118" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Chemin plan</text><rect x="220" y="104" width="10" height="22" rx="2" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="240" y="121" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="start" >≈ 132 Mo : une texture de 5735 × 5735 × 4 octets</text><text x="40" y="148" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >lit les plans de voxels de la coupe</text><rect x="24" y="174" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="200" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Chemin atlas</text><rect x="220" y="186" width="520" height="22" rx="4" fill="#e67700" stroke="#e67700" stroke-width="1" /><text x="228" y="202" font-size="12.5" font-weight="700" fill="#fff" text-anchor="start" >de 1 à 7 Gio : un emplacement de 66³ voxels par brique traversée</text><text x="40" y="230" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >une coupe traverse toute une couche de briques</text><rect x="24" y="262" width="752" height="100" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="286" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Dans une brique de 64 plans, la coupe n'en lit qu'un : les 63 autres voxels de profondeur sont du gaspillage de mémoire et de</text><text x="40" y="302.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >réseau. Le chemin plan ne garde que le plan utile (ou, pour une tranche projetée, son maximum par colonne, calculé dans un</text><text x="40" y="319.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >worker). Si le plan est oblique, ou si la série est stabilisée, ce raccourci n'existe pas : l'atlas prend le relais.</text></svg>