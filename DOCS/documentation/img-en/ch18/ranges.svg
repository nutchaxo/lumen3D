<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="470" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Asking for just a slice of a file: byte ranges</text><text x="24" y="72" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">A 1,383,748-byte pack on the server&#x27;s disk</text><rect x="24" y="84" width="752" height="34" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="84" width="40" height="34" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><rect x="300" y="84" width="40" height="34" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="44" y="106" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle">A</text><text x="320" y="106" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle">B</text><text x="24" y="136" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="start">0</text><text x="776" y="136" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="end">end</text><rect x="24" y="156" width="752" height="68" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="156" width="6" height="68" rx="3" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1.2"/><text x="44" y="182" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Range: bytes=0-99</text><text x="44" y="206" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">one range</text><rect x="420" y="166" width="200" height="26" rx="13.0" fill="#e8edff" stroke="#3b5bdb" stroke-width="1"/><text x="520" y="183.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle">206 + Content-Range</text><text x="420" y="212" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">only A&#x27;s bytes, nothing else</text><rect x="24" y="232" width="752" height="68" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="232" width="6" height="68" rx="3" fill="#0c8599" stroke="#0c8599" stroke-width="1.2"/><text x="44" y="258" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Range: bytes=0-99, 500-599</text><text x="44" y="282" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">two ranges</text><rect x="420" y="242" width="200" height="26" rx="13.0" fill="#e3fafc" stroke="#0c8599" stroke-width="1"/><text x="520" y="259.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0c8599" text-anchor="middle">206 multipart/byteranges</text><text x="420" y="288" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">A and B in one answer (one round trip)</text><rect x="24" y="308" width="752" height="68" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="308" width="6" height="68" rx="3" fill="#c92a2a" stroke="#c92a2a" stroke-width="1.2"/><text x="44" y="334" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Range: bytes=99999999-</text><text x="44" y="358" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">outside the file</text><rect x="420" y="318" width="200" height="26" rx="13.0" fill="#fff0f0" stroke="#c92a2a" stroke-width="1"/><text x="520" y="335.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#c92a2a" text-anchor="middle">416 bytes */1383748</text><text x="420" y="364" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">“unsatisfiable”: no byte</text><rect x="24" y="384" width="752" height="68" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="384" width="6" height="68" rx="3" fill="#4a5468" stroke="#4a5468" stroke-width="1.2"/><text x="44" y="410" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">malformed range, or more than 64</text><text x="44" y="434" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">edge case</text><rect x="420" y="394" width="200" height="26" rx="13.0" fill="#eef0f5" stroke="#4a5468" stroke-width="1"/><text x="520" y="411.025" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle">200</text><text x="420" y="440" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">the whole file: always allowed by the standard</text></svg>