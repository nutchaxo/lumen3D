<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="458" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The four data formats</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Each step adds a structure beside the bricks; a migration knows how to climb to it.</text><rect x="24" y="215" width="178" height="139" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.8" /><circle cx="48" cy="241" r="15" fill="#4a5468" stroke="none" stroke-width="1"/><text x="48" y="247" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="72" y="247" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start" >v2 bricks</text><text x="38" y="277" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >64³, no border</text><text x="38" y="295" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >JSON manifest</text><text x="38" y="313" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >before 1.58.0</text><rect x="34" y="322" width="158" height="22" rx="11" fill="#fff" stroke="#4a5468" stroke-width="1.3" /><text x="113.0" y="337" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >(starting point)</text><rect x="215" y="177" width="178" height="177" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><circle cx="239" cy="203" r="15" fill="#e67700" stroke="none" stroke-width="1"/><text x="239" y="209" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="263" y="209" font-size="15" font-weight="800" fill="#e67700" text-anchor="start" >planes/</text><text x="229" y="239" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >one file per Z plane</text><text x="229" y="257" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >lossless 512² PNG</text><text x="229" y="275" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >fast XY cuts</text><rect x="225" y="322" width="158" height="22" rx="11" fill="#fff" stroke="#e67700" stroke-width="1.3" /><text x="304.0" y="337" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m002-planes</text><line x1="202" y1="237" x2="215" y2="237" stroke="#e67700" stroke-width="2.4" marker-end="url(#arr)"/><rect x="406" y="139" width="178" height="215" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.8" /><circle cx="430" cy="165" r="15" fill="#0c8599" stroke="none" stroke-width="1"/><text x="430" y="171" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="454" y="171" font-size="15" font-weight="800" fill="#0c8599" text-anchor="start" >mips/</text><text x="420" y="201" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >MIP per 64-plane layer</text><text x="420" y="219" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >same mould as planes/</text><text x="420" y="237" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >fast z-stack</text><rect x="416" y="322" width="158" height="22" rx="11" fill="#fff" stroke="#0c8599" stroke-width="1.3" /><text x="495.0" y="337" font-size="11.5" font-weight="700" fill="#0c8599" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m003-layer-mips</text><line x1="393" y1="199" x2="406" y2="199" stroke="#0c8599" stroke-width="2.4" marker-end="url(#arr)"/><rect x="597" y="101" width="178" height="253" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><circle cx="621" cy="127" r="15" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="621" y="133" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="645" y="133" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start" >v3 bricks</text><text x="611" y="163" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >bricks/ rebuilt (66³)</text><text x="611" y="181" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >border, Z reduced</text><text x="611" y="199" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >index.bin, local detail</text><rect x="607" y="322" width="158" height="22" rx="11" fill="#fff" stroke="#2b8a3e" stroke-width="1.3" /><text x="686.0" y="337" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m004-bricks-v3</text><line x1="584" y1="161" x2="597" y2="161" stroke="#2b8a3e" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="372" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="396" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Three facts to remember</text><text x="40" y="416" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• the viewer reads formats 1 to 4; steps 2 to 4 only make things faster and nicer;</text><text x="40" y="434" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• pipeline 0.21.0 writes format 4 directly: a freshly processed dataset has nothing to migrate.</text></svg>