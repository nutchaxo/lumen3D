<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="372" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Coucher le volume : deux rotations autour des axes de l'écran</text><rect x="20" y="56" width="250" height="128" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① Où regarde la pile ?</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d = la direction du fichier que la vue «</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >de dessus » doit regarder, telle que le</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >volume la tient maintenant : ici d =</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(0,20 ; 0,60 ; 0,775).</text><line x1="274" y1="120" x2="300" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="304" y="56" width="250" height="128" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="318" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >② Quel axe tourne d'abord ?</text><text x="318" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Celui sur lequel d penche le plus :</text><text x="318" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >asin|dy| = 36,9° &gt; asin|dx| = 11,5° + 5°</text><text x="318" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >→ d'abord l'axe horizontal X, avec une</text><text x="318" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >avance de 5° au vertical en cas</text><text x="318" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d'égalité.</text><line x1="558" y1="120" x2="584" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="588" y="56" width="192" height="128" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="602" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ Les deux angles</text><text x="602" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >α = atan2(dy ; dz) = 37,8°</text><text x="602" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >autour de X ; puis β =</text><text x="602" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >atan2(−dx ; √(dy²+dz²)) =</text><text x="602" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >−11,5° autour de Y.</text><rect x="20" y="204" width="760" height="150" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="230" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Pourquoi pas la rotation « la plus courte » ?</text><circle cx="42" cy="252" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="256" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >La plus courte tourne autour d'un axe oblique : à l'écran, la pile « culbute » en diagonale. Deux rotations autour des axes de</text><text x="54" y="272.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'écran se lisent comme un seul geste, avec une petite correction.</text><circle cx="42" cy="284.16" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="288.16" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Aucune rotation dans le plan n'est ajoutée : le Z-stack reprend l'angle où la pose a atterri (curseur Rotation).</text><circle cx="42" cy="299.76" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="303.76" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Une pile qui regarde déjà droit devant (dx et dy ≈ 0) se retourne d'un demi-tour autour de la verticale, jamais selon un bruit</text><text x="54" y="320.32" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >numérique. Animation : 1,5 s à l'ouverture, 1,2 s depuis la piste, 1 s depuis le sens de l'échantillon.</text></svg>