<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
<rect width="800" height="420" rx="16" fill="#f8f9fd"/>
<text x="400.0" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The levels of the demonstration dataset: format 4 and format 5</text>
<text x="200" y="70" font-size="15" font-weight="800" fill="#868e96" text-anchor="middle" >Format 4</text>
<text x="200" y="89" font-size="11.5" font-weight="500" fill="#4a5468" text-anchor="middle" >X, Y halved; Z too while the voxel stays ≈ cubic</text>
