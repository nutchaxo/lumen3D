<text x="200" y="136.0" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >768 × 576 × 112</text>
<text x="200" y="150.0" font-size="10" font-weight="500" fill="#4a5468" text-anchor="middle" >1.2 × 1.2 × 3.0 µm</text>
