<text x="190" y="290" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="middle" >one grey value</text>
<line x1="310" y1="180" x2="400" y2="180" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<text x="590" y="70" font-size="14" font-weight="700" fill="#1c2333" text-anchor="middle" >A voxel: a small 3D box</text>
<polygon points="480,150 550,150 550,220 480,220" fill="#e8edff" stroke="#3b5bdb" stroke-width="2"/>
<polygon points="480,150 530.0,100.0 600.0,100.0 550,150" fill="#d0dcff" stroke="#3b5bdb" stroke-width="2"/>
<polygon points="550,150 600.0,100.0 600.0,170.0 550,220" fill="#bccbff" stroke="#3b5bdb" stroke-width="2"/>
<text x="515.0" y="242" font-size="13" font-weight="700" fill="#3b5bdb" text-anchor="middle" >X: 1.2 µm</text>
<text x="470" y="190.0" font-size="13" font-weight="700" fill="#3b5bdb" text-anchor="end" >Y: 1.2 µm</text>
<text x="608.0" y="165.0" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="start" >Z: 3.0 µm</text>
<text x="590" y="285" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >Here the voxel is stretched: 1.2 × 1.2 × 3.0 µm</text>
<text x="590" y="304" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >(anisotropic: thicker in Z than in X and Y)</text>
