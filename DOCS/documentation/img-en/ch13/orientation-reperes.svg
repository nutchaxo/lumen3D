<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="340" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Three poses, two quaternion products</text><rect x="20" y="56" width="236" height="120" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Q_base · the frame</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.orientation: the cube pose</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >for which the anatomy's axes</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >coincide with the screen's (R→+X,</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A→+Y, V→+Z).</text><rect x="282" y="56" width="236" height="120" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="296" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Q_anat · the anatomy</text><text x="296" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The anatomy's pose on screen:</text><text x="296" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Q_anat = Q_cube · Q_base⁻¹. It</text><text x="296" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >orients the compass and is what a</text><text x="296" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >default view stores.</text><rect x="544" y="56" width="236" height="120" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="558" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Q_cube · the volume</text><text x="558" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The cube's actual pose: Q_cube =</text><text x="558" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Q_anat · Q_base. A default view is</text><text x="558" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >applied before the first brick.</text><rect x="20" y="196" width="760" height="128" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="220" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Six presets = two anatomical constraints</text><text x="52" y="246" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >ventral</text><text x="250" y="246" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >V → camera, A → up</text><text x="52" y="268" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >dorsal</text><text x="250" y="268" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >D → camera, A → up</text><text x="52" y="290" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >left · right</text><text x="250" y="290" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >L / R → camera, A → up</text><text x="52" y="312" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >anterior · posterior</text><text x="250" y="312" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="start" >A / P → camera, D → up</text><text x="420" y="246" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >The two constraints (which direction faces the camera,</text><text x="420" y="262.56" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >which points up) pin down a single rotation. The R/L, A/P,</text><text x="420" y="279.12" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >V/D keys are storage identifiers: you name them as you wish</text><text x="420" y="295.68" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >(“anterior”, “dorsal”).</text></svg>