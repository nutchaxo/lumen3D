<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="512" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The shared 1.5 GiB budget: an example in three steps</text><text x="400" y="56" font-size="12" font-weight="600" fill="#4a5468" text-anchor="middle" >Three volumes with different costs (example values, in MiB); fixed budget = 1,536 MiB; automatic ceiling = 1024</text><text x="20" y="120" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start" >① start: all at 1024</text><rect x="190" y="100" width="167.4" height="36" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="273.7" y="123" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >A · 620</text><rect x="357.4" y="100" width="243" height="36" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="478.9" y="123" font-size="12" font-weight="800" fill="#e67700" text-anchor="middle" >B · 900</text><rect x="600.4" y="100" width="89.1" height="36" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="644.95" y="123" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" >C · 330</text><text x="190" y="152" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="start" >1,850 &gt; 1,536: too much</text><text x="20" y="194" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start" >② lower the biggest</text><rect x="190" y="174" width="167.4" height="36" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="273.7" y="197" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >A · 620</text><rect x="357.4" y="174" width="64.8" height="36" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="389.8" y="197" font-size="12" font-weight="800" fill="#e67700" text-anchor="middle" >B · 240</text><rect x="422.2" y="174" width="89.1" height="36" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="466.75" y="197" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" >C · 330</text><text x="190" y="226" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="start" >B drops to 512: 1,190</text><text x="20" y="268" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="start" >③ try to raise</text><rect x="190" y="248" width="167.4" height="36" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="273.7" y="271" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" >A · 620</text><rect x="357.4" y="248" width="64.8" height="36" rx="4" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="389.8" y="271" font-size="12" font-weight="800" fill="#e67700" text-anchor="middle" >B · 240</text><rect x="422.2" y="248" width="89.1" height="36" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="466.75" y="271" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" >C · 330</text><text x="190" y="300" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="start" >B → 1024 would cost +660: refused</text><line x1="604.72" y1="84" x2="604.72" y2="308" stroke="#c92a2a" stroke-width="2" stroke-dasharray="6 4" /><text x="608.72" y="80" font-size="12" font-weight="800" fill="#c92a2a" text-anchor="middle" >1,536</text><rect x="20" y="322" width="760" height="172" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="346" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >The two loops of CompareQuality.plan()</text><circle cx="40" cy="366" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="52" y="370" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Start: each panel at the level it is on (512 at opening). A panel that has not yet priced its levels counts for 256 MiB.</text><circle cx="40" cy="386.6" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="52" y="390.6" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >While the total exceeds the budget: lower by one notch the panel that holds the most.</text><circle cx="40" cy="407.2" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="52" y="411.2" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Then, while some panel can go up one notch without exceeding: raise the lowest one (on a tie, the cheapest step), never</text><text x="52" y="427.76" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >above the ceiling.</text><circle cx="40" cy="444.36" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="52" y="448.36" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Automatic ceiling: 1024 (photographs have no quality). “Native” is only reached by hand.</text></svg>