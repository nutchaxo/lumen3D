<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Installing a catalogue plugin: ten checks, all or nothing</text><rect x="24" y="56" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="56" width="140" height="28" rx="12" fill="#e8edff" stroke="#c5cbd8" stroke-width="1.2"/><text x="94" y="76" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle">1</text><text x="94" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Admin password</text><text x="94" y="128" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">re-entered</text><line x1="165" y1="112" x2="175" y2="112" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="176" y="56" width="140" height="112" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="176" y="56" width="140" height="28" rx="12" fill="#e8edff" stroke="#c5cbd8" stroke-width="1.2"/><text x="246" y="76" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="middle">2</text><text x="246" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Catalogue read,</text><text x="246" y="128" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">Ed25519 signature</text><text x="246" y="144" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#1c2333" text-anchor="middle">verified</text><line x1=