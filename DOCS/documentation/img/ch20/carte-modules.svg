<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 436" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
<rect width="800" height="436" rx="16" fill="#f8f9fd"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Carte des modules : qui appelle qui ?</text>
<rect x="24" y="52" width="548" height="74" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="40" y="77" font-size="15" font-weight="800" fill="#7048e8">Pages</text>
<text x="102" y="77" font-size="12" fill="#4a5468" font-family="monospace">js/pages/</text>
<text x="40" y="98" font-size="12.5" fill="#1c2333">Le chef d'orchestre de chaque page</text>
<text x="40" y="116" font-size="11.5" fill="#4a5468">viewer · explorer · compare · 2d · landing · admpan (+ 27 modules d'admin)</text>
<rect x="24" y="138" width="548" height="74" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="40" y="163" font-size="15" font-weight="800" fill="#0c8599">Composants</text>
<text x="142" y="163" font-size="12" fill="#4a5468" font-family="monospace">js/components/</text>
<text x="40" y="184" font-size="12.5" fill="#1c2333">Les morceaux d'interface réutilisables</text>
<text x="40" y="202" font-size="11.5" fill="#4a5468">panneau des canaux · frise · Studio · galerie · décomposition</text>
<rect x="24" y="224" width="548" height="74" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="40" y="249" font-size="15" font-weight="800" fill="#3b5bdb">Viewers</text>
<text x="118" y="249" font-size="12" fill="#4a5468" font-family="monospace">js/viewers/</text>
<text x="40" y="270" font-size="12.5" fill="#1c2333">Ceux qui dessinent</text>
<text x="40" y="288" font-size="11.5" fill="#4a5468">volume-viewer · volume-slicer · volume-grid · tracking-overlay · 2d-viewer</text>
<rect x="24" y="310" width="548" height="74" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="40" y="335" font-size="15" font-weight="800" fill="#2b8a3e">Noyau</text>
<text x="102" y="335" font-size="12" fill="#4a5468" font-family="monospace">js/core/</text>
<text x="40" y="356" font-size="12.5" fill="#1c2333">Les services partagés par toutes les pages</text>
<text x="40" y="374" font-size="11.5" fill="#4a5468">brick-loader · svr-manager · catalog · i18n · plugin-registry · url-state · …</text>
<line x1="298" y1="126" x2="298" y2="138" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="298" y1="212" x2="298" y2="224" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="298" y1="298" x2="298" y2="310" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="596" y="52" width="180" height="214" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="686" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#e67700">Workers</text>
<text x="686" y="96" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">js/workers/</text>
<text x="686" y="118" text-anchor="middle" font-size="11.5" fill="#1c2333">Les calculs lourds, en arrière-plan</text>
<text x="686" y="146" text-anchor="middle" font-size="12.5" fill="#1c2333">• décodage des briques</text>
<text x="686" y="168" text-anchor="middle" font-size="12.5" fill="#1c2333">• envoi des fichiers</text>
<text x="686" y="190" text-anchor="middle" font-size="12.5" fill="#1c2333">• conversion des données</text>
<text x="686" y="212" text-anchor="middle" font-size="12.5" fill="#1c2333">• flou gaussien</text>
<text x="686" y="234" text-anchor="middle" font-size="12.5" fill="#1c2333">• plans, suivi, 2D</text>
<rect x="596" y="282" width="180" height="102" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="686" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#c92a2a">Plugins</text>
<text x="686" y="326" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">js/modules/</text>
<text x="686" y="350" text-anchor="middle" font-size="12.5" fill="#1c2333">installés depuis</text>
<text x="686" y="368" text-anchor="middle" font-size="12.5" fill="#1c2333">le catalogue signé</text>
<line x1="572" y1="347" x2="594" y2="347" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="572" y1="160" x2="594" y2="160" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="400" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#1c2333">Une flèche = « s'appuie sur ». Les pages ne dessinent rien elles-mêmes : elles confient le rendu aux viewers.</text>
</svg>
