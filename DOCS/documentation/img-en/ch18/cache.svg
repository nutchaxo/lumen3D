nged” without resending the bytes.</text><text x="400" y="488" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">Images, fonts: no-cache + ETag on the Python server; 7 days on Apache (.htaccess).</text></svg>