<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
<marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="332" rx="16" fill="#f8f9fd"/>
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">La politique de sécurité du contenu (CSP)</text>
<rect x="30" y="50" width="230" height="120" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="145.0" y="80" text-anchor="middle" font-size="24">🎟️</text>
<text x="145.0" y="104" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">Le serveur sert la page</text>
<text x="145.0" y="123" text-anchor="middle" font-size="11.5" fill="#1c2333">tire au sort un code à</text>
<text x="145.0" y="139" text-anchor="middle" font-size="11.5" fill="#1c2333">usage unique, le nonce,</text>
<text x="145.0" y="155" text-anchor="middle" font-size="11.5" fill="#1c2333">nouveau à chaque chargement</text>
<line x1="262" y1="110" x2="318" y2="110" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="320" y="50" width="200" height="120" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="420.0" y="80" text-anchor="middle" font-size="24">📋</text>
<text x="420.0" y="104" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7048e8">Liste d’invités</text>
<text x="420.0" y="123" text-anchor="middle" font-size="11.5" fill="#1c2333">le navigateur n’exécute que</text>
<text x="420.0" y="139" text-anchor="middle" font-size="11.5" fill="#1c2333">les scripts qui portent</text>
<text x="420.0" y="155" text-anchor="middle" font-size="11.5" fill="#1c2333">le bon code</text>
<line x1="522" y1="110" x2="578" y2="110" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="580" y="50" width="190" height="120" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="675.0" y="80" text-anchor="middle" font-size="24">✅</text>
<text x="675.0" y="104" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2b8a3e">Script du site</text>
<text x="675.0" y="123" text-anchor="middle" font-size="11.5" fill="#1c2333">code + bon nonce</text>
<text x="675.0" y="139" text-anchor="middle" font-size="11.5" fill="#1c2333">→ il entre</text>
<rect x="320" y="204" width="200" height="108" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="420.0" y="234" text-anchor="middle" font-size="24">🚫</text>
<text x="420.0" y="258" text-anchor="middle" font-size="13.5" font-weight="800" fill="#c92a2a">Script injecté</text>
<text x="420.0" y="277" text-anchor="middle" font-size="11.5" fill="#1c2333">pas de code valide</text>
<text x="420.0" y="293" text-anchor="middle" font-size="11.5" fill="#1c2333">→ refusé à la porte</text>
<line x1="420" y1="172" x2="420" y2="202" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrr)"/>
<rect x="30" y="204" width="260" height="108" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="160.0" y="234" text-anchor="middle" font-size="24">💡</text>
<text x="160.0" y="258" text-anchor="middle" font-size="13.5" font-weight="800" fill="#e67700">Pourquoi ça compte</text>
<text x="160.0" y="277" text-anchor="middle" font-size="11.5" fill="#1c2333">une légende d’image piégée ne</text>
<text x="160.0" y="293" text-anchor="middle" font-size="11.5" fill="#1c2333">peut pas faire exécuter de code</text>
<rect x="550" y="204" width="220" height="108" rx="12" fill="#f1f3f7" stroke="#4a5468" stroke-width="1.6"/>
<text x="660.0" y="226" text-anchor="middle" font-size="13.5" font-weight="800" fill="#4a5468">Aussi interdits</text>
<text x="660.0" y="245" text-anchor="middle" font-size="11.5" fill="#1c2333">eval(), scripts venus d’un</text>
<text x="660.0" y="261" text-anchor="middle" font-size="11.5" fill="#1c2333">autre site, objets embarqués</text>
</svg>
