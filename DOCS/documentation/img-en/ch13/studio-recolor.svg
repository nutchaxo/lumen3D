<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="430" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Recolouring without re-rendering: from raw values to colours</text><rect x="20" y="56" width="190" height="176" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① raw: the raw values</text><text x="34" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >For each pixel of the slice,</text><text x="34" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >the values of channels 0 to</text><text x="34" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >3 as the graphics card read</text><text x="34" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >them from the atlas (4</text><text x="34" y="170.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >RGBA bytes). Once, when</text><text x="34" y="187.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >the slice is rendered.</text><line x1="214" y1="140" x2="246" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="250" y="56" width="300" height="176" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="264" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② SliceCompositor</text><text x="264" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Applies to each lit channel exactly the slice</text><text x="264" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >shader's arithmetic, on its own WebGL2</text><text x="264" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >canvas (or a 256-entry table when WebGL2 is</text><text x="264" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >missing). One pass per setting change.</text><line x1="554" y1="140" x2="586" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="590" y="56" width="190" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="604" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ The Studio picture</text><text x="604" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >The document's colours,</text><text x="604" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >not the viewer's. The</text><text x="604" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >layers do not move: same</text><text x="604" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >frame, same pixels.</text><rect x="20" y="252" width="760" height="156" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="276" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >The formula, channel by channel (i = lit channels)</text><text x="40" y="300" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">vᵢ = clamp( (rawᵢ/255 − minᵢ) / max(maxᵢ − minᵢ ; 0.0001) ; 0 ; 1 )</text><text x="40" y="322" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">vᵢ = vᵢ ^ gammaᵢ</text><text x="40" y="344" font-size="12.5" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">rgb = clamp( Σ vᵢ · opacityᵢ · colourᵢ ; 0 ; 1 )</text><text x="40" y="374" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >Transparent if |rgb| &lt; 0.005 for a single slice; opaque (black where nothing shows) for a slab projected as MIP or average.</text></svg>