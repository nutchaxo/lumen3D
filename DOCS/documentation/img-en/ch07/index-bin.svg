<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 322" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="322" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Anatomy of index.bin (the demonstration dataset: 7,846 bytes)</text><rect x="30" y="70" width="130" height="64" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6" /><text x="95.0" y="94" font-size="13" font-weight="800" fill="#7048e8" text-anchor="middle" >header</text><text x="95.0" y="114" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >12 B</text><text x="95.0" y="156" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >LBIX · v1 · 4 levels</text><text x="95.0" y="171" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >· 3 channels</text><rect x="160" y="70" width="190" height="64" rx="8" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6" /><text x="255.0" y="94" font-size="13" font-weight="800" fill="#0c8599" text-anchor="middle" >1 row per level</text><text x="255.0" y="114" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >4 × 16 B</text><text x="255.0" y="156" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >grid X, Y, Z + number of</text><text x="255.0" y="171" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >packs</text><rect x="350" y="70" width="380" height="64" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="540.0" y="94" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >1 entry per brick slot</text><text x="540.0" y="114" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >7,770 B</text><text x="540.0" y="156" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" >(216 + 30 + 9 + 4) × 3 channels × 10 B</text><text x="400" y="190" font-size="15" font-weight="800" fill="#1c2333" text-anchor="middle" >One entry = 10 bytes = 3 numbers</text><rect x="120" y="210" width="115.19999999999999" height="52" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="177.6" y="233" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle" >pack  (u16, 2 B)</text><text x="177.6" y="252" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >which pack</text><rect x="240" y="210" width="211.2" height="52" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="345.6" y="233" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >offset  (u32, 4 B)</text><text x="345.6" y="252" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >where the image starts</text><rect x="460" y="210" width="211.2" height="52" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6" /><text x="565.6" y="233" font-size="13" font-weight="800" fill="#c92a2a" text-anchor="middle" >length  (u32, 4 B)</text><text x="565.6" y="252" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >how many bytes (0 = absent brick)</text><text x="400" y="300" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" font-style="italic">All values are little-endian: the least significant byte comes first.</text></svg>