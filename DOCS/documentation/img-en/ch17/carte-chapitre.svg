400" fill="#1c2333" text-anchor="start" >17.6  download/ and gallery/</text><rect x="278" y="78" width="244" height="258" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><circle cx="304" cy="108" r="16" fill="#e67700" stroke="none" stroke-width="1"/><text x="304" y="114" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >B</text><text x="328" y="112" font-size="14" font-weight="800" fill="#e67700" text-anchor="start" >Formats and migrations</text><text x="292" y="148" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >How does a dataset change format?</text><text x="292" y="180" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.7  formats 1 to 4</text><text x="292" y="204" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.8  three migrations</text><text x="292" y="228" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.9  units and journal</text><text x="292" y="252" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.10  two executors</text><text x="292" y="276" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.11  finalize</text><text x="292" y="300" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.12  governor, slow hosts</text><rect x="532" y="78" width="244" height="258" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><circle cx="558" cy="108" r="16" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="558" y="114" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >C</text><text x="582" y="112" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start" >The browser import</text><text x="546" y="148" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >How does a dataset arrive without SFTP?</text><text x="546" y="180" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >17.13  the journey</text><text x