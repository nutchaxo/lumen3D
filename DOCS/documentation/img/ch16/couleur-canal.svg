<text x="40" y="425" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start">Le pipeline écrit toujours une couleur (étape 3) : les préréglages 4 ne servent donc qu'aux jeux dont les métadonnées n'en ont pas.</text>
