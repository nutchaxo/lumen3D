<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 322" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="322" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Publication « tout ou rien » : on ne change la vitrine que quand la nouvelle est prête</text><rect x="24" y="70" width="142" height="130" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="2" /><text x="95" y="98" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="middle" >1 · Construire</text><text x="95" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >tout est fabriqué dans</text><text x="95" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >un dossier de travail privé</text><line x1="168" y1="135" x2="178" y2="135" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="180" y="70" width="142" height="130" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="2" /><text x="251" y="98" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="middle" >2 · Mettre de côté</text><text x="251" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >marqueur .swap-in-progress</text><text x="251" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >anciens fichiers → .pre-swap</text><line x1="324" y1="135" x2="334" y2="135" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="336" y="70" width="142" height="130" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" /><text x="407" y="98" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="middle" >3 · Installer</text><text x="407" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >les nouveaux bricks/, planes/,</text><text x="407" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >mips/, vignette arrivent</text><line x1="480" y1="135" x2="490" y2="135" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="492" y="70" width="142" height="130" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="2" /><text x="563" y="98" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="middle" >4 · Valider</text><text x="563" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >metadata.json est écrit EN</text><text x="563" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >DERNIER : point de non-retour</text><line x1="636" y1="135" x2="646" y2="135" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="648" y="70" width="142" height="130" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2" /><text x="719" y="98" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="middle" >5 · Nettoyer</text><text x="719" y="128" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >le marqueur et les copies</text><text x="719" y="146" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="middle" >.pre-swap sont supprimés</text><rect x="24" y="222" width="752" height="78" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="248" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start" >Si quelque chose échoue AVANT l'étape 4 : tout est remis comme avant, le jeu de données publié n'a jamais cessé de fonctionner.</text><text x="40" y="270" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >Si l'ordinateur plante au milieu : au lancement suivant, le marqueur permet de finir ou d'annuler proprement,</text><text x="40" y="288" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" >selon que metadata.json (empreinte sha256 dans le marqueur) est déjà en place ou non.</text></svg>