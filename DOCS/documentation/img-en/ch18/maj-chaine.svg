<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="470" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Updating (Python server): eight steps, only one changes the site</text><rect x="24" y="64" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,96 V76 a12,12 0 0 1 12,-12 H184 a12,12 0 0 1 12,12 V96 Z" fill="#e8edff"/><text x="36" y="86" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">1 · Checks</text><text x="36" y="120" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">same volume,</text><text x="36" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">disk space</text><text x="36" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">3 %</text><line x1="198" y1="122" x2="212" y2="122" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="214" y="64" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M214,96 V76 a12,12 0 0 1 12,-12 H374 a12,12 0 0 1 12,12 V96 Z" fill="#e8edff"/><text x="226" y="86" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">2 · Backup</text><text x="226" y="120" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">zip of the install,</text><text x="226" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">re-read after writing</text><text x="226" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">8 %</text><line x1="388" y1="122" x2="402" y2="122" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="404" y="64" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M404,96 V76 a12,12 0 0 1 12,-12 H564 a12,12 0 0 1 12,12 V96 Z" fill="#e8edff"/><text x="416" y="86" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">3 · Download</text><text x="416" y="120" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">announced size</text><text x="416" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">checked</text><text x="416" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">15 %</text><line x1="578" y1="122" x2="592" y2="122" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="594" y="64" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M594,96 V76 a12,12 0 0 1 12,-12 H754 a12,12 0 0 1 12,12 V96 Z" fill="#e8edff"/><text x="606" y="86" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">4 · Authenticity</text><text x="606" y="120" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">Ed25519 signature</text><text x="606" y="140" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">then SHA-256</text><text x="606" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">55 %</text><rect x="24" y="214" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M24,246 V226 a12,12 0 0 1 12,-12 H184 a12,12 0 0 1 12,12 V246 Z" fill="#e8edff"/><text x="36" y="236" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">5 · Staging</text><text x="36" y="270" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">safe extraction</text><text x="36" y="290" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">into a separate folder</text><text x="36" y="318" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">65 %</text><line x1="198" y1="272" x2="212" y2="272" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="214" y="214" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M214,246 V226 a12,12 0 0 1 12,-12 H374 a12,12 0 0 1 12,12 V246 Z" fill="#e8edff"/><text x="226" y="236" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">6 · Dry run</text><text x="226" y="270" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">dev_server.py --check</text><text x="226" y="290" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">on the new tree</text><text x="226" y="318" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">78 %</text><line x1="388" y1="272" x2="402" y2="272" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="404" y="214" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M404,246 V226 a12,12 0 0 1 12,-12 H564 a12,12 0 0 1 12,12 V246 Z" fill="#e8edff"/><text x="416" y="236" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start">7 · Plan + journal</text><text x="416" y="270" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">files to place</text><text x="416" y="290" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">and to remove</text><text x="416" y="318" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#3b5bdb" text-anchor="start">85 %</text><line x1="578" y1="272" x2="592" y2="272" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="594" y="214" width="172" height="116" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M594,246 V226 a12,12 0 0 1 12,-12 H754 a12,12 0 0 1 12,12 V246 Z" fill="#fff0f0"/><text x="606" y="236" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start">8 · Switch</text><text x="606" y="270" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">supervisor</text><text x="606" y="290" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start">detached</text><text x="606" y="318" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="start">90 %</text><path d="M780,180 V196 H20 V212 H24" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="776" y="56" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="end">% = progress shown in the admin</text><rect x="24" y="342" width="520" height="96" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="40" y="368" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">Steps 1 to 7: the installation is not touched</text><text x="40" y="392" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">An error at any point abandons the update.</text><text x="40" y="414" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">Message: “installation intact”. Nothing was replaced.</text><rect x="560" y="342" width="216" height="96" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="574" y="368" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Step 8</text><text x="574" y="392" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">the only phase that changes</text><text x="574" y="414" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">the site (next figure)</text></svg>