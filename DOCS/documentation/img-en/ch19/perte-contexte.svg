<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="430" rx="16" fill="#f8f9fd"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Graphics context lost: one recovery, with a safeguard</text>
<rect x="24" y="54" width="224" height="100" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="136.0" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#c92a2a">1 · The GPU is reset</text>
<text x="136.0" y="100" text-anchor="middle" font-size="12.5" fill="#1c2333">textures freed, streams stopped,</text>
<text x="136.0" y="118" text-anchor="middle" font-size="12.5" fill="#1c2333">memory budget ÷ 2</text>
<text x="136.0" y="136" text-anchor="middle" font-size="12.5" fill="#1c2333">(floor 256 MiB)</text>
<rect x="288" y="54" width="224" height="100" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="400.0" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#e67700">2 · The browser gives it back</text>
<text x="400.0" y="100" text-anchor="middle" font-size="12.5" fill="#1c2333">the last view is reloaded</text>
<text x="400.0" y="118" text-anchor="middle" font-size="12.5" fill="#1c2333">with the reduced budget</text>
<rect x="552" y="54" width="224" height="100" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6"/>
<text x="664.0" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">3 · The volume comes back</text>
<text x="664.0" y="100" text-anchor="middle" font-size="12.5" fill="#1c2333">often at a coarser level,</text>
<text x="664.0" y="118" text-anchor="middle" font-size="12.5" fill="#1c2333">which you can raise afterwards</text>
<line x1="250" y1="104" x2="286" y2="104" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<line x1="514" y1="104" x2="550" y2="104" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="400" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#1c2333">Safeguard: 3 losses in under 120 s</text>
<line x1="70" y1="250" x2="730" y2="250" stroke="#4a5468" stroke-width="2.4"/>
<line x1="70.0" y1="245" x2="70.0" y2="255" stroke="#4a5468" stroke-width="2"/>
<text x="70.0" y="274" text-anchor="middle" font-size="12" fill="#4a5468">0</text>
<line x1="235.0" y1="245" x2="235.0" y2="255" stroke="#4a5468" stroke-width="2"/>
<text x="235.0" y="274" text-anchor="middle" font-size="12" fill="#4a5468">30</text>
<line x1="400.0" y1="245" x2="400.0" y2="255" stroke="#4a5468" stroke-width="2"/>
<text x="400.0" y="274" text-anchor="middle" font-size="12" fill="#4a5468">60</text>
<line x1="565.0" y1="245" x2="565.0" y2="255" stroke="#4a5468" stroke-width="2"/>
<text x="565.0" y="274" text-anchor="middle" font-size="12" fill="#4a5468">90</text>
<line x1="730.0" y1="245" x2="730.0" y2="255" stroke="#4a5468" stroke-width="2"/>
<text x="730.0" y="274" text-anchor="middle" font-size="12" fill="#4a5468">120</text>
<text x="742" y="274" text-anchor="start" font-size="12" fill="#4a5468">seconds</text>
<circle cx="114.0" cy="250" r="9" fill="#c92a2a"/>
<text x="114.0" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">loss</text>
<circle cx="350.5" cy="250" r="9" fill="#c92a2a"/>
<text x="350.5" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">loss</text>
<circle cx="642.0" cy="250" r="9" fill="#c92a2a"/>
<text x="642.0" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#c92a2a">loss</text>
<line x1="642.0" y1="264" x2="560" y2="296" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#arrr)"/>
<rect x="200" y="296" width="560" height="80" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="480.0" y="322" text-anchor="middle" font-size="12.5" fill="#1c2333">No more automatic reload.</text>
<text x="480.0" y="341" text-anchor="middle" font-size="12.5" fill="#1c2333">Message: choose a lower quality</text>
<text x="480.0" y="360" text-anchor="middle" font-size="12.5" fill="#1c2333">or reload the page.</text>
<text x="400" y="404" text-anchor="middle" font-size="12" fill="#4a5468">The budget is remembered for a week per browser (up to 4 losses counted): 4 GiB → 2 → 1 → 0.5 → 0.25 GiB</text>
</svg>
