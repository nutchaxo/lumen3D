<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="560" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Le bac à sable : un guichet blindé avec un interphone</text><rect x="24" y="52" width="220" height="420" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><rect x="24" y="52" width="220" height="30" rx="12" fill="#e8edff" stroke="#c5cbd8" stroke-width="1.2"/><text x="134" y="72" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="middle">La page (hôte)</text><text x="40" y="110" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">PluginSandbox</text><text x="40" y="130" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">• vérifie chaque message</text><text x="40" y="150" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">• garde ctx (jamais remis)</text><text x="40" y="170" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">• répond par des copies</text><rect x="556" y="52" width="220" height="420" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="556" y="52" width="220" height="30" rx="12" fill="#fff" stroke="#7048e8" stroke-width="1.2"/><text x="666" y="72" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10.6" font-weight="800" fill="#7048e8" text-anchor="middle">iframe sandbox="allow-scripts"</text><text x="570" y="110" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">origine « null »</text><text x="570" y="130" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">pas de DOM de la page</text><text x="570" y="150" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">ni cookies ni stockage</text><text x="570" y="170" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">aucun réseau (connect-src 'none')</text><text x="570" y="190" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">ni worker ni sous-cadre</text><text x="570" y="210" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start"></text><text x="570" y="230" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">window.LumenPlugin</text><text x="570" y="250" font-family="Inter, sans-serif" font-size="11.2" font-weight="400" fill="#4a5468" text-anchor="start">(le seul objet disponible)</text><line x1="552" y1="112" x2="250" y2="112" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="104" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">1  ready</text><text x="400" y="128" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">le cadre est prêt</text><line x1="250" y1="152" x2="552" y2="152" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="144" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">2  init</text><text x="400" y="168" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">infos publiques + textes</text><line x1="250" y1="192" x2="552" y2="192" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="184" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">3  activate</text><text x="400" y="208" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">après un VRAI clic</text><line x1="552" y1="232" x2="250" y2="232" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="224" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">4  req viewer.getCanvasBlob</text><text x="400" y="248" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">+ jeton du cadre</text><line x1="250" y1="272" x2="552" y2="272" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="264" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">5  res  ok | forbidden | busy</text><text x="400" y="288" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">copie « à plat »</text><line x1="552" y1="312" x2="250" y2="312" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="304" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">6  req ui.download</text><text x="400" y="328" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">≤ 1,5 s après le clic</text><line x1="250" y1="352" x2="552" y2="352" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="344" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">7  ping</text><text x="400" y="368" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">toutes les 1,5 s</text><line x1="552" y1="392" x2="250" y2="392" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/><text x="400" y="384" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.2" font-weight="700" fill="#1c2333" text-anchor="middle">8  pong</text><text x="400" y="408" font-family="Inter, sans-serif" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle">sinon cadre détruit (~ 6 s)</text><rect x="24" y="486" width="752" height="64" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="36" y="506" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#1c2333" text-anchor="start">Contrôles de l'hôte sur chaque message reçu :</text><text x="36" y="525" font-family="Inter, sans-serif" font-size="10.3" font-weight="500" fill="#4a5468" text-anchor="start">espace 'lumen-plugin' → fenêtre émettrice connue → origine 'null' → jeton → débit (40 + 20/s) → capacité accordée</text><text x="36" y="541" font-family="Inter, sans-serif" font-size="10.3" font-weight="500" fill="#4a5468" text-anchor="start">Capacité non accordée : réponse « forbidden » et compteur d'abus (&gt; 50 en 10 s : cadre détruit).</text></svg>
