e="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Le magasin de tuiles</text><text x="486" y="122" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >uploads/migrations/</text><text x="486" y="144" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >└ 3d__…__m002-planes/</text><text x="486" y="166" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >   └ t0/</text><text x="486" y="188" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      ├ z0/  c0.y0.x0.png</text><text x="486" y="210" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      │      c0.y0.x1.png</text><text x="486" y="232" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      │      c0.y1.x0.png …</text><text x="486" y="254" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      ├ z1/  …</text><text x="486" y="276" font-size="11.2" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >      └ z129/ …</text><text x="486" y="318" font-size="11.5" font-weight="600" fill="#4a5468" text-anchor="start" >un PNG gris par plan et par tuile :</text><text x="486" y="336" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >une unité = jusqu'à 64 petits fichiers</text><text x="486" y="360" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="start" >ici : 42,0 Mo de tuiles avant l'assemblage</text><text x="486" y="382" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >jamais servi : c'est un atelier, pas une vitrine</text><rect x="24" y="414" width="752" height="74" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="40" y="438" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >Pourquoi une feuille de pointage ?</text><text x="40" y="458" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Comme un déménageur coche chaque caisse livrée : si le camion tombe en panne, ou qu'on change de camion</text><text x="40" y="476" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >(navigateur → serveur), on repart de la dernière caisse cochée. Une caisse livrée deux fois ne gêne personne.</text></svg>