<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="300" rx="16" fill="#f8f9fd"/><text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">The six pipeline steps, for one .ims file</text><g transform="translate(13,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#e8edff"/><rect y="18" width="118" height="16" fill="#e8edff"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#3b5bdb">1 · READ</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">📄</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">size, voxels,</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">channels, time</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#e8edff"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5bdb">meta.json</text></g><line x1="132" y1="152" x2="141" y2="152" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(142,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#fff0f0"/><rect y="18" width="118" height="16" fill="#fff0f0"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#c92a2a">2 · CLEAN</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">🧹</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">background removed,</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">noise smoothed</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#fff0f0"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c92a2a">background = 0</text></g><line x1="261" y1="152" x2="270" y2="152" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(271,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#fff4e6"/><rect y="18" width="118" height="16" fill="#fff4e6"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#e67700">3 · 8 BITS</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">🎚️</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">65,536 levels</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">→ 256 levels</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#fff4e6"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e67700">÷ 2 in size</text></g><line x1="390" y1="152" x2="399" y2="152" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(400,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#f3f0ff"/><rect y="18" width="118" height="16" fill="#f3f0ff"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#7048e8">4 · PYRAMID</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">🔺</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">the same image,</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">smaller</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#f3f0ff"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7048e8">levels 0…n</text></g><line x1="519" y1="152" x2="528" y2="152" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(529,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#ebfbee"/><rect y="18" width="118" height="16" fill="#ebfbee"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#2b8a3e">5 · BRICKS</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">🧱</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">64³ cubes,</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">lossless</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#ebfbee"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2b8a3e">WebP</text></g><line x1="648" y1="152" x2="657" y2="152" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><g transform="translate(658,58)"><rect width="118" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/><rect width="118" height="34" rx="14" fill="#e3fafc"/><rect y="18" width="118" height="16" fill="#e3fafc"/><text x="59.0" y="22" text-anchor="middle" font-size="12" font-weight="800" fill="#0c8599">6 · PUBLISH</text><text x="59.0" y="78" text-anchor="middle" font-size="34" font-weight="400" fill="#1c2333">📦</text><text x="59.0" y="108" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">record + thumbnail,</text><text x="59.0" y="125" text-anchor="middle" font-size="12.5" font-weight="400" fill="#1c2333">all or nothing</text><rect x="10" y="156" width="98" height="24" rx="12" fill="#e3fafc"/><text x="59.0" y="173" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c8599">DATA_WEB/</text></g><text x="400" y="280" text-anchor="middle" font-size="12" font-weight="400" fill="#4a5468" font-style="italic">The original .ims file is never modified. Each step has its own chapter in the full documentation (4 to 8).</text></svg>