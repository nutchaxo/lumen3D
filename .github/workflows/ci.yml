name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'   # the advertised PHP floor for the fallback
          extensions: zip, mbstring, sodium

      - name: Changelog structure check
        run: python tools/check_version.py --no-tag

      - name: Server self-check (offline boot gate)
        run: python dev_server.py --check

      # ── Every test of the repository (python, node, php; the three-language
      # twins - compat, trust, release notes, upload - are all in here). A test that
      # cannot run says SKIP and --strict-skips turns that into a failure, so a test
      # never stops running unnoticed. --check-clean fails if a test dirtied the tree.
      - name: Pipeline dependencies (the preprocessing tests run the real scripts)
        run: pip install numpy==2.5.1 scipy==1.16.0 h5py==3.16.0 Pillow==11.1.0 tqdm==4.67.1
      - name: Light pipeline pack (the admin/pack tests read the pack the repo builds)
        run: python tools/build_pipeline_bundle.py
      - name: Full test suite
        run: python tests/run_all.py -j 2 --strict-skips --check-clean

      # ── Security invariants (fail the build on regression) ──
      - name: Sandbox must never grant allow-same-origin (INV-6)
        run: |
          if grep -RnE "sandbox=[\"'][^\"']*allow-same-origin" js/; then
            echo "::error::an iframe sandbox attribute grants allow-same-origin"; exit 1; fi
      - name: No eval / new Function in first-party JS (CSP hardening)
        run: |
          if grep -RnE "\beval\s*\(|new Function\s*\(" js/core js/pages js/components js/modules js/viewers js/workers; then
            echo "::error::eval / new Function found in first-party JS"; exit 1; fi
      - name: No CDN <script src> in HTML (libs are self-hosted; CSP has no CDN)
        run: |
          if grep -RnE "<script[^>]+src=[\"']https?://" *.html; then
            echo "::error::a CDN <script src> would be blocked by the enforced script-src 'self'"; exit 1; fi
