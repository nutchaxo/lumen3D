<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs>
<rect width="800" height="450" rx="16" fill="#f8f9fd"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Pendant un import : quatre pannes, quatre réactions</text>
<rect x="24" y="180" width="150" height="84" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="99.0" y="206" text-anchor="middle" font-size="14" font-weight="800" fill="#3b5bdb">Un morceau de 8 Mio</text>
<text x="99.0" y="226" text-anchor="middle" font-size="12" fill="#4a5468">part vers le serveur</text>
<rect x="230" y="48" width="546" height="84" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="246" y="72" font-size="14" font-weight="800" fill="#e67700">Aucune réponse (réseau coupé)</text>
<text x="246" y="92" font-size="12.5" fill="#1c2333">Attente, sans compter d'échec.</text>
<text x="246" y="108" font-size="12.5" fill="#1c2333">Sonde toutes les 2 s (jusqu'à 15 s).</text>
<text x="246" y="124" font-size="12.5" fill="#1c2333">Reprise au retour du réseau.</text>
<path d="M176,222 C 200,222 200,90 228,90" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="230" y="142" width="546" height="84" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="246" y="166" font-size="14" font-weight="800" fill="#0c8599">Erreur serveur, trop de requêtes</text>
<text x="246" y="186" font-size="12.5" fill="#1c2333">5xx, 429 : jusqu'à 6 essais,</text>
<text x="246" y="202" font-size="12.5" fill="#1c2333">attente 1 s doublée jusqu'à 30 s.</text>
<text x="246" y="218" font-size="12.5" fill="#1c2333">Puis fichier marqué en échec : Réessayer.</text>
<path d="M176,222 C 200,222 200,184 228,184" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="230" y="236" width="546" height="84" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.6"/>
<text x="246" y="260" font-size="14" font-weight="800" fill="#c92a2a">Session expirée (401)</text>
<text x="246" y="280" font-size="12.5" fill="#1c2333">Arrêt net, message clair.</text>
<text x="246" y="296" font-size="12.5" fill="#1c2333">Reconnectez-vous et reglissez</text>
<text x="246" y="312" font-size="12.5" fill="#1c2333">le dossier : reprise au morceau près.</text>
<path d="M176,222 C 200,222 200,278 228,278" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="230" y="330" width="546" height="84" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="246" y="354" font-size="14" font-weight="800" fill="#7048e8">Disque plein (507)</text>
<text x="246" y="374" font-size="12.5" fill="#1c2333">Refus avant d'écrire si la place</text>
<text x="246" y="390" font-size="12.5" fill="#1c2333">manque ; message avec besoin/libre.</text>
<text x="246" y="406" font-size="12.5" fill="#1c2333">Libérez de la place, puis reprenez.</text>
<path d="M176,222 C 200,222 200,372 228,372" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<text x="400" y="436" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2333">Un morceau renvoyé deux fois est sans effet (même octets, même position) : réessayer est toujours sûr.</text>
</svg>
