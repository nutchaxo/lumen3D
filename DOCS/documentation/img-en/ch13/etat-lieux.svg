<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="326" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Where does what you adjust live?</text><rect x="20" y="56" width="182" height="168" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >The page's memory</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Measurements, Studio</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >history, graphics-card</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >atlas, brick buffers. Gone</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >when the tab closes.</text><rect x="212" y="56" width="182" height="168" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="226" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >The address (#state=)</text><text x="226" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Camera, channels, tool,</text><text x="226" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >cut plane, measurements,</text><text x="226" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >frame. Can be copied,</text><text x="226" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sent, bookmarked.</text><rect x="404" y="56" width="182" height="168" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="418" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >The browser</text><text x="418" y="98.35" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >(localStorage)</text><text x="418" y="118.9" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Your preferences: theme,</text><text x="418" y="135.46" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >language, colour-blind</text><text x="418" y="152.02" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >filter, timeline speed, Z</text><text x="418" y="168.58" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >stretch… and Compare</text><text x="418" y="185.14" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >workspaces.</text><rect x="596" y="56" width="182" height="168" rx="12" fill="#f1f3f5" stroke="#4a5468" stroke-width="1.4" /><text x="610" y="80.8" font-size="13.5" font-weight="800" fill="#4a5468" text-anchor="start" >The server</text><text x="610" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Nothing you adjust. Only</text><text x="610" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >anonymous counters (one</text><text x="610" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >view per dataset per</text><text x="610" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >session).</text><rect x="20" y="242" width="760" height="64" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="266" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >The viewer has no “Save” button: the address is the save. Private browsing or blocked storage: everything is wrapped in</text><text x="36" y="283.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >try/catch; the page works, it simply forgets your preferences.</text></svg>