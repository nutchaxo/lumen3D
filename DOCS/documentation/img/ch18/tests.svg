<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="480" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">201 fichiers de tests : trois langages, une seule commande</text><text x="24" y="92" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Node (.mjs, .js)</text><rect x="160" y="70" width="400" height="32" rx="8" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1.2"/><text x="570" y="92" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start">124</text><text x="160" y="122" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">le viewer, les workers, les protocoles</text><text x="24" y="164" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">Python</text><rect x="160" y="142" width="177.419" height="32" rx="8" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1.2"/><text x="347.419" y="164" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start">55</text><text x="160" y="194" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">serveur, pipeline, import, migrations</text><text x="24" y="236" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c2333" text-anchor="start">PHP</text><rect x="160" y="214" width="70.9677" height="32" rx="8" fill="#7048e8" stroke="#7048e8" stroke-width="1.2"/><text x="240.968" y="236" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start">22</text><text x="160" y="266" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">le serveur jumeau</text><rect x="24" y="290" width="420" height="170" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><text x="40" y="316" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start">Les modes de run_all.py</text><text x="40" y="342" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="start">-k texte</text><text x="176" y="342" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">fichiers dont le chemin contient texte</text><text x="40" y="366" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="start">-j 4</text><text x="176" y="366" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">quatre fichiers à la fois</text><text x="40" y="390" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="start">--timeout 600</text><text x="176" y="390" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">limite par fichier</text><text x="40" y="414" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="start">--strict-skips</text><text x="176" y="414" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">un test sauté compte comme un échec</text><text x="40" y="438" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="start">--check-clean</text><text x="176" y="438" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start">un test qui salit le dépôt échoue</text><rect x="460" y="290" width="316" height="170" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.2"/><text x="476" y="316" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0c8599" text-anchor="start">Les « jumeaux » testés ensemble</text><text x="476" y="344" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start">un même vecteur de test, 3 langages :</text><text x="476" y="370" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start">• compatibilité de version (42 cas)</text><text x="476" y="396" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start">• empreinte de confiance des plugins</text><text x="476" y="422" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start">• import, notes de version, cache</text></svg>