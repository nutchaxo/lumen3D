<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="420" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Du sélecteur de couleur à toutes les pages</text>
<rect x="16" y="56" width="170" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M16,90 L16,68 Q16,56 28,56 L174,56 Q186,56 186,68 L186,90 Z" fill="#f3f0ff"/>
<text x="101.0" y="78" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="middle" xml:space="preserve">Apparence</text>
<text x="28" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">couleurs, police,</text>
<text x="28" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">arrondis + aperçu</text>
<text x="28" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">en direct</text>
<text x="28" y="160.60000000000002" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">→ [Enregistrer]</text>
<line x1="190" y1="130" x2="224" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="228" y="56" width="170" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M228,90 L228,68 Q228,56 240,56 L386,56 Q398,56 398,68 L398,90 Z" fill="#e8edff"/>
<text x="313.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">theme.json</text>
<text x="240" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">{ "tokens": {</text>
<text x="240" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  "--color-primary":</text>
<text x="240" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "#2F6BFF" } }</text>
<text x="240" y="160.60000000000002" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">ce qui change seul</text>
<line x1="402" y1="130" x2="436" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="440" y="56" width="170" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M440,90 L440,68 Q440,56 452,56 L598,56 Q610,56 610,68 L610,90 Z" fill="#ebfbee"/>
<text x="525.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">Le serveur compile</text>
<text x="452" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">assainit chaque valeur</text>
<text x="452" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">(pas de { } ; @ &lt; &gt;)</text>
<text x="452" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">→ :root { … }</text>
<line x1="614" y1="130" x2="648" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="652" y="56" width="132" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M652,90 L652,68 Q652,56 664,56 L772,56 Q784,56 784,68 L784,90 Z" fill="#fff4e6"/>
<text x="718.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#e67700" text-anchor="middle" xml:space="preserve">theme.css</text>
<text x="664" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">fichier servi,</text>
<text x="664" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">identique pour</text>
<text x="664" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">chaque visiteur</text>
<text x="24" y="240" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">L'ordre des feuilles de style (la dernière gagne) :</text>
