<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 528" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="528" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Découper le travail en unités indépendantes</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Exemple réel : le jeu de démonstration 3D (768 × 576 × 112 voxels, 3 canaux) pour m002.</text><rect x="24" y="70" width="752" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><rect x="60" y="82" width="46.4" height="30" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="83.2" y="104" font-size="18" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >t0</text><text x="83.2" y="132" font-size="10.8" font-weight="600" fill="#3b5bdb" text-anchor="middle" >arbre (image)</text><rect x="116.4" y="82" width="62.599999999999994" height="30" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6" /><text x="147.7" y="104" font-size="18" font-weight="700" fill="#7048e8" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >.z0</text><text x="147.7" y="132" font-size="10.8" font-weight="600" fill="#7048e8" text-anchor="middle" >couche de 64 plans</text><rect x="189.0" y="82" width="62.599999999999994" height="30" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="220.3" y="104" font-size="18" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >.c1</text><text x="220.3" y="132" font-size="10.8" font-weight="600" fill="#2b8a3e" text-anchor="middle" >canal</text><rect x="261.6" y="82" width="62.599999999999994" height="30" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="292.90000000000003" y="104" font-size="18" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >.y1</text><text x="292.90000000000003" y="132" font-size="10.8" font-weight="600" fill="#e67700" text-anchor="middle" >tuile en Y</text><rect x="334.20000000000005" y="82" width="62.599999999999994" height="30" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" /><text x="365.50000000000006" y="104" font-size="18" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >.x0</text><text x="365.50000000000006" y="132" font-size="10.8" font-weight="600" fill="#e67700" text-anchor="middle" >tuile en X</text><text x="560" y="102" font-size="12.5" font-weight="600" fill="#4a5468" text-anchor="start" >= « une couche de 64 plans,</text><text x="560" y="120" font-size="12.5" font-weight="600" fill="#4a5468" text-anchor="start" >un canal, une tuile 512² »</text><text x="24" y="172" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Les 24 unités de m002 pour ce jeu</text><text x="84" y="188" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c0</text><rect x="40" y="192" width="36" height="36" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="78" y="192" width="18" height="36" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="40" y="230" width="36" height="18" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="78" y="230" width="18" height="18" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="204" y="188" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c1</text><rect x="160" y="192" width="36" height="36" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="198" y="192" width="18" height="36" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="160" y="230" width="36" height="18" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="198" y="230" width="18" height="18" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><text x="324" y="188" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c2</text><rect x="280" y="192" width="36" height="36" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="318" y="192" width="18" height="36" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="280" y="230" width="36" height="18" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="318" y="230" width="18" height="18" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><text x="32" y="232" font-size="11" font-weight="700" fill="#7048e8" text-anchor="end" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >z0</text><text x="84" y="306" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c0</text><rect x="40" y="310" width="36" height="36" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="78" y="310" width="18" height="36" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="40" y="348" width="36" height="18" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><rect x="78" y="348" width="18" height="18" rx="3" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="204" y="306" font-size="11" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c1</text><rect x="160" y="310" width="36" height="36" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="198" y="310" width="18" height="36" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="160" y="348" width="36" height="18" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><rect x="198" y="348" width="18" height="18" rx="3" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><text x="324" y="306" font-size="11" font-weight="700" fill="#7048e8" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >c2</text><rect x="280" y="310" width="36" height="36" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="318" y="310" width="18" height="36" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="280" y="348" width="36" height="18" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><rect x="318" y="348" width="18" height="18" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><text x="32" y="350" font-size="11" font-weight="700" fill="#7048e8" text-anchor="end" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >z1</text><text x="190" y="444" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="middle" >2 couches × 3 canaux × (2 × 2 tuiles) = 24 unités</text><rect x="420" y="172" width="356" height="138" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="434" y="194" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start" >Pourquoi des unités ?</text><text x="434" y="220.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• chacune se refait seule : rejouée, elle écrase</text><text x="434" y="238.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >  ses propres tuiles sans rien casser ;</text><text x="434" y="256.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• deux exécutants peuvent s'en partager la liste ;</text><text x="434" y="274.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• on s'arrête et on reprend à n'importe quel moment.</text><rect x="420" y="320" width="356" height="124" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="434" y="342" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Les trois formes de clé</text><text x="434" y="366" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >t{t}.z{bz}.c{c}.y{ty}.x{tx}</text><text x="434" y="380" font-size="10.8" font-weight="600" fill="#4a5468" text-anchor="start" >m002  couche de plans</text><text x="434" y="390" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >t{t}.l{l}.c{c}.y{ty}.x{tx}</text><text x="434" y="404" font-size="10.8" font-weight="600" fill="#4a5468" text-anchor="start" >m003  couche pour le MIP</text><text x="434" y="414" font-size="11.4" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >t{t}.k{k}.c{c}.z{BZ}.y{BY}.x{BX}</text><text x="434" y="428" font-size="10.8" font-weight="600" fill="#4a5468" text-anchor="start" >m004  super-bloc 4×4×4</text><rect x="24" y="462" width="752" height="50" rx="10" fill="#eef0f5" stroke="#c5cbd8" stroke-width="1.2" /><text x="400" y="484" font-size="12" font-weight="600" fill="#1c2333" text-anchor="middle" >Une unité vide (toutes ses briques absentes) est comptée « faite » d'emblée : elle ne demande aucun travail.</text><text x="400" y="502" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >Pour le jeu live de démonstration (4 images × 2 canaux × 1 tuile) : 8 unités.</text></svg>