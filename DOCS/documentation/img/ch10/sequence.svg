<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Du clic à l'image : la séquence de chargement</text><rect x="24" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="56" width="160" height="30" rx="12" fill="#e8edff"/><rect x="24" y="72" width="160" height="14" fill="#e8edff"/><text x="104.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">1 · MANIFESTE</text><text x="104.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">on lit le plan</text><text x="104.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">(manifest.json)</text><text x="104.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">niveaux, packs</text><rect x="222" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="56" width="160" height="30" rx="12" fill="#ebfbee"/><rect x="222" y="72" width="160" height="14" fill="#ebfbee"/><text x="302.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#2b8a3e">2 · QUALITÉ</text><text x="302.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">512 / 1024 / Natif</text><text x="302.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">→ un niveau</text><text x="302.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">de la pyramide</text><rect x="420" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="56" width="160" height="30" rx="12" fill="#fff4e6"/><rect x="420" y="72" width="160" height="14" fill="#fff4e6"/><text x="500.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">3 · GROS GRAIN</text><text x="500.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">le niveau le plus</text><text x="500.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">grossier d'abord</text><text x="500.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">(aperçu rapide)</text><rect x="618" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="618" y="56" width="160" height="30" rx="12" fill="#f3f0ff"/><rect x="618" y="72" width="160" height="14" fill="#f3f0ff"/><text x="698.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#7048e8">4 · NIVEAU DEMANDÉ</text><text x="698.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">puis le niveau</text><text x="698.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">choisi, en</text><text x="698.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">arrière-plan</text><rect x="24" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="226" width="160" height="30" rx="12" fill="#e3fafc"/><rect x="24" y="242" width="160" height="14" fill="#e3fafc"/><text x="104.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#0c8599">5 · CENTRE D'ABORD</text><text x="104.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">les briques du</text><text x="104.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">centre vers</text><text x="104.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">l'extérieur</text><rect x="222" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="226" width="160" height="30" rx="12" fill="#fff0f0"/><rect x="222" y="242" width="160" height="14" fill="#fff0f0"/><text x="302.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#c92a2a">6 · DÉCODAGE</text><text x="302.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">des « ouvriers »</text><text x="302.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">décodent le WebP</text><text x="302.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">(hors page)</text><rect x="420" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="226" width="160" height="30" rx="12" fill="#e8edff"/><rect x="420" y="242" width="160" height="14" fill="#e8edff"/><text x="500.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">7 · ATLAS GPU</text><text x="500.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">chaque brique</text><text x="500.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">est posée dans</text><text x="500.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">la mémoire vidéo</text><line x1="186" y1="111" x2="220" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="111" x2="418" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="582" y1="111" x2="616" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><path d="M698 170 V198 H104 V222" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="186" y1="281" x2="220" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="281" x2="418" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><rect x="618" y="226" width="160" height="110" rx="12" fill="#fff8db" stroke="#e67700" stroke-width="2"/><text x="698" y="256" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">1re IMAGE</text><text x="698" y="282" text-anchor="middle" font-size="12.5" fill="#1c2333">dès que 25 % des</text><text x="698" y="300" text-anchor="middle" font-size="12.5" fill="#1c2333">briques sont en place,</text><text x="698" y="318" text-anchor="middle" font-size="12.5" fill="#1c2333">le chargeur disparaît</text><line x1="582" y1="281" x2="614" y2="281" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/><text x="400" y="372" text-anchor="middle" font-size="13" fill="#4a5468">Les étapes 4 à 7 se chevauchent : pendant qu'une brique est décodée, la suivante est déjà en cours de téléchargement.</text></svg>