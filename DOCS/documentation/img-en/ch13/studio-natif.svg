<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The “native” pass: from the preview to full resolution</text><rect x="20" y="56" width="760" height="56" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.4" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >Preview (0 network bytes): the slice the graphics card already holds, rendered at ≤ 2048 px → the Studio opens at</text><text x="34" y="97.3" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >once.</text><line x1="400" y1="114" x2="400" y2="134" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="138" width="760" height="54" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="34" y="162.4" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >Pass plan: which bricks (and planes) does the cut plane cross?</text><line x1="210" y1="194" x2="210" y2="216" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><line x1="590" y1="194" x2="590" y2="216" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="220" width="372" height="168" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="34" y="244.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >“plane” path (axial plane or MIP, unwarped volume)</text><text x="34" y="265.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A layered 2D texture holding only the voxel planes actually</text><text x="34" y="281.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sampled. For an XY cut, the bytes come from planes/ (one</text><text x="34" y="298.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >plane = one file), from mips/ (per-layer maxima over 64</text><text x="34" y="315.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >planes) or, failing that, from the bricks.</text><rect x="408" y="220" width="372" height="168" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="422" y="244.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >“atlas” path (oblique cut, stabilised series,</text><text x="422" y="262.35" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >average)</text><text x="422" y="282.9" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A small throw-away 3D atlas, sized within the video-memory</text><text x="422" y="299.46" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >budget and filled brick by brick (targeted byte ranges). Too</text><text x="422" y="316.02" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >big: try the next level down.</text><line x1="210" y1="390" x2="400" y2="418" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><line x1="590" y1="390" x2="400" y2="418" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="20" y="420" width="760" height="84" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4" /><text x="34" y="444" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" >Progressive render: at most every 0.5 s, once 2 % of the bricks have arrived (or after 2 s), the slice is re-rendered as</text><text x="34" y="460.25" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" >raw values; the preview fills what is still missing; the Studio recolours and redraws.</text></svg>