<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 452" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="452" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >La conversion unique du vocabulaire (depuis la 1.51.0)</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Faite au démarrage par les deux serveurs ; ne coûte presque rien quand il n'y a plus rien à convertir.</text><rect x="60" y="78" width="190" height="40" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="155" y="104" font-size="15" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >fixed/</text><line x1="250" y1="98" x2="330" y2="98" stroke="#3b5bdb" stroke-width="2.4" marker-end="url(#arr)"/><rect x="334" y="78" width="400" height="40" rx="8" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.5" /><text x="354" y="104" font-size="14" font-weight="700" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >3d/</text><rect x="60" y="130" width="190" height="40" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="155" y="156" font-size="15" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >wholemount/</text><line x1="250" y1="150" x2="330" y2="150" stroke="#e67700" stroke-width="2.4" marker-end="url(#arr)"/><rect x="334" y="130" width="400" height="40" rx="8" fill="#fff4e6" stroke="#e67700" stroke-width="1.5" /><text x="354" y="156" font-size="14" font-weight="700" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >2d/</text><rect x="60" y="182" width="190" height="40" rx="8" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="155" y="208" font-size="15" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >tracking/</text><line x1="250" y1="202" x2="330" y2="202" stroke="#c92a2a" stroke-width="2.4" marker-end="url(#arr)"/><rect x="334" y="182" width="400" height="40" rx="8" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.5" /><text x="354" y="208" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >supprimé si vide, sinon laissé et signalé</text><rect x="24" y="240" width="752" height="196" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="264" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Ce qui est converti, d'un seul passage</text><text x="44" y="292" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• les dossiers de DATA_WEB/ et de uploads/staging/ (un par un si la cible existe déjà)</text><text x="44" y="314" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• les journaux d'import uploads/state/fixed__*.json (renommés et réécrits)</text><text x="44" y="336" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• "type" et "id" de chaque metadata.json, et les anciens id dans relatedIds / linkedTrackingId</text><text x="44" y="358" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• les clés de api/stats.json (compteurs additionnés en cas de collision)</text><text x="44" y="380" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• pageTitles.wholemount, et les liens explorer.html?type=… des pages construites</text><text x="44" y="410" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="start" >Ce n'est pas une couche de compatibilité : après la conversion, plus aucun code ne lit les anciens mots.</text><text x="44" y="428" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >Une seule passe tourne à chaque démarrage : la réparation de l'identité (type/id) d'un metadata.json qui contredit son dossier.</text></svg>