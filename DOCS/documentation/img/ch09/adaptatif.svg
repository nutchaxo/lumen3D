<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
  <pattern id="fine" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#bac8ff"/><rect width="3" height="3" fill="#91a7ff"/><rect x="3" y="3" width="3" height="3" fill="#91a7ff"/></pattern>
  <pattern id="coarse" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#bac8ff"/><rect width="12" height="12" fill="#91a7ff"/><rect x="12" y="12" width="12" height="12" fill="#91a7ff"/></pattern></defs>
  <rect width="800" height="400" rx="16" fill="#f8f9fd"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Résolution adaptative : fluide quand vous bougez, nette quand vous vous arrêtez</text>
  <!-- rest -->
  <rect x="24" y="52" width="360" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <rect x="24" y="52" width="360" height="34" rx="14" fill="#ebfbee"/><rect x="24" y="70" width="360" height="16" fill="#ebfbee"/>
  <text x="204" y="75" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">AU REPOS : qualité maximale</text>
  <rect x="44" y="104" width="110" height="110" rx="6" fill="url(#fine)" stroke="#c5cbd8"/>
  <text x="170" y="130" font-size="13" fill="#1c2333" font-weight="700">1 échantillon</text>
  <text x="170" y="148" font-size="13" fill="#1c2333" font-weight="700">par voxel</text>
  <text x="170" y="176" font-size="13" fill="#4a5468">pixels : 1 par pixel</text>
  <text x="170" y="194" font-size="13" fill="#4a5468">de l'écran (jusqu'à ×2</text>
  <text x="170" y="212" font-size="13" fill="#4a5468">sur écran Retina)</text>
  <!-- drag -->
  <rect x="416" y="52" width="360" height="190" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <rect x="416" y="52" width="360" height="34" rx="14" fill="#fff4e6"/><rect x="416" y="70" width="360" height="16" fill="#fff4e6"/>
  <text x="596" y="75" text-anchor="middle" font-size="14" font-weight="800" fill="#e67700">PENDANT LE GLISSEMENT : allégé</text>
  <rect x="436" y="104" width="110" height="110" rx="6" fill="url(#coarse)" stroke="#c5cbd8"/>
  <text x="562" y="130" font-size="13" fill="#1c2333" font-weight="700">0,1 à 0,75 échantillon</text>
  <text x="562" y="148" font-size="13" fill="#1c2333" font-weight="700">par voxel</text>
  <text x="562" y="176" font-size="13" fill="#4a5468">pixels : de ×0,25 à ×1</text>
  <text x="562" y="194" font-size="13" fill="#4a5468">de la définition de repos</text>
  <text x="562" y="212" font-size="13" fill="#4a5468">(départ : ×0,75 et 0,35)</text>
  <!-- loop -->
  <rect x="24" y="262" width="752" height="120" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <text x="400" y="288" text-anchor="middle" font-size="14" font-weight="800" fill="#1c2333">Le régulateur : viser 16,7 ms par image (60 images/s)</text>
  <rect x="44" y="304" width="210" height="60" rx="10" fill="#e8edff" stroke="#3b5bdb"/>
  <text x="149" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#3b5bdb">1 · on mesure</text>
  <text x="149" y="348" text-anchor="middle" font-size="12" fill="#1c2333">le temps d'une image</text>
  <rect x="296" y="304" width="210" height="60" rx="10" fill="#fff0f0" stroke="#c92a2a"/>
  <text x="401" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#c92a2a">trop lent (&gt; 1,3 × 16,7 ms)</text>
  <text x="401" y="348" text-anchor="middle" font-size="12" fill="#1c2333">→ moins de pixels, puis moins d'échantillons</text>
  <rect x="548" y="304" width="210" height="60" rx="10" fill="#ebfbee" stroke="#2b8a3e"/>
  <text x="653" y="329" text-anchor="middle" font-size="13" font-weight="700" fill="#2b8a3e">assez rapide (≤ 1,1 ×)</text>
  <text x="653" y="348" text-anchor="middle" font-size="12" fill="#1c2333">→ on remonte en douceur</text>
  <line x1="256" y1="334" x2="292" y2="334" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/>
  <line x1="508" y1="334" x2="544" y2="334" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/>
</svg>
