<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Why the “plane” path: the video memory of a single cut</text><text x="24" y="70" font-size="13" font-weight="700" fill="#4a5468" text-anchor="start" >Native XY cut of a 5735 × 5735-voxel dataset, 4 channels (values from the code, bars to the same scale)</text><rect x="24" y="92" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="118" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Plane path</text><rect x="220" y="104" width="10" height="22" rx="2" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="1" /><text x="240" y="121" font-size="12.5" font-weight="700" fill="#2b8a3e" text-anchor="start" >≈ 132 MB: one 5735 × 5735 × 4-byte texture</text><text x="40" y="148" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >reads the cut's voxel planes</text><rect x="24" y="174" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="200" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Atlas path</text><rect x="220" y="186" width="520" height="22" rx="4" fill="#e67700" stroke="#e67700" stroke-width="1" /><text x="228" y="202" font-size="12.5" font-weight="700" fill="#fff" text-anchor="start" >from 1 to 7 GiB: a 66³-voxel slot for every brick crossed</text><text x="40" y="230" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >a cut crosses a whole layer of bricks</text><rect x="24" y="262" width="752" height="100" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="40" y="286" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >In a 64-plane brick, the cut reads just one: the other 63 depth voxels would waste memory and network. The plane path keeps</text><text x="40" y="302.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >only the useful plane (or, for a projected slab, its per-column maximum, computed in a worker). If the plane is oblique, or the</text><text x="40" y="319.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >series is stabilised, this shortcut does not exist: the atlas takes over.</text></svg>