<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="504" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >La vie d'un travail de migration</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >États écrits dans le journal ; chaque flèche porte l'appel d'API qui la provoque.</text><text x="70" y="112" font-size="12" font-weight="600" fill="#4a5468" text-anchor="middle" >(aucun journal)</text><rect x="150" y="90" width="140" height="56" rx="14" fill="#e8edff" stroke="#3b5bdb" stroke-width="2" /><text x="220.0" y="112" font-size="15" font-weight="800" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >running</text><text x="220.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >unités en cours</text><rect x="350" y="90" width="150" height="56" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="2" /><text x="425.0" y="112" font-size="15" font-weight="800" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >assembling</text><text x="425.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >assemblage reprenable</text><rect x="560" y="90" width="130" height="56" rx="14" fill="#ebfbee" stroke="#2b8a3e" stroke-width="2" /><text x="625.0" y="112" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >swapped</text><text x="625.0" y="130" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >échange fait</text><rect x="350" y="220" width="150" height="56" rx="14" fill="#fff0f0" stroke="#c92a2a" stroke-width="2" /><text x="425.0" y="242" font-size="15" font-weight="800" fill="#c92a2a" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >failed</text><text x="425.0" y="260" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >source_changed…</text><rect x="560" y="220" width="190" height="56" rx="14" fill="#fff" stroke="#2b8a3e" stroke-width="2" /><text x="655" y="244" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="middle" >terminé</text><text x="655" y="262" font-size="10.8" font-weight="400" fill="#4a5468" text-anchor="middle" >journal et tuiles supprimés</text><line x1="104" y1="118" x2="150" y2="118" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="127" y="108" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >plan</text><line x1="290" y1="118" x2="350" y2="118" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="320" y="108" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><line x1="500" y1="118" x2="560" y2="118" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="530" y="108" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><line x1="625" y1="146" x2="655" y2="220" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="655" y="188" font-size="10.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >finalize</text><path d="M 220 146 L 220 160 Q 220 168 228 168 L 262 168" fill="none" stroke="#4a5468" stroke-width="2"/><text x="240" y="186" font-size="10.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >unit_put</text><text x="240" y="200" font-size="10.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >unit_run</text><path d="M 185 146 C 150 190 270 190 255 146" fill="none" stroke="#3b5bdb" stroke-width="2" marker-end="url(#arr)"/><line x1="420" y1="146" x2="420" y2="220" stroke="#c92a2a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/><text x="428" y="188" font-size="10.5" font-weight="600" fill="#c92a2a" text-anchor="start" >le manifeste a changé</text><path d="M 350 248 L 220 248 L 220 150" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="285" y="240" font-size="10.5" font-weight="600" fill="#c92a2a" text-anchor="middle" >plan : on repart propre</text><rect x="24" y="300" width="752" height="188" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="324" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Ce qu'il faut savoir</text><text x="44" y="350" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• Pause : c'est l'onglet qui s'arrête, pas le journal — il reste « running » et se reprend tel quel.</text><text x="44" y="376" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• finalize rend complete:false tant qu'il n'a pas fini : on le rappelle (assemblage par morceaux).</text><text x="44" y="402" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• swapped = les nouveaux fichiers sont en place, la version n'est pas encore montée. Un plantage ici est sans danger.</text><text x="44" y="428" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• failed + source_changed : le jeu a été retraité pendant le travail ; plan vide les tuiles et recommence.</text><text x="44" y="454" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >• cancel (la croix) : supprime journal et tuiles ; le jeu de données reste exactement comme il était.</text></svg>