<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 454" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="454" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The catalogue is not a file: it is computed</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >GET /DATA_WEB/catalog.json → an answer built from the metadata.json files.</text><rect x="24" y="74" width="210" height="190" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6" /><text x="38" y="96" font-size="14" font-weight="800" fill="#3b5bdb" text-anchor="start" >DATA_WEB/</text><text x="38" y="122.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >3d/  &lt;set&gt;/metadata.json</text><text x="38" y="140.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >2d/  &lt;set&gt;/metadata.json</text><text x="38" y="158.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >live/&lt;set&gt;/metadata.json</text><text x="38" y="176.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" ></text><text x="38" y="194.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >nothing else to keep up to date:</text><text x="38" y="212.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >dropping a folder is enough</text><rect x="262" y="74" width="290" height="190" rx="12" fill="#fff" stroke="#7048e8" stroke-width="1.6" /><text x="277" y="98" font-size="14" font-weight="800" fill="#7048e8" text-anchor="start" >The scan (per request)</text><text x="277" y="122" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >1. skip “.” folders (publishing)</text><text x="277" y="144" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >2. read each metadata.json</text><text x="277" y="166" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >3. force id, path, type (the folder is the authority)</text><text x="277" y="188" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >4. thumbnail = the file if it exists</text><text x="277" y="210" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >5. keep: configured or thumbnailed, and not hidden</text><text x="277" y="232" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >6. sort: newest date first, then name</text><line x1="234" y1="169" x2="262" y2="169" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="580" y="74" width="196" height="190" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" /><text x="594" y="96" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="start" >The answer</text><text x="594" y="122.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >catalog.json</text><text x="594" y="140.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >+ ETag (sha-256)</text><text x="594" y="158.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Cache-Control: no-cache</text><text x="594" y="176.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" ></text><text x="594" y="194.0" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >→ 304 if nothing changed</text><line x1="552" y1="169" x2="580" y2="169" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><rect x="24" y="286" width="752" height="96" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="310" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Why it is not slow: a signature made of stat() calls only</text><text x="40" y="332" font-size="11.8" font-weight="400" fill="#4a5468" text-anchor="start" >• the list is recomputed only if a metadata.json (date, size) or a folder changed;</text><text x="40" y="350" font-size="11.8" font-weight="400" fill="#4a5468" text-anchor="start" >• the signature is rechecked at most every 2 seconds (Python server); every admin write resets it.</text><text x="40" y="368" font-size="11.8" font-weight="400" fill="#4a5468" text-anchor="start" >• on PHP: api/catalog.php, rewritten from /DATA_WEB/catalog.json, cached in api/.catalog-cache.json.</text><rect x="24" y="396" width="752" height="44" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="423" font-size="12" font-weight="600" fill="#1c2333" text-anchor="middle" >Result: a dataset copied over SFTP appears by itself; a “hidden” one stays invisible to the public.</text></svg>