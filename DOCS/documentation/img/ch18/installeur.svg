<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="380" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">install.php : un fichier, six étapes</text><rect x="18" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M18,100 V78 a12,12 0 0 1 12,-12 H124 a12,12 0 0 1 12,12 V100 Z" fill="#e8edff"/><text x="77" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#3b5bdb" text-anchor="middle">1</text><text x="77" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Prérequis</text><text x="77" y="160" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">PHP, zip,</text><text x="77" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">écriture, réseau</text><line x1="137" y1="140" x2="146" y2="140" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="147" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M147,100 V78 a12,12 0 0 1 12,-12 H253 a12,12 0 0 1 12,12 V100 Z" fill="#e8edff"/><text x="206" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#3b5bdb" text-anchor="middle">2</text><text x="206" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Téléchargement</text><text x="206" y="160" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">par tranches,</text><text x="206" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">reprise (Range)</text><line x1="266" y1="140" x2="275" y2="140" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="276" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M276,100 V78 a12,12 0 0 1 12,-12 H382 a12,12 0 0 1 12,12 V100 Z" fill="#ebfbee"/><text x="335" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#2b8a3e" text-anchor="middle">3</text><text x="335" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Vérification</text><text x="335" y="160" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">signature +</text><text x="335" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">SHA-256 du zip</text><line x1="395" y1="140" x2="404" y2="140" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="405" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M405,100 V78 a12,12 0 0 1 12,-12 H511 a12,12 0 0 1 12,12 V100 Z" fill="#e8edff"/><text x="464" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#3b5bdb" text-anchor="middle">4</text><text x="464" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Extraction</text><text x="464" y="160" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">par lots,</text><text x="464" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">entrées contrôlées</text><line x1="524" y1="140" x2="533" y2="140" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="534" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M534,100 V78 a12,12 0 0 1 12,-12 H640 a12,12 0 0 1 12,12 V100 Z" fill="#f3f0ff"/><text x="593" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#7048e8" text-anchor="middle">5</text><text x="593" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Compte admin</text><text x="593" y="160" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">mot de passe</text><text x="593" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">≥ 8 caractères</text><line x1="653" y1="140" x2="662" y2="140" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/><rect x="663" y="66" width="118" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M663,100 V78 a12,12 0 0 1 12,-12 H769 a12,12 0 0 1 12,12 V100 Z" fill="#fff4e6"/><text x="722" y="90" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#e67700" text-anchor="middle">6</text><text x="722" y="130" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#1c2333" text-anchor="middle">Verrouillage</text><text x="722" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">.install-lock</text><text x="722" y="180" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">auto-suppression</text><rect x="18" y="240" width="764" height="112" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.2"/><text x="34" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#e67700" text-anchor="start">Garde-fous de l&#x27;installeur</text><text x="34" y="292" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• dépôt GitHub écrit en dur : aucune adresse n&#x27;est saisie par l&#x27;utilisateur</text><text x="34" y="312" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• rien de destructif avant la fin d&#x27;une vérification réussie</text><text x="34" y="332" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">• refuse de tourner si un compte administrateur ou .install-lock existe</text></svg>