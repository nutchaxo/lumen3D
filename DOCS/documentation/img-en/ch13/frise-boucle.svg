<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="470" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >One tick of the timeline clock</text><rect x="20" y="56" width="760" height="62" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.3" /><text x="36" y="80" font-size="13" font-weight="800" fill="#3b5bdb" text-anchor="start" >① On every screen frame</text><text x="250" y="78" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >requestAnimationFrame: the loop runs at the display's pace and calms itself in a hidden</text><text x="250" y="94.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >tab.</text><rect x="20" y="128" width="760" height="62" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.3" /><text x="36" y="152" font-size="13" font-weight="800" fill="#e67700" text-anchor="start" >② Is the player waiting?</text><text x="250" y="150" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >While the requested frame is not on screen (“holding the clock”), the head does not move.</text><text x="250" y="166.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Guard: 15 s at most.</text><rect x="20" y="200" width="760" height="62" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.3" /><text x="36" y="224" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ Advance</text><text x="250" y="222" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >dt = min(elapsed time; 250 ms), then frame += fps × dt / 1000. A hitch (load, sleeping tab)</text><text x="250" y="238.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >never skips a run of frames.</text><rect x="20" y="272" width="760" height="62" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.3" /><text x="36" y="296" font-size="13" font-weight="800" fill="#7048e8" text-anchor="start" >④ Loop and round</text><text x="250" y="294" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >At the last frame, back to 0. The shown frame = the rounded head; the viewer is told only if</text><text x="250" y="310.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >it changed.</text><rect x="20" y="344" width="760" height="62" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.3" /><text x="36" y="368" font-size="13" font-weight="800" fill="#0c8599" text-anchor="start" >⑤ Load</text><text x="250" y="366" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The viewer keeps only the last frame asked for, holds the clock until it arrives, then</text><text x="250" y="382.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >preloads the neighbours.</text><rect x="20" y="418" width="760" height="38" rx="10" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="442" font-size="12" font-weight="600" fill="#4a5468" text-anchor="start" >Offered speeds: 0.5 · 1 · 2 · 5 · 10 · 20 frames/s (default 10), remembered by the browser between visits.</text></svg>