<text x="89.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">variables.css</text>
<text x="89.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">factory values</text>
