<text x="556" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start">} »</text>
<text x="550" y="194" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#4a5468" text-anchor="start">Ce qu'il fait</text>
