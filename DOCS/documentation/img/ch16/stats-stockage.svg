<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="440" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Ce qui est compté, ce qui est gardé, ce qui n'existe pas</text>
<rect x="16" y="56" width="330" height="250" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M16,90 L16,68 Q16,56 28,56 L334,56 Q346,56 346,68 L346,90 Z" fill="#e8edff"/>
<text x="181.0" y="78" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">api/stats.json</text>
<text x="30" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">{ "global": { "visits": 19,</text>
<text x="30" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "views": 127, "downloads": 0,</text>
<text x="30" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "since": "2026-10-07…" },</text>
<text x="30" y="164" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  "daily": { "2026-10-07":</text>
<text x="30" y="184" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    { "views": 127, "visits": 19 } },</text>
<text x="30" y="204" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  "datasets": { "3d/Embryo-…": {</text>
<text x="30" y="224" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "views": 87,</text>
<text x="30" y="244" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "lastViewed": "2026-10-07…" } } }</text>
<text x="30" y="276" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="start" font-style="italic" xml:space="preserve">(chiffres de l'exemple : jeu de démonstration)</text>
<rect x="366" y="56" width="418" height="118" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M366,90 L366,68 Q366,56 378,56 L772,56 Q784,56 784,68 L784,90 Z" fill="#ebfbee"/>
<text x="575.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">Ce qui est compté</text>
<text x="378" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">visite : une ouverture de l'accueil par session</text>
<text x="378" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">vue : un jeu ouvert dans le viewer, une fois par session</text>
<text x="378" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">téléchargement : un fichier de download/ servi en entier</text>
<rect x="366" y="188" width="418" height="118" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M366,222 L366,200 Q366,188 378,188 L772,188 Q784,188 784,200 L784,222 Z" fill="#fff0f0"/>
<text x="575.0" y="210" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#c92a2a" text-anchor="middle" xml:space="preserve">Ce qui n'est PAS gardé</text>
<text x="378" y="244.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">aucune adresse IP, aucun cookie, aucun identifiant</text>
<text x="378" y="260.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">pas de navigateur, de pays, de page de provenance</text>
<text x="378" y="276.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">pas de visiteur : seulement des compteurs</text>
<rect x="16" y="322" width="768" height="100" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="32" y="346" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Session = un onglet : une clé de sessionStorage, qui reste dans le navigateur et disparaît à sa fermeture.</text>
<text x="32" y="370" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Les aperçus de l'administration ne comptent pas ; l'identifiant d'un jeu doit désigner un jeu qui existe.</text>
<text x="32" y="394" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Les écritures sont regroupées : au plus toutes les 5 secondes, à la lecture de l'admin, et à l'arrêt.</text>
</svg>
