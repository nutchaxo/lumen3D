<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="464" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Quand le serveur est trop lent : octants et prise en main par le navigateur</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Hébergement PHP mutualisé : une requête qui dépasse max_execution_time est tuée.</text><rect x="24" y="78" width="178" height="146" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44" cy="102" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44" y="107" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62" y="107" font-size="12.3" font-weight="800" fill="#3b5bdb" text-anchor="start" >On essaie l'unité entière</text><text x="34" y="136" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >un super-bloc 4×4×4 (≤ 64 briques)</text><text x="34" y="158" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >le journal note attempts[unité] = 1</text><text x="34" y="180" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >AVANT de commencer</text><rect x="215" y="78" width="178" height="146" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="235" cy="102" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="235" y="107" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="253" y="107" font-size="12.3" font-weight="800" fill="#e67700" text-anchor="start" >La requête est tuée ?</text><text x="225" y="136" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >le délai de l'hébergeur est dépassé</text><text x="225" y="158" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >au prochain appel, l'unité est</text><text x="225" y="180" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >découpée en 8 octants (2×2×2)</text><line x1="202" y1="150" x2="215" y2="150" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="406" y="78" width="178" height="146" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="426" cy="102" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="426" y="107" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="444" y="107" font-size="12.3" font-weight="800" fill="#7048e8" text-anchor="start" >Octant par octant</text><text x="416" y="136" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >chacun est rangé puis noté</text><text x="416" y="158" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >(partial[unité] = [0, 3, 5…])</text><text x="416" y="180" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >l'unité est cochée quand tous y sont</text><line x1="393" y1="150" x2="406" y2="150" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="597" y="78" width="178" height="146" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.7" /><circle cx="617" cy="102" r="12" fill="#c92a2a" stroke="none" stroke-width="1"/><text x="617" y="107" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="635" y="107" font-size="12.3" font-weight="800" fill="#c92a2a" text-anchor="start" >Encore tuée : deux fois</text><text x="607" y="136" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >409 unit_timeout</text><text x="607" y="158" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >le journal reste « running »</text><text x="607" y="180" font-size="10.9" font-weight="400" fill="#1c2333" text-anchor="start" >→ le NAVIGATEUR reprend cette étape</text><line x1="584" y1="150" x2="597" y2="150" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><text x="24" y="258" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >Un super-bloc et ses 8 octants</text><rect x="40" y="274" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="301" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >0</text><rect x="88" y="274" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="110" y="301" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >1</text><rect x="40" y="322" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="62" y="349" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >2</text><rect x="88" y="322" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="110" y="349" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >3</text><rect x="190" y="274" width="44" height="44" rx="4" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="212" y="301" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle" >4</text><rect x="238" y="274" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="301" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >5</text><rect x="190" y="322" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="212" y="349" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >6</text><rect x="238" y="322" width="44" height="44" rx="4" fill="#fff" stroke="#c5cbd8" stroke-width="1.4" /><text x="260" y="349" font-size="13" font-weight="700" fill="#4a5468" text-anchor="middle" >7</text><text x="110" y="374" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >couche basse</text><text x="260" y="374" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" >couche haute</text><rect x="400" y="262" width="376" height="124" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.6" /><text x="414" y="284" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start" >Ce que garantit le mécanisme</text><text x="414" y="309.7" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• aucun travail déjà rangé n'est perdu ;</text><text x="414" y="327.4" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• un octant n'est lancé que s'il tient dans le temps restant ;</text><text x="414" y="345.09999999999997" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• un nouveau plan remet les compteurs à zéro ;</text><text x="414" y="362.79999999999995" font-size="11.8" font-weight="400" fill="#1c2333" text-anchor="start" >• le navigateur n'a pas ce plafond de temps.</text><rect x="24" y="404" width="752" height="44" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="400" y="431" font-size="11.5" font-weight="600" fill="#1c2333" text-anchor="middle" >L'état « limits.resettable » dit si l'hôte honore set_time_limit() : sinon l'échéance est le début de la requête + max_execution_time.</text></svg>