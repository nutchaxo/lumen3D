<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="372" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Laying the volume flat: two rotations about the screen's axes</text><rect x="20" y="56" width="250" height="128" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① Where does the stack look?</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d = the file direction the “top” view</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >must look along, as the volume holds it</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >now: here d = (0.20; 0.60; 0.775).</text><line x1="274" y1="120" x2="300" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="304" y="56" width="250" height="128" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="318" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >② Which axis turns first?</text><text x="318" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The one d leans on most: asin|dy| =</text><text x="318" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >36.9° &gt; asin|dx| = 11.5° + 5° → the</text><text x="318" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >horizontal X axis first, with a 5° lead to</text><text x="318" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the vertical on a tie.</text><line x1="558" y1="120" x2="584" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="588" y="56" width="192" height="128" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="602" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ The two angles</text><text x="602" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >α = atan2(dy; dz) = 37.8°</text><text x="602" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >about X; then β = atan2(−dx;</text><text x="602" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >√(dy²+dz²)) = −11.5° about</text><text x="602" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Y.</text><rect x="20" y="204" width="760" height="150" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="230" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Why not the “shortest” rotation?</text><circle cx="42" cy="252" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="256" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The shortest turns about an oblique axis: on screen, the stack “tumbles” diagonally. Two rotations about the screen's axes</text><text x="54" y="272.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >read as one gesture with a slight correction.</text><circle cx="42" cy="284.16" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="288.16" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >No in-plane turn is added: the Z-stack takes the angle where the pose landed (Rotation slider).</text><circle cx="42" cy="299.76" r="3.5" fill="#3b5bdb" stroke="#3b5bdb" stroke-width="1" /><text x="54" y="303.76" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A stack already looking straight ahead (dx and dy ≈ 0) turns over by a half-turn about the vertical, never by numerical noise.</text><text x="54" y="320.32" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Animation: 1.5 s on opening, 1.2 s from the track, 1 s from the sample-side switch.</text></svg>