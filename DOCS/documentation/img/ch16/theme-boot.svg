<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Pourquoi le thème clair ne clignote pas</text>
<text x="24" y="62" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="start" xml:space="preserve">Chaque page est livrée en thème sombre. Un visiteur qui a choisi « clair » doit l'avoir</text>
<text x="24" y="80" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#4a5468" text-anchor="start" xml:space="preserve">AVANT le premier affichage :</text>
<rect x="16" y="96" width="176" height="140" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M16,130 L16,108 Q16,96 28,96 L180,96 Q192,96 192,108 L192,130 Z" fill="#eef0f5"/>
<text x="104.0" y="118" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">1. Le &lt;head&gt; se lit</text>
<text x="28" y="152.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">feuilles de style</text>
<text x="28" y="168.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">(thème sombre par défaut)</text>
<rect x="214" y="96" width="176" height="140" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M214,130 L214,108 Q214,96 226,96 L378,96 Q390,96 390,108 L390,130 Z" fill="#ebfbee"/>
<text x="302.0" y="118" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">2. theme-boot.js</text>
<text x="226" y="152.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">lit localStorage ;</text>
<text x="226" y="168.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">si « light » → data-theme</text>
<text x="226" y="184.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">passe à light</text>
<rect x="412" y="96" width="176" height="140" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M412,130 L412,108 Q412,96 424,96 L576,96 Q588,96 588,108 L588,130 Z" fill="#e8edff"/>
<text x="500.0" y="118" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">3. Premier affichage</text>
<text x="424" y="152.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">la page apparaît déjà</text>
<text x="424" y="168.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">dans le bon thème</text>
<rect x="610" y="96" width="176" height="140" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M610,130 L610,108 Q610,96 622,96 L774,96 Q786,96 786,108 L786,130 Z" fill="#f3f0ff"/>
<text x="698.0" y="118" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#7048e8" text-anchor="middle" xml:space="preserve">4. Fin du &lt;body&gt;</text>
<text x="622" y="152.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">theme.js branche le</text>
<text x="622" y="168.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">bouton, suit les autres</text>
<text x="622" y="184.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">onglets</text>
<line x1="194" y1="166" x2="214" y2="166" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="392" y1="166" x2="412" y2="166" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<line x1="590" y1="166" x2="610" y2="166" stroke="#4a5468" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="16" y="256" width="768" height="130" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="32" y="282" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Sans theme-boot.js : un visiteur « clair » verrait d'abord une page sombre, puis un éclair blanc.</text>
<text x="32" y="306" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Premier passage, sans choix mémorisé : le thème sombre (fort contraste pour la fluorescence).</text>
<text x="32" y="330" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Le panneau d'administration a son propre réglage (clé adm-theme), indépendant du site public.</text>
<text x="32" y="354" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• Si le navigateur bloque le stockage : la page garde son thème par défaut, sans erreur.</text>
</svg>
