<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 358" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="358" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The path of a gallery image</text><rect x="20" y="56" width="178" height="176" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >1 · Upload</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The administrator drops</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >an image (annotated</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >capture, figure). The body</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >travels raw, without</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >conversion.</text><line x1="200" y1="140" x2="212" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="214" y="56" width="178" height="176" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="228" y="80.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >2 · Checks</text><text x="228" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The type comes from the</text><text x="228" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >magic bytes (WebP, PNG,</text><text x="228" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >JPEG, GIF), never from</text><text x="228" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the name. At most 8 MiB,</text><text x="228" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >40 images per dataset.</text><line x1="394" y1="140" x2="406" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="408" y="56" width="178" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="422" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >3 · Storage</text><text x="422" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >gallery/&lt;name&gt;.ext, name</text><text x="422" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >sanitised. A 320 px</text><text x="422" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >thumbnail (WebP, else</text><text x="422" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >JPEG) in gallery/thumbs/.</text><text x="422" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Order and captions in</text><text x="422" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.json.</text><line x1="588" y1="140" x2="600" y2="140" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="602" y="56" width="178" height="176" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="616" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >4 · Display</text><text x="616" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >A dock in the canvas</text><text x="616" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >corner (3D and 2D):</text><text x="616" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >thumbnail grid, then</text><text x="616" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >full-screen lightbox. Three</text><text x="616" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >states: open, large, chip.</text><rect x="20" y="252" width="760" height="88" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="276" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >metadata.json keeps “gallery: [{ file, thumb, title, caption, added }]”: the catalogue carries it for free. On every save, the list is</text><text x="36" y="292.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >reconciled with the folder in both directions (an orphan file is added, an entry without file is removed). The dock remembers its</text><text x="36" y="309.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >state (key iribhm-gallery-dock).</text></svg>