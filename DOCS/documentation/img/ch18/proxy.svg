<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle">Derrière un proxy inverse : quelle adresse est « le visiteur » ?</text><rect x="24" y="70" width="170" height="74" rx="10" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.2"/><text x="109" y="103.125" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Visiteur</text><text x="109" y="119.625" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">203.0.113.7</text><rect x="318" y="70" width="170" height="74" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.2"/><text x="403" y="103.125" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Proxy inverse</text><text x="403" y="119.625" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">10.0.0.2</text><rect x="606" y="70" width="170" height="74" rx="10" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="691" y="103.125" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#1c2333" text-anchor="middle">Lumen3D</text><text x="691" y="119.625" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle">voit 10.0.0.2</text><line x1="196" y1="107" x2="316" y2="107" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><line x1="490" y1="107" x2="604" y2="107" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/><text x="500" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#4a5468" text-anchor="middle">X-Forwarded-For: 203.0.113.7</text><rect x="24" y="196" width="368" height="176" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.2"/><text x="40" y="224" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#c92a2a" text-anchor="start">Proxy non déclaré</text><text x="40" y="252" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">Tous les visiteurs ont l&#x27;adresse 10.0.0.2.</text><text x="40" y="274" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">Un seul compteur d&#x27;échecs de connexion :</text><text x="40" y="296" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">dix essais ratés par quelqu&#x27;un bloquent</text><text x="40" y="318" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">tout le monde pendant 15 minutes.</text><rect x="408" y="196" width="368" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><text x="424" y="224" font-family="Inter, sans-serif" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start">Proxy déclaré (--trusted-proxy 10.0.0.2)</text><text x="424" y="250" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">Chaque proxy AJOUTE l&#x27;adresse qu&#x27;il voit.</text><text x="424" y="272" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">On lit la liste à partir de la droite et on</text><text x="424" y="294" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">garde le premier saut non déclaré :</text><text x="424" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">1.2.3.4, 203.0.113.7  →  203.0.113.7</text><text x="424" y="338" font-family="Inter, sans-serif" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start">(1.2.3.4 a été écrit par le visiteur : ignoré)</text></svg>