<text x="89.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">variables.css</text>
<text x="89.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">valeurs d'usine</text>
<rect x="160" y="252" width="120" height="62" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/>
<text x="220.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">themes.css</text>
<text x="220.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">sombre / clair</text>
<rect x="286" y="252" width="150" height="62" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.8"/>
<text x="361.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">config/theme.css</text>
<text x="361.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">VOTRE marque</text>
<rect x="442" y="252" width="215" height="62" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/>
<text x="549.5" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">base · components · layout…</text>
<text x="549.5" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">mise en page</text>
<rect x="663" y="252" width="109" height="62" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/>
<text x="717.5" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">tools.css</text>
<text x="717.5" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">outils</text>
<rect x="24" y="334" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="40" y="358" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">Un fichier servi (pas un &lt;style&gt; injecté) : la politique de sécurité du site interdit les styles injectés.</text>
<text x="40" y="378" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">Donc le thème est là dès le premier affichage. L'aperçu, lui, change les variables une à une.</text>
