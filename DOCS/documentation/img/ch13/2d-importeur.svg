<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="410" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >L'importeur 2D : un TIFF d'ImageJ → un jeu de données</text><rect x="20" y="56" width="230" height="232" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Le fichier d'entrée</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >TIFF exporté d'ImageJ/Fiji depuis</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >un .lif Leica : trois plans 8 bits (R, V,</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >B) avec leurs tables de couleur, ou</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >un RGB, ou un niveau de gris. Les</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >balises lues : résolution X/Y (282,</text><text x="34" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >283), description (270), bloc</text><text x="34" y="200.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ImageJ (50839) avec le texte</text><text x="34" y="217.27" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Leica.</text><line x1="254" y1="172" x2="290" y2="172" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="294" y="56" width="236" height="232" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="308" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >Ce qui est calculé</text><text x="308" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Composite additif : sortie = Σ</text><text x="308" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >table_c[plan_c]. Taille de pixel = 1 /</text><text x="308" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >résolution, seulement si l'unité est le</text><text x="308" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >micron. Réglages Leica : zoom,</text><text x="308" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >objectif, exposition, gain… Stade,</text><text x="308" y="184.15" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >zoom, date et ligne lus dans le nom</text><text x="308" y="200.71" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >du fichier.</text><line x1="534" y1="172" x2="568" y2="172" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="572" y="56" width="208" height="232" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="586" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >DATA_WEB/2d/&lt;jeu&gt;/</text><text x="586" y="112" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >image.webp  (natif, q 90)</text><text x="586" y="142" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >preview.webp  (640 px)</text><text x="586" y="172" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >thumbnail.webp  (512²)</text><text x="586" y="202" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >metadata.json</text><text x="586" y="232" font-size="12" font-weight="700" fill="#1c2333" text-anchor="start" >download/  (option)</text><rect x="20" y="306" width="760" height="88" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="330" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Exemple : « DLL4xCD1 - E9.5 x3.2 240913 1.tif » → dossier DLL4xCD1-E95-x3.2-240913-1, stade E9.5, ligne DLL4xCD1, zoom</text><text x="36" y="346.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >×3,2, dissection le 2024-09-13, index 1. Rien n'est deviné : ce que le fichier ne dit pas (coloration, ligne) vient de la ligne de</text><text x="36" y="363.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >commande, et --force garde ce que le laboratoire a corrigé à la main.</text></svg>