<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="206" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The three sources of a point, in order</text><rect x="20" y="56" width="242" height="132" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >1 · A projection wall</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >If the grid is on and the ray hits one</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >of its walls: source “projection”. The</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >point lands on the wall, not on the</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >specimen.</text><rect x="279" y="56" width="242" height="132" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="293" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >2 · The volume (GPU read)</text><text x="293" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >The normal case: source “volume”,</text><text x="293" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >the depth of the first visible structure.</text><rect x="538" y="56" width="242" height="132" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="552" y="80.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >3 · The box (fallback)</text><text x="552" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Nothing visible, or no GPU read</text><text x="552" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >possible: source “bounding-box”,</text><text x="552" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >where the ray enters the box. The</text><text x="552" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >measure tool refuses this point.</text></svg>