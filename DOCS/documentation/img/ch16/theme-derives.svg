<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="340" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">Un seul clic de couleur, cinq réglages dérivés</text>
<rect x="24" y="62" width="140" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="34" y="72" width="120" height="34" rx="8" fill="#2F6BFF" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="94" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">#2F6BFF</text>
<text x="94" y="152" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">…primary</text>
<text x="94" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">votre choix</text>
<rect x="176" y="62" width="140" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="186" y="72" width="120" height="34" rx="8" fill="#5888FF" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="246" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">#5888FF</text>
<text x="246" y="152" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">…primary-hover</text>
<text x="246" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">+ 8 de clarté</text>
<rect x="328" y="62" width="140" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="338" y="72" width="120" height="34" rx="8" fill="#0048FB" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="398" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">#0048FB</text>
<text x="398" y="152" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">…primary-dark</text>
<text x="398" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">− 10 de clarté</text>
<rect x="480" y="62" width="140" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="490" y="72" width="120" height="34" rx="8" fill="rgb(47,107,255)" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="490" y="72" width="120" height="34" rx="8" fill="#fff"/><rect x="490" y="72" width="120" height="34" rx="8" fill="rgba(47,107,255,0.15)" stroke="#c5cbd8"/>
<text x="550" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">rgba(…, .15)</text>
<text x="550" y="152" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">…primary-subtle</text>
<text x="550" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">15 % d'opacité</text>
<rect x="632" y="62" width="140" height="74" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<rect x="642" y="72" width="120" height="34" rx="8" fill="#2452C4" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="702" y="124" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="400" fill="#1c2333" text-anchor="middle" xml:space="preserve">#2452C4</text>
<text x="702" y="152" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#4a5468" text-anchor="middle" xml:space="preserve">…primary-strong</text>
<text x="702" y="168" font-family="Inter, sans-serif" font-size="11" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">77 % de noir mélangé</text>
<rect x="24" y="188" width="752" height="128" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="40" y="212" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• hover, dark : la clarté (HSL) est décalée de +8 / −10 points, comme dans le code de l'éditeur.</text>
<text x="40" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• subtle : la même couleur à 15 % d'opacité (fonds discrets, pastilles).</text>
<text x="40" y="256" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">• strong : pour les boutons pleins à texte blanc ; calculé par le navigateur (color-mix), il fonce seulement.</text>
<text x="40" y="278" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">Valeurs de l'exemple : base #2F6BFF, hover #5888FF, dark #0048FB, strong #2452C4, strong-hover #1E44A3.</text>
</svg>
