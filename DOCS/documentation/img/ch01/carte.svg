<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 706" font-family="Inter, sans-serif">
<rect width="800" height="706" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Carte de la documentation : quelle question, quel chapitre ?</text>
<rect x="24" y="52" width="752" height="88" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="52" width="170" height="88" rx="12" fill="#e8edff"/>
<text x="109" y="94.0" text-anchor="middle" font-size="14" font-weight="800" fill="#3b5bdb">Découvrir</text>
<text x="109" y="112.0" text-anchor="middle" font-size="11" fill="#4a5468">chapitres 1 à 3</text>
<text x="208" y="76" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">1</tspan><tspan dx="8">À quoi sert Lumen3D ? Quels types de données ?</tspan></text>
<text x="208" y="100" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">2</tspan><tspan dx="8">Quelles technologies, et à quoi servent-elles ?</tspan></text>
<text x="208" y="124" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">3</tspan><tspan dx="8">Où cliquer ? À quoi ressemble chaque page ?</tspan></text>
<rect x="24" y="150" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="150" width="170" height="136" rx="12" fill="#ebfbee"/>
<text x="109" y="216.0" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">Préparer</text>
<text x="109" y="234.0" text-anchor="middle" font-size="11" fill="#4a5468">Python, chapitres 4 à 8</text>
<text x="208" y="174" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">4</tspan><tspan dx="8">Que contient un fichier Imaris ?</tspan></text>
<text x="208" y="198" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">5</tspan><tspan dx="8">Comment le bruit de fond est-il retiré ?</tspan></text>
<text x="208" y="222" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">6</tspan><tspan dx="8">Comment passer de 14 Go à quelques centaines de Mo ?</tspan></text>
<text x="208" y="246" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">7</tspan><tspan dx="8">Que sont les briques, les packs, les niveaux de détail ?</tspan></text>
<text x="208" y="270" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">8</tspan><tspan dx="8">Métadonnées, suivi cellulaire, publication sans risque</tspan></text>
<rect x="24" y="296" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="296" width="170" height="136" rx="12" fill="#e3fafc"/>
<text x="109" y="362.0" text-anchor="middle" font-size="14" font-weight="800" fill="#0c8599">Afficher</text>
<text x="109" y="380.0" text-anchor="middle" font-size="11" fill="#4a5468">le navigateur, chapitres 9 à 13</text>
<text x="208" y="320" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">9</tspan><tspan dx="8">Comment l'image 3D est-elle calculée ?</tspan></text>
<text x="208" y="344" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">10</tspan><tspan dx="8">Comment afficher des gigaoctets sans attendre ?</tspan></text>
<text x="208" y="368" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">11</tspan><tspan dx="8">Couleurs, contrastes, histogrammes : que signifient-ils ?</tspan></text>
<text x="208" y="392" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">12</tspan><tspan dx="8">Que fait chaque outil de la barre d'outils ?</tspan></text>
<text x="208" y="416" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">13</tspan><tspan dx="8">Comment les outils fonctionnent-ils sous le capot ?</tspan></text>
<rect x="24" y="442" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="442" width="170" height="136" rx="12" fill="#f3f0ff"/>
<text x="109" y="508.0" text-anchor="middle" font-size="14" font-weight="800" fill="#7048e8">Administrer</text>
<text x="109" y="526.0" text-anchor="middle" font-size="11" fill="#4a5468">et étendre, chapitres 14 à 18</text>
<text x="208" y="466" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">14</tspan><tspan dx="8">Que peut faire l'administrateur ? (aperçu)</tspan></text>
<text x="208" y="490" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">15</tspan><tspan dx="8">Plugins : installation, confiance, catalogue signé</tspan></text>
<text x="208" y="514" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">16</tspan><tspan dx="8">Changer le nom, les couleurs, les langues, les pages</tspan></text>
<text x="208" y="538" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">17</tspan><tspan dx="8">Fichiers, formats, conversions et import en détail</tspan></text>
<text x="208" y="562" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">18</tspan><tspan dx="8">Héberger, mettre à jour, publier une version</tspan></text>
<rect x="24" y="588" width="752" height="88" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="588" width="170" height="88" rx="12" fill="#fff4e6"/>
<text x="109" y="630.0" text-anchor="middle" font-size="14" font-weight="800" fill="#e67700">Se fier</text>
<text x="109" y="648.0" text-anchor="middle" font-size="11" fill="#4a5468">et retrouver, chapitres 19 à 21</text>
<text x="208" y="612" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">19</tspan><tspan dx="8">Mes données sont-elles protégées ? Que se passe-t-il en cas de panne ?</tspan></text>
<text x="208" y="636" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">20</tspan><tspan dx="8">Où est quoi dans le code ? Que ne fait-il pas ? Quels chiffres ?</tspan></text>
<text x="208" y="660" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">21</tspan><tspan dx="8">Que veut dire ce mot ? (glossaire)</tspan></text>
</svg>
