or="start">•</text><text x="314" y="342" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">php -S to test</text><path d="M400,98 V116 H660 V132" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="544" y="134" width="232" height="250" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/><path d="M544,168 V146 a12,12 0 0 1 12,-12 H764 a12,12 0 0 1 12,12 V168 Z" fill="#eef0f5"/><text x="660" y="158" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="middle">Files only</text><text x="660" y="192" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">static storage, GitHub Pages…</text><rect x="558" y="206" width="204" height="30" rx="8" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/><text x="660" y="226" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#4a5468" text-anchor="middle">no program</text><text x="560" y="266" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="266" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">no administration</text><text x="560" y="304" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="304" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">no generated catalogue</text><text x="560" y="342" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#4a5468" text-anchor="start">•</text><text x="574" y="342" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">no nonce CSP</text><text x="400" y="414" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle">fast_server.py: 