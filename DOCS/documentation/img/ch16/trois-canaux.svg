<text x="289" y="194" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#4a5468" text-anchor="start">Ce qu'il fait</text>
<text x="289" y="212" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">Écrit la valeur dans l'élément :</text>
