<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
<rect width="800" height="480" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The fate of a voxel: one question decides everything</text>
<rect x="250" y="56" width="300" height="40" rx="10" fill="#fff" stroke="#4a5468" stroke-width="1.4" />
<text x="400" y="81" font-size="14" font-weight="700" fill="#1c2333" text-anchor="middle" >a voxel of the raw volume (16 bits)</text>
<line x1="400" y1="96" x2="400" y2="116" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<polygon points="400,118 560,160 400,202 240,160" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8"/>
<text x="400" y="157" font-size="15" font-weight="800" fill="#3b5bdb" text-anchor="middle" >Is it inside the mask?</text>
<text x="400" y="177" font-size="11.5" font-weight="500" fill="#4a5468" text-anchor="middle" >(embryo + 3-voxel halo)</text>
<line x1="240" y1="160" x2="170" y2="160" stroke="#4a5468" stroke-width="2"/>
<line x1="170" y1="160" x2="170" y2="222" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<text x="205.0" y="152" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >YES</text>
<line x1="560" y1="160" x2="630" y2="160" stroke="#4a5468" stroke-width="2"/>
<line x1="630" y1="160" x2="630" y2="222" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<text x="595.0" y="152" font-size="13" font-weight="800" fill="#e67700" text-anchor="middle" >NO</text>
<rect x="45" y="224" width="250" height="54" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.6" />
<text x="170" y="247" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >original value kept</text>
<text x="170" y="267" font-size="12" font-weight="500" fill="#4a5468" text-anchor="middle" >nothing is changed</text>
<line x1="170" y1="278" x2="170" y2="298" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="45" y="300" width="250" height="44" rx="12" fill="#fff" stroke="#c92a2a" stroke-width="1.4" />
<text x="170" y="320" font-size="13.5" font-weight="700" fill="#c92a2a" text-anchor="middle" >window 16 → 8 bits</text>
<text x="170" y="337" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle" >floor → 0, ceiling → 255</text>
<line x1="170" y1="344" x2="170" y2="362" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="45" y="364" width="250" height="50" rx="12" fill="#fff" stroke="#1c2333" stroke-width="1.6" />
<text x="170" y="386" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="middle" >the signal, intact</text>
<text x="170" y="404" font-size="11.5" font-weight="500" fill="#4a5468" text-anchor="middle" >stretched between 0 and 255</text>
<rect x="505" y="224" width="250" height="54" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6" />
<text x="630" y="247" font-size="14" font-weight="800" fill="#e67700" text-anchor="middle" >replaced by the median</text>
<text x="630" y="267" font-size="12" font-weight="500" fill="#4a5468" text-anchor="middle" >of its 27 neighbours</text>
<line x1="630" y1="278" x2="630" y2="298" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="505" y="300" width="250" height="44" rx="12" fill="#fff" stroke="#c92a2a" stroke-width="1.4" />
<text x="630" y="320" font-size="13.5" font-weight="700" fill="#c92a2a" text-anchor="middle" >window 16 → 8 bits</text>
<text x="630" y="337" font-size="11" font-weight="500" fill="#4a5468" text-anchor="middle" >floor → 0, ceiling → 255</text>
<line x1="630" y1="344" x2="630" y2="362" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/>
<rect x="505" y="364" width="250" height="50" rx="12" fill="#1c2333" stroke="#1c2333" stroke-width="1.6" />
<text x="630" y="386" font-size="13.5" font-weight="800" fill="#fff" text-anchor="middle" >almost always below</text>
<text x="630" y="404" font-size="11.5" font-weight="500" fill="#d0d6e2" text-anchor="middle" >the floor → 0 (black)</text>
<rect x="30" y="230" width="0" height="0" rx="10" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" />
<text x="170" y="438" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="middle" >13.9 % of the voxels</text>
<text x="630" y="434" font-size="12" font-weight="700" fill="#1c2333" text-anchor="middle" >85.1 %: background below the floor</text>
<text x="630" y="450" font-size="12" font-weight="700" fill="#e67700" text-anchor="middle" >1.0 %: noise peaks above the floor</text>
<text x="630" y="465" font-size="12" font-weight="700" fill="#e67700" text-anchor="middle" >and isolated hot pixels</text>
<text x="170" y="465" font-size="9.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Demo set, DAPI channel, 49.5 million voxels</text>
</svg>
