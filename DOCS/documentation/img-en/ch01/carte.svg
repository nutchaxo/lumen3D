<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 706" font-family="Inter, sans-serif">
<rect width="800" height="706" rx="16" fill="#f8f9fd"/>
<text x="400" y="34" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Documentation map: which question, which chapter?</text>
<rect x="24" y="52" width="752" height="88" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="52" width="170" height="88" rx="12" fill="#e8edff"/>
<text x="109" y="94.0" text-anchor="middle" font-size="14" font-weight="800" fill="#3b5bdb">Discover</text>
<text x="109" y="112.0" text-anchor="middle" font-size="11" fill="#4a5468">chapters 1 to 3</text>
<text x="208" y="76" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">1</tspan><tspan dx="8">What is Lumen3D for? Which data types?</tspan></text>
<text x="208" y="100" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">2</tspan><tspan dx="8">Which technologies, and what are they for?</tspan></text>
<text x="208" y="124" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#3b5bdb">3</tspan><tspan dx="8">Where to click? What does each page look like?</tspan></text>
<rect x="24" y="150" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="150" width="170" height="136" rx="12" fill="#ebfbee"/>
<text x="109" y="216.0" text-anchor="middle" font-size="14" font-weight="800" fill="#2b8a3e">Prepare</text>
<text x="109" y="234.0" text-anchor="middle" font-size="11" fill="#4a5468">Python, chapters 4 to 8</text>
<text x="208" y="174" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">4</tspan><tspan dx="8">What is inside an Imaris file?</tspan></text>
<text x="208" y="198" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">5</tspan><tspan dx="8">How is the background noise removed?</tspan></text>
<text x="208" y="222" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">6</tspan><tspan dx="8">How do you go from 14 GB to a few hundred MB?</tspan></text>
<text x="208" y="246" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">7</tspan><tspan dx="8">What are bricks, packs and levels of detail?</tspan></text>
<text x="208" y="270" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#2b8a3e">8</tspan><tspan dx="8">Metadata, cell tracking, risk-free publishing</tspan></text>
<rect x="24" y="296" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="296" width="170" height="136" rx="12" fill="#e3fafc"/>
<text x="109" y="362.0" text-anchor="middle" font-size="14" font-weight="800" fill="#0c8599">Display</text>
<text x="109" y="380.0" text-anchor="middle" font-size="11" fill="#4a5468">the browser, chapters 9 to 13</text>
<text x="208" y="320" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">9</tspan><tspan dx="8">How is the 3D image computed?</tspan></text>
<text x="208" y="344" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">10</tspan><tspan dx="8">How to display gigabytes without waiting?</tspan></text>
<text x="208" y="368" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">11</tspan><tspan dx="8">Colours, contrast, histograms: what do they mean?</tspan></text>
<text x="208" y="392" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">12</tspan><tspan dx="8">What does each toolbar tool do?</tspan></text>
<text x="208" y="416" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#0c8599">13</tspan><tspan dx="8">How do the tools work under the hood?</tspan></text>
<rect x="24" y="442" width="752" height="136" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="442" width="170" height="136" rx="12" fill="#f3f0ff"/>
<text x="109" y="508.0" text-anchor="middle" font-size="14" font-weight="800" fill="#7048e8">Administer</text>
<text x="109" y="526.0" text-anchor="middle" font-size="11" fill="#4a5468">and extend, chapters 14 to 18</text>
<text x="208" y="466" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">14</tspan><tspan dx="8">What can the administrator do? (overview)</tspan></text>
<text x="208" y="490" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">15</tspan><tspan dx="8">Plugins: installation, trust, signed catalog</tspan></text>
<text x="208" y="514" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">16</tspan><tspan dx="8">Change the name, colours, languages, pages</tspan></text>
<text x="208" y="538" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">17</tspan><tspan dx="8">Files, formats, conversions and import in depth</tspan></text>
<text x="208" y="562" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#7048e8">18</tspan><tspan dx="8">Host, update, publish a release</tspan></text>
<rect x="24" y="588" width="752" height="88" rx="12" fill="#fff" stroke="#c5cbd8"/>
<rect x="24" y="588" width="170" height="88" rx="12" fill="#fff4e6"/>
<text x="109" y="630.0" text-anchor="middle" font-size="14" font-weight="800" fill="#e67700">Trust</text>
<text x="109" y="648.0" text-anchor="middle" font-size="11" fill="#4a5468">and look up, chapters 19 to 21</text>
<text x="208" y="612" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">19</tspan><tspan dx="8">Is my data protected? What happens when something fails?</tspan></text>
<text x="208" y="636" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">20</tspan><tspan dx="8">What is where in the code? What does it not do? Which figures?</tspan></text>
<text x="208" y="660" font-size="12.5" fill="#1c2333"><tspan font-weight="800" fill="#e67700">21</tspan><tspan dx="8">What does this word mean? (glossary)</tspan></text>
</svg>
