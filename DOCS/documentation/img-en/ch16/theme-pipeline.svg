<text x="313.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#3b5bdb" text-anchor="middle" xml:space="preserve">theme.json</text>
<text x="240" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">{ "tokens": {</text>
<text x="240" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">  "--color-primary":</text>
<text x="240" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">    "#2F6BFF" } }</text>
<text x="240" y="160.60000000000002" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">only what changed</text>
<line x1="402" y1="130" x2="436" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="440" y="56" width="170" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M440,90 L440,68 Q440,56 452,56 L598,56 Q610,56 610,68 L610,90 Z" fill="#ebfbee"/>
<text x="525.0" y="78" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#2b8a3e" text-anchor="middle" xml:space="preserve">The server compiles</text>
<text x="452" y="112.0" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">scrubs every value</text>
<text x="452" y="128.2" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">(no { } ; @ &lt; &gt;)</text>
<text x="452" y="144.4" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">→ :root { … }</text>
<line x1="614" y1="130" x2="648" y2="130" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)"/>
<rect x="652" y="56" width="132" height="150" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<path d="M652,90 L652,68 Q652,56 664,56 L772,56 Q784,56 784,68 L784,90 Z" fill="#fff4e6"/>
