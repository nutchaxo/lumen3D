<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 326" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="326" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Où vit ce que vous réglez ?</text><rect x="20" y="56" width="182" height="168" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >La mémoire de la page</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Mesures, historique du</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Studio, atlas de la carte</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >graphique, tampons de</text><text x="34" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >briques. Disparaît quand</text><text x="34" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l'onglet se ferme.</text><rect x="212" y="56" width="182" height="168" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="226" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >L'adresse (#state=)</text><text x="226" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Caméra, canaux, outil,</text><text x="226" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >plan de coupe, mesures,</text><text x="226" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >image de la série. Se</text><text x="226" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >copie, s'envoie, se met en</text><text x="226" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >favori.</text><rect x="404" y="56" width="182" height="168" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.4" /><text x="418" y="80.8" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >Le navigateur</text><text x="418" y="98.35" font-size="13.5" font-weight="800" fill="#e67700" text-anchor="start" >(localStorage)</text><text x="418" y="118.9" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Vos préférences : thème,</text><text x="418" y="135.46" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >langue, daltonisme, vitesse</text><text x="418" y="152.02" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >de la frise, étirement Z… et</text><text x="418" y="168.58" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >les espaces de travail de</text><text x="418" y="185.14" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Comparer.</text><rect x="596" y="56" width="182" height="168" rx="12" fill="#f1f3f5" stroke="#4a5468" stroke-width="1.4" /><text x="610" y="80.8" font-size="13.5" font-weight="800" fill="#4a5468" text-anchor="start" >Le serveur</text><text x="610" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Rien de ce que vous</text><text x="610" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >réglez. Seulement des</text><text x="610" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >compteurs anonymes (une</text><text x="610" y="151.03" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >vue par jeu et par</text><text x="610" y="167.59" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >session).</text><rect x="20" y="242" width="760" height="64" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="266" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Le viewer n'a pas de bouton « Sauvegarder » : l'adresse sert de sauvegarde. Navigation privée ou stockage bloqué : tout</text><text x="36" y="283.25" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >est protégé par des try/catch ; la page marche, elle oublie simplement vos préférences.</text></svg>