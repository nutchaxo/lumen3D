<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="Inter, sans-serif">
  <rect width="800" height="330" rx="16" fill="#f8f9fd"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="800" fill="#1c2333">Pourquoi un navigateur ne peut pas « simplement ouvrir » la pile</text>
  <text x="400" y="54" text-anchor="middle" font-size="12.5" fill="#4a5468">Exemple réel : embryon 3789 × 3789 × 178 voxels, 4 canaux (jeu de référence du pipeline)</text>

  <!-- bars: 1 Go = 38.9 px, origin x=250 -->
  <g font-size="13" fill="#1c2333">
    <text x="236" y="98" text-anchor="end" font-weight="700">Fichier Imaris (.ims)</text>
    <rect x="250" y="80" width="518" height="28" rx="6" fill="#e67700"/>
    <text x="260" y="99" font-size="13" font-weight="800" fill="#fff">14,4 Go</text>

    <text x="236" y="140" text-anchor="end" font-weight="700">Pile en mémoire (1 octet/voxel)</text>
    <rect x="250" y="122" width="367" height="28" rx="6" fill="#c92a2a"/>
    <text x="260" y="141" font-weight="800" fill="#fff">10,2 Go (4 × 2,56 Go)</text>

    <text x="236" y="198" text-anchor="end" font-weight="700">Mémoire de la carte graphique</text>
    <text x="236" y="214" text-anchor="end" font-size="11.5" fill="#4a5468">(budget retenu par la plateforme)</text>
    <rect x="250" y="166" width="144" height="22" rx="6" fill="#2b8a3e"/>
    <text x="402" y="182" font-size="12.5" fill="#1c2333">carte dédiée : 3 à 4 Go</text>
    <rect x="250" y="194" width="72" height="22" rx="6" fill="#3b5bdb"/>
    <text x="330" y="210" font-size="12.5" fill="#1c2333">portable (intégrée) : 0,5 à 2 Go</text>
    <rect x="250" y="222" width="9" height="22" rx="4" fill="#7048e8"/>
    <text x="267" y="238" font-size="12.5" fill="#1c2333">sans carte graphique (rendu logiciel) : 0,25 Go</text>
  </g>
  <line x1="250" y1="70" x2="250" y2="250" stroke="#c5cbd8" stroke-width="1.5"/>

  <rect x="40" y="268" width="720" height="44" rx="12" fill="#fff4e6" stroke="#e67700"/>
  <text x="400" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#1c2333">Conclusion : il faut découper, réduire et ne charger que ce que l'écran montre.</text>
  <text x="400" y="304" text-anchor="middle" font-size="12" fill="#4a5468">À ~5 Mo/s (débit mesuré sur un hébergeur), télécharger 10 Go d'un coup prendrait plus d'une demi-heure.</text>
</svg>
