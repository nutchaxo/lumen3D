<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{SITE:pageTitles.compare|Compare - Lumen3D}}</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="js/vendor/lucide.min.js" integrity="sha384-tTkFttkBclaU1cloKwOi9xk3pbao3VZxTjLNBt8iFABWDBQibbAbWpVmO28zMuxq" crossorigin="anonymous"></script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="config/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/viewer.css">

  <style nonce="{{CSP_NONCE}}">
    /* The page toggles visibility with the `hidden` attribute; a display rule on
       a class (.btn is inline-flex) would otherwise outrank the user-agent's. */
    [hidden] { display: none !important; }

    .compare-layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-surface);
    }

    .compare-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-3) var(--space-6);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-light);
      z-index: 10;
    }

    .compare-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-2) var(--space-4);
      padding: var(--space-2) var(--space-6);
      background: var(--bg-surface-2);
      border-bottom: 1px solid var(--border-light);
      z-index: 9;
    }

    .compare-toolbar-left,
    .compare-toolbar-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .compare-tool-chips {
      display: flex;
      gap: 4px;
      padding-left: 12px;
      border-left: 1px solid var(--border-light);
    }

    .compare-toolbar .btn-sm i { width: 16px; height: 16px; }

    .compare-sync {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }

    .compare-sync label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: var(--text-sm);
    }

    .compare-grid {
      flex: 1;
      display: grid;
      gap: 2px;
      background: var(--border-light);
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    /* Dynamic Grid Layouts */
    .compare-grid.layout-0 { display: flex; align-items: center; justify-content: center; }
    .compare-grid.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .compare-grid.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .compare-grid.layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .compare-grid.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    /* Three panels: the first one takes the whole top row (the empty-state node
       is the grid's first child, so the first PANEL is marked, not :first-child). */
    .compare-grid.layout-3 > .compare-panel[data-first] { grid-column: span 2; }
    .compare-grid.layout-custom > .compare-panel[data-first] { grid-column: auto; }

    .compare-header h1 { font-size: var(--text-xl); margin: 0; }
    .modal-header h2 { font-size: var(--text-lg); margin: 0; }
    #empty-state i { width: 64px; height: 64px; opacity: 0.2; }

    .compare-panel {
      position: relative;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
    }

    .panel-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 8px 12px;
      /* The page's own ground, faded: legible on a black volume and on a white
         photograph alike, in both themes. */
      background: linear-gradient(180deg, color-mix(in srgb, var(--bg-body) 82%, transparent) 0%, transparent 100%);
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }

    .panel-header > * { pointer-events: auto; }

    .panel-title-badge {
      background: var(--bg-surface-3);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: 500;
      backdrop-filter: blur(4px);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .panel-actions .btn-settings.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    /* The toggles the panel's own toolbar would show, drawn here by the host. */
    .panel-toggles {
      display: flex;
      gap: 4px;
    }

    .panel-toggles:empty { display: none; }

    .panel-content {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    .panel-tool-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-md);
      background: color-mix(in srgb, var(--bg-surface) 80%, transparent);
      backdrop-filter: blur(6px);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      padding: 0;
    }

    .panel-tool-btn i { width: 15px; height: 15px; }

    .panel-tool-btn:hover {
      background: color-mix(in srgb, var(--bg-surface) 95%, transparent);
      color: var(--text-primary);
      border-color: var(--border-default);
    }

    .panel-tool-btn.btn-solid {
      background: var(--color-primary);
      color: #fff;
      border-color: var(--color-primary);
    }

    .panel-tool-btn.btn-solid:hover {
      background: var(--color-primary-hover, var(--color-primary));
      color: #fff;
    }

    .panel-load-state {
      position: absolute;
      left: var(--space-4);
      bottom: var(--space-4);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      background: color-mix(in srgb, var(--bg-surface) 88%, transparent);
      backdrop-filter: blur(6px);
      font-size: var(--text-xs);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .panel-load-state i { width: 14px; height: 14px; }

    iframe.viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .compare-split-handle {
      position: absolute;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
    }

    .compare-split-handle::before {
      content: "";
      display: block;
      border-radius: var(--radius-full);
      background: var(--text-secondary);
      box-shadow: 0 0 0 1px var(--bg-body);
      opacity: 0.5;
      transition: opacity var(--transition-fast), background var(--transition-fast), transform var(--transition-fast);
    }

    .compare-split-handle:hover::before,
    .compare-split-handle.is-dragging::before {
      opacity: 1;
      background: var(--color-primary);
      transform: scale(1.2);
    }

    .compare-split-handle.vertical {
      top: 0;
      bottom: 0;
      width: 18px;
      transform: translateX(-9px);
      cursor: col-resize;
    }

    .compare-split-handle.vertical::before {
      width: 3px;
      height: 64px;
      max-height: 40%;
    }

    .compare-split-handle.horizontal {
      left: 0;
      right: 0;
      height: 18px;
      transform: translateY(-9px);
      cursor: row-resize;
    }

    .compare-split-handle.horizontal::before {
      width: 64px;
      max-width: 40%;
      height: 3px;
    }

    body.compare-dragging {
      user-select: none;
    }

    body.compare-dragging iframe.viewer-frame {
      pointer-events: none;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none; align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      width: 860px; max-width: 92vw;
      height: 640px; max-height: 90vh;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-xl);
    }
    .modal-header {
      padding: var(--space-4);
      border-bottom: 1px solid var(--border-light);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-filters {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--border-light);
    }
    .modal-filters .form-input { flex: 1; min-width: 160px; }
    .modal-type-chips { display: flex; gap: 4px; flex-wrap: wrap; }
    .modal-type-chip {
      border: 1px solid var(--border-light);
      background: transparent;
      color: var(--text-secondary);
      border-radius: var(--radius-full);
      padding: 4px 10px;
      font-size: var(--text-xs);
      cursor: pointer;
    }
    .modal-type-chip.is-active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .modal-body {
      padding: var(--space-4);
      overflow-y: auto;
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--space-4);
      align-content: start;
    }
    .modal-empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: var(--space-8);
    }

    .dataset-mini-card {
      background: var(--bg-surface-2);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .dataset-mini-card:hover,
    .dataset-mini-card:focus-visible {
      border-color: var(--color-primary);
      transform: translateY(-2px);
      outline: none;
    }
    .dataset-mini-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
    }
    .dataset-mini-card .card-type {
      font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-bottom: 4px; display: inline-block;
    }
  </style>
</head>
<body data-page="compare">

  <div class="compare-layout">

    <!-- Header -->
    <header class="compare-header">
      <div class="flex items-center gap-4">
        <a href="explorer.html" class="btn btn-icon btn-ghost" data-i18n-title="nav.back" aria-label="Back" data-i18n-aria="nav.back">
          <i data-lucide="arrow-left"></i>
        </a>
        <h1 class="text-xl font-bold" data-i18n="compare.title">Comparison Mode</h1>
      </div>
      <div class="flex items-center gap-2">
        <!-- Language Switcher (items generated by Utils.populateLanguageMenu) -->
        <div class="dropdown" id="lang-dropdown">
          <button class="btn btn-icon btn-ghost" data-action="lang-dropdown" data-i18n-title="lang.switch">
            <i data-lucide="languages" style="width:20px;height:20px"></i>
          </button>
          <div class="dropdown-menu"></div>
        </div>
        <a class="btn btn-icon btn-ghost" href="about.html" title="Help and methods" data-i18n-title="tips.help" aria-label="Help and methods" data-i18n-aria="tips.help">
          <i data-lucide="help-circle"></i>
        </a>
        <button class="btn btn-icon btn-ghost" data-action="colorblind" data-i18n-title="colorblind.toggle">
          <i data-lucide="eye" style="width:20px;height:20px"></i>
        </button>
        <button class="btn btn-icon btn-ghost" data-action="theme-toggle" data-i18n-title="theme.toggle" id="theme-toggle">
          <i data-lucide="moon" data-theme-icon></i>
        </button>
      </div>
    </header>

    <!-- Toolbar -->
    <div class="compare-toolbar">
      <div class="compare-toolbar-left">
        <button class="btn btn-primary btn-sm flex items-center gap-2" id="btn-add-dataset">
          <i data-lucide="plus"></i> <span data-i18n="compare.addDataset">Add Dataset</span>
        </button>
        <!-- Tool chips: navigate is static; the others are the union of the tools the
             open panels offer (their own measure / slice / … plugins), added by JS. -->
        <div class="compare-tool-chips" id="compare-tool-chips">
          <button class="btn btn-icon btn-ghost tool-chip active" data-tool="navigate" title="Navigate" data-i18n-title="tips.navigate" aria-label="Navigate" data-i18n-aria="tips.navigate">
            <i data-lucide="mouse-pointer-2"></i>
          </button>
        </div>

        <button class="btn btn-outline btn-sm flex items-center gap-2" id="btn-decompose" data-i18n-title="tips.decompPanels" hidden>
          <i data-lucide="split-square-horizontal"></i> <span data-i18n="compare.decompose">Decompose</span>
        </button>
        <button class="btn btn-outline btn-sm flex items-center gap-2" id="btn-compare-studio" data-i18n-title="compare.studioHint" disabled>
          <i data-lucide="pen-tool"></i> <span data-i18n="compare.studio">Studio</span>
        </button>
        <button class="btn btn-outline btn-sm flex items-center gap-2" id="btn-export-compare">
          <i data-lucide="download"></i> <span data-i18n="compare.export">Export</span>
        </button>
        <button class="btn btn-outline btn-sm flex items-center gap-2" id="btn-save-compare-workspace">
          <i data-lucide="save"></i> <span data-i18n="compare.save">Save</span>
        </button>
        <button class="btn btn-outline btn-sm flex items-center gap-2" id="btn-restore-compare-workspace">
          <i data-lucide="folder-open"></i> <span data-i18n="compare.restore">Restore</span>
        </button>
        <select class="btn btn-outline btn-sm" id="compare-layout-mode" data-i18n-title="tips.panelLayout">
          <option value="auto" selected data-i18n="compare.layoutAuto">Auto layout</option>
          <option value="columns" data-i18n="compare.layoutCols">Columns</option>
          <option value="rows" data-i18n="compare.layoutRows">Rows</option>
          <option value="grid" data-i18n="compare.layoutGrid">Grid</option>
        </select>
        <select class="btn btn-outline btn-sm" id="compare-quality" data-i18n-title="compare.qualityHint">
          <option value="auto" selected data-i18n="compare.qualityAuto">Auto quality</option>
          <option value="512x512">512x512</option>
          <option value="1024x1024">1024x1024</option>
          <option value="native" data-i18n="viewer.native">Native</option>
        </select>
      </div>

      <div class="compare-toolbar-right compare-sync">
        <span class="text-sm text-muted font-semibold" data-i18n="compare.syncTitle">SYNC</span>
        <label><input type="checkbox" id="sync-z" checked> <span data-i18n="compare.syncZ">Z-Stack</span></label>
        <label><input type="checkbox" id="sync-time" checked> <span data-i18n="compare.syncTime">Time</span></label>
        <label><input type="checkbox" id="sync-camera" checked> <span data-i18n="compare.syncCamera">Camera / view</span></label>
        <label><input type="checkbox" id="sync-channels" checked> <span data-i18n="compare.syncChannels">Channels</span></label>
      </div>
    </div>

    <!-- Grid -->
    <div class="compare-grid layout-0" id="compare-grid">
      <div class="text-muted flex flex-col items-center gap-4" id="empty-state">
        <i data-lucide="grid" class="w-16 h-16 opacity-20"></i>
        <p data-i18n="compare.emptyTitle">No datasets selected for comparison.</p>
        <button class="btn btn-outline" data-action="add-dataset" data-i18n="compare.chooseBtn">Choose Dataset</button>
      </div>
      <!-- Panels are appended here by JS -->
    </div>

  </div>

  <!-- Modal Dataset Selector -->
  <div class="modal-overlay" id="modal-select" role="dialog" aria-modal="true" aria-labelledby="modal-select-title">
    <div class="modal-content animate-scale-in">
      <div class="modal-header">
        <h2 class="text-lg font-bold" id="modal-select-title" data-i18n="compare.modalTitle">Select Dataset to Add</h2>
        <button class="btn btn-icon btn-ghost w-8 h-8 p-0" id="btn-close-modal" aria-label="Close" data-i18n-aria="app.close"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-filters">
        <input type="search" class="form-input" id="modal-search" placeholder="Search…" data-i18n-placeholder="compare.search" autocomplete="off">
        <div class="modal-type-chips" id="modal-type-chips"></div>
      </div>
      <div class="modal-body" id="modal-dataset-list">
        <!-- JS populates cards here -->
      </div>
    </div>
  </div>

  <!-- Studio Editor Mode -->
  <div class="studio-layout hidden" id="studio-layout">
    <div class="studio-header">
      <div class="studio-header-left">
        <h2 data-i18n="compare.studioTitle">Slice Studio (Compare Mode)</h2>
        <span class="text-xs text-muted" id="studio-subtitle" data-i18n="compare.studioSubtitle">Edit and Annotate</span>
      </div>
      <div class="studio-header-right">
        <select class="form-select form-select-sm bg-surface" id="studio-scale-mode" data-i18n-title="tips.scaleMode">
          <option value="visual" data-i18n="compare.scaleVisual">Visual Size</option>
          <option value="physical" data-i18n="compare.scalePhysical">Physical Scale</option>
        </select>
        <div class="divider-vertical"></div>
        <input type="file" id="studio-import-file" accept=".json" class="hidden">
        <button class="btn btn-outline btn-sm" id="btn-studio-import"><i data-lucide="upload"></i> <span data-i18n="compare.importJson">Import JSON</span></button>
        <button class="btn btn-outline btn-sm" id="btn-studio-export-json"><i data-lucide="file-json"></i> <span data-i18n="compare.saveJson">Save JSON</span></button>
        <button class="btn btn-primary btn-sm" id="btn-studio-export-png"><i data-lucide="download"></i> <span data-i18n="compare.exportPng">Export PNG</span></button>
        <button class="btn btn-outline btn-sm" id="btn-studio-reset-view" title="Reset View" data-i18n-title="tips.resetView"><i data-lucide="refresh-ccw"></i></button>
        <div class="divider-vertical"></div>
        <button class="btn btn-icon btn-ghost" id="btn-close-studio" title="Back to panels" data-i18n-title="compare.backToPanels"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="studio-body">
      <div class="studio-sidebar-left">
        <div class="panel-section">
          <div class="panel-title" data-i18n="compare.tools">Tools</div>
          <div class="studio-tools-grid">
            <button class="btn btn-ghost btn-sm active" data-studio-tool="select" title="Select/Move" data-i18n-title="tips.selectMove"><i data-lucide="mouse-pointer-2"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="rectangle" title="Rectangle" data-i18n-title="tips.rect"><i data-lucide="square"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="ellipse" title="Ellipse" data-i18n-title="tips.ellipse"><i data-lucide="circle"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="arrow" title="Arrow" data-i18n-title="tips.arrow"><i data-lucide="move-right"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="line" title="Line" data-i18n-title="tips.line"><i data-lucide="minus"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="text" title="Text" data-i18n-title="tips.text"><i data-lucide="type"></i></button>
            <button class="btn btn-ghost btn-sm" data-studio-tool="scalebar" title="Scale Bar" data-i18n-title="tips.scaleBar"><i data-lucide="ruler"></i></button>
          </div>
        </div>
        <div class="panel-section flex-1" style="display:flex; flex-direction:column; min-height:0;">
          <div class="panel-title" data-i18n="compare.layers">Layers</div>
          <div class="studio-layers-list" id="studio-layers-list">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>
      <div class="studio-workspace" id="studio-workspace">
        <canvas id="studio-canvas"></canvas>
      </div>
      <div class="studio-sidebar-right">
        <div class="panel-section">
          <div class="panel-title" data-i18n="compare.properties">Properties</div>
          <div class="studio-properties" id="studio-properties">
            <p class="text-xs text-muted" data-i18n="studio.selectObject">Select an object to edit properties.</p>
            <div class="studio-property-row">
              <button class="btn btn-outline btn-sm" data-studio-command="add-guide-x" data-i18n="studio.guideX">Guide X</button>
              <button class="btn btn-outline btn-sm" data-studio-command="add-guide-y" data-i18n="studio.guideY">Guide Y</button>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-title" data-i18n="compare.channels">Channels</div>
          <div id="studio-channels" class="studio-channels-list">
            <!-- Populated via JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/core/utils.js"></script>
  <script src="js/core/ui-actions.js"></script>
  <script src="js/core/instance-config.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/theme.js"></script>
  <script src="js/core/colorblind.js" nonce="{{CSP_NONCE}}"></script>
  <script src="js/core/catalog.js"></script>
  <script src="js/core/download-manifest.js"></script>
  <script src="js/core/workspace-state.js"></script>
  <script src="js/core/url-state.js"></script>
  <script src="js/core/export-manager.js"></script>
  <script src="js/core/annotation-manager.js"></script>
  <script src="js/components/channel-panel.js"></script>
