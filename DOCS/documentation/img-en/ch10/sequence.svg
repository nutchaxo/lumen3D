<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="400" rx="16" fill="#f8f9fd"/><text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">From click to image: the loading sequence</text><rect x="24" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="56" width="160" height="30" rx="12" fill="#e8edff"/><rect x="24" y="72" width="160" height="14" fill="#e8edff"/><text x="104.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">1 · MANIFEST</text><text x="104.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">we read the map</text><text x="104.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">(manifest.json)</text><text x="104.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">levels, packs</text><rect x="222" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="56" width="160" height="30" rx="12" fill="#ebfbee"/><rect x="222" y="72" width="160" height="14" fill="#ebfbee"/><text x="302.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#2b8a3e">2 · QUALITY</text><text x="302.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">512 / 1024 / Native</text><text x="302.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">→ one level</text><text x="302.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">of the pyramid</text><rect x="420" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="56" width="160" height="30" rx="12" fill="#fff4e6"/><rect x="420" y="72" width="160" height="14" fill="#fff4e6"/><text x="500.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">3 · COARSE FIRST</text><text x="500.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">the coarsest</text><text x="500.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">level first</text><text x="500.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">(quick preview)</text><rect x="618" y="56" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="618" y="56" width="160" height="30" rx="12" fill="#f3f0ff"/><rect x="618" y="72" width="160" height="14" fill="#f3f0ff"/><text x="698.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#7048e8">4 · REQUESTED LEVEL</text><text x="698.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">then the chosen</text><text x="698.0" y="126" text-anchor="middle" font-size="12.5" fill="#1c2333">level, in the</text><text x="698.0" y="144" text-anchor="middle" font-size="12.5" fill="#1c2333">background</text><rect x="24" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="226" width="160" height="30" rx="12" fill="#e3fafc"/><rect x="24" y="242" width="160" height="14" fill="#e3fafc"/><text x="104.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#0c8599">5 · CENTRE FIRST</text><text x="104.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">bricks from the</text><text x="104.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">centre</text><text x="104.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">outwards</text><rect x="222" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="226" width="160" height="30" rx="12" fill="#fff0f0"/><rect x="222" y="242" width="160" height="14" fill="#fff0f0"/><text x="302.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#c92a2a">6 · DECODING</text><text x="302.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">"workers"</text><text x="302.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">decode the WebP</text><text x="302.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">(off the page)</text><rect x="420" y="226" width="160" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="226" width="160" height="30" rx="12" fill="#e8edff"/><rect x="420" y="242" width="160" height="14" fill="#e8edff"/><text x="500.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">7 · GPU ATLAS</text><text x="500.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">each brick</text><text x="500.0" y="296" text-anchor="middle" font-size="12.5" fill="#1c2333">is placed in</text><text x="500.0" y="314" text-anchor="middle" font-size="12.5" fill="#1c2333">video memory</text><line x1="186" y1="111" x2="220" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="111" x2="418" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="582" y1="111" x2="616" y2="111" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><path d="M698 170 V198 H104 V222" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="186" y1="281" x2="220" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="281" x2="418" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><rect x="618" y="226" width="160" height="110" rx="12" fill="#fff8db" stroke="#e67700" stroke-width="2"/><text x="698" y="256" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">1st IMAGE</text><text x="698" y="282" text-anchor="middle" font-size="12.5" fill="#1c2333">as soon as 25% of the</text><text x="698" y="300" text-anchor="middle" font-size="12.5" fill="#1c2333">bricks are in place,</text><text x="698" y="318" text-anchor="middle" font-size="12.5" fill="#1c2333">the loader disappears</text><line x1="582" y1="281" x2="614" y2="281" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/><text x="400" y="372" text-anchor="middle" font-size="13" fill="#4a5468">Steps 4 to 7 overlap: while one brick is being decoded, the next is already downloading.</text></svg>