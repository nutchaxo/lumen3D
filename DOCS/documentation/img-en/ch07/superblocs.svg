ke-width="0.8" /><rect x="138.0" y="160.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="60.0" y="186.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="86.0" y="186.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="112.0" y="186.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="138.0" y="186.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="60.0" y="212.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="86.0" y="212.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="112.0" y="212.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="138.0" y="212.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="60.0" y="238.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="86.0" y="238.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="112.0" y="238.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><rect x="138.0" y="238.0" width="26" height="26" rx="0" fill="#d3f9d8" stroke="#2b8a3e" stroke-width="0.8" /><text x="130" y="95" font-size="14" font-weight="800" fill="#2b8a3e" text-anchor="middle" >one super-block</text><text x="130" y="112" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" >4 × 4 × 4 = 64 neighbouring bricks</text><line x1="235" y1="210" x2="300" y2="210" stroke="#4a5468" stroke-width="2.4" marker-end="url(#arr)"/><rect x="315" y="140" width="140" height="140" rx="14" fill="#fff4e6" stroke="#e67700" stroke-width="2" /><text x="385" y="195" font-size="16" font-weight="800" fill="#e67700" text-anchor="middle" >pack</text><text x="385" y="216" font-size="13" font-weight="700" fill="#1c2333" text-anchor="middle" >p00000.bin</text><text x="385" y="238" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="middle" >≤ 64 bricks</text><text x="385" y="256" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="middle" >≤ 16 MiB</text><rect x="500" y="80" width="270" height="190" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1" /><text x="515" y="108" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >Why super-blocks?</text><text x="515" y="132" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >A cut along XZ or YZ crosses</text><text x="515" y="150" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >one row of bricks: with</text><text x="515" y="168" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >super-blocks, those bricks sit in</text><text x="515" y="186" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >few packs, hence few requests.</text><text x="515" y="204" font-size="12.5" font-weight="700" fill="#1c2333" text-anchor="start" >Measured (simulation, embryo</text><text x="515" y="222" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="start" >5735² × 172): YZ cut = 66 packs</text><text x="515" y="240" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="start" >instead of 668.</text><text x="400" y="326" font-size="12" font-weight="400" fill="#4a5468" text-anchor="middle" font-style="italic">A pack always holds whole super-blocks; a super-block that is too big is split in brick order.</text></svg>