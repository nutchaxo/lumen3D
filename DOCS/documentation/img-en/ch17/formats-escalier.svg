<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 458" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="458" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >The five data formats</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Each step adds a structure beside the bricks; a migration knows how to climb to it.</text><rect x="24" y="215" width="141" height="139" rx="12" fill="#eef0f5" stroke="#4a5468" stroke-width="1.8" /><circle cx="48" cy="241" r="15" fill="#4a5468" stroke="none" stroke-width="1"/><text x="48" y="247" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="72" y="247" font-size="15" font-weight="800" fill="#4a5468" text-anchor="start" >v2 bricks</text><text x="38" y="277" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >64³, no border</text><text x="38" y="295" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >JSON manifest</text><text x="38" y="313" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >before 1.58.0</text><rect x="34" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#4a5468" stroke-width="1.3" /><text x="94.5" y="337" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >(starting point)</text><rect x="177" y="183" width="141" height="171" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.8" /><circle cx="201" cy="209" r="15" fill="#e67700" stroke="none" stroke-width="1"/><text x="201" y="215" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="225" y="215" font-size="15" font-weight="800" fill="#e67700" text-anchor="start" >planes/</text><text x="191" y="245" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >one file per Z plane</text><text x="191" y="263" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >lossless 512² PNG</text><text x="191" y="281" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >fast XY cuts</text><rect x="187" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#e67700" stroke-width="1.3" /><text x="247.5" y="337" font-size="11.5" font-weight="700" fill="#e67700" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m002-planes</text><line x1="165" y1="243" x2="177" y2="243" stroke="#e67700" stroke-width="2.4" marker-end="url(#arr)"/><rect x="330" y="151" width="141" height="203" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.8" /><circle cx="354" cy="177" r="15" fill="#0c8599" stroke="none" stroke-width="1"/><text x="354" y="183" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="378" y="183" font-size="15" font-weight="800" fill="#0c8599" text-anchor="start" >mips/</text><text x="344" y="213" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >MIP per 64-plane layer</text><text x="344" y="231" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >laid out as planes/</text><text x="344" y="249" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >fast z-stack</text><rect x="340" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#0c8599" stroke-width="1.3" /><text x="400.5" y="337" font-size="11.5" font-weight="700" fill="#0c8599" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m003-layer-mips</text><line x1="318" y1="211" x2="330" y2="211" stroke="#0c8599" stroke-width="2.4" marker-end="url(#arr)"/><rect x="483" y="119" width="141" height="235" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.8" /><circle cx="507" cy="145" r="15" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="507" y="151" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="531" y="151" font-size="15" font-weight="800" fill="#2b8a3e" text-anchor="start" >v3 bricks</text><text x="497" y="181" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >66³ bricks</text><text x="497" y="199" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >border, Z reduced</text><text x="497" y="217" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >index.bin, local detail</text><rect x="493" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#2b8a3e" stroke-width="1.3" /><text x="553.5" y="337" font-size="11.5" font-weight="700" fill="#2b8a3e" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m004-bricks-v3</text><line x1="471" y1="179" x2="483" y2="179" stroke="#2b8a3e" stroke-width="2.4" marker-end="url(#arr)"/><rect x="636" y="87" width="141" height="267" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.8" /><circle cx="660" cy="113" r="15" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="660" y="119" font-size="17" font-weight="800" fill="#fff" text-anchor="middle" >5</text><text x="684" y="119" font-size="15" font-weight="800" fill="#3b5bdb" text-anchor="start" >matrix</text><text x="650" y="149" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >levels 256·2ᵏ, all Z</text><text x="650" y="167" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >5 compressions</text><text x="650" y="185" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >cut copies</text><rect x="646" y="322" width="121" height="22" rx="11" fill="#fff" stroke="#3b5bdb" stroke-width="1.3" /><text x="706.5" y="337" font-size="11.5" font-weight="700" fill="#3b5bdb" text-anchor="middle" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >m005-matrix</text><line x1="624" y1="147" x2="636" y2="147" stroke="#3b5bdb" stroke-width="2.4" marker-end="url(#arr)"/><rect x="24" y="372" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="396" font-size="13.5" font-weight="800" fill="#1c2333" text-anchor="start" >To remember</text><text x="40" y="416" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• the viewer reads formats 1 to 5; steps 2 to 5 only make things faster and nicer;</text><text x="40" y="434" font-size="12" font-weight="400" fill="#4a5468" text-anchor="start" >• pipeline 0.22.0 writes format 4 (5 with --format 5); the Data updates tab climbs to 5.</text></svg>