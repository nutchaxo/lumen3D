<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Inter, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs>
<rect width="800" height="400" rx="16" fill="#f8f9fd"/>
<text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Where does each memory live? Four places</text>
<rect x="24" y="56" width="178" height="276" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.6"/>
<text x="113" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#3b5bdb">This browser</text>
<text x="113" y="106" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">localStorage</text>
<text x="36" y="140" font-size="11.5" fill="#1c2333">• theme, language, colour-blind</text>
<text x="36" y="170" font-size="11.5" fill="#1c2333">• workspaces</text>
<text x="36" y="200" font-size="11.5" fill="#1c2333">• Z scale, speed</text>
<text x="36" y="230" font-size="11.5" fill="#1c2333">• graphics memory budget</text>
<text x="36" y="260" font-size="11.5" fill="#1c2333">• admin settings</text>
<rect x="38" y="298" width="150" height="24" rx="12" fill="#fff" stroke="#3b5bdb"/>
<text x="113" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3b5bdb">stays after closing</text>
<rect x="214" y="56" width="178" height="276" rx="12" fill="#e3fafc" stroke="#0c8599" stroke-width="1.6"/>
<text x="303" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#0c8599">This tab</text>
<text x="303" y="106" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">sessionStorage</text>
<text x="226" y="140" font-size="11.5" fill="#1c2333">• visit already counted</text>
<text x="226" y="170" font-size="11.5" fill="#1c2333">• view already counted</text>
<text x="226" y="200" font-size="11.5" fill="#1c2333">• widget clipboard</text>
<rect x="228" y="298" width="150" height="24" rx="12" fill="#fff" stroke="#0c8599"/>
<text x="303" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0c8599">cleared on close</text>
<rect x="404" y="56" width="178" height="276" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/>
<text x="493" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#7048e8">The address</text>
<text x="493" y="106" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">URL</text>
<text x="416" y="140" font-size="11.5" fill="#1c2333">• ?id=  ?quality=  ?type=</text>
<text x="416" y="170" font-size="11.5" fill="#1c2333">• ?slug=  ?add=  ?mode=</text>
<text x="416" y="200" font-size="11.5" fill="#1c2333">• #state= : the whole view</text>
<rect x="418" y="298" width="150" height="24" rx="12" fill="#fff" stroke="#7048e8"/>
<text x="493" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7048e8">copy it, share it</text>
<rect x="594" y="56" width="178" height="276" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.6"/>
<text x="683" y="86" text-anchor="middle" font-size="15" font-weight="800" fill="#e67700">The server</text>
<text x="683" y="106" text-anchor="middle" font-size="12" fill="#4a5468" font-family="monospace">cookie + files</text>
<text x="606" y="140" font-size="11.5" fill="#1c2333">• session cookie (8 h)</text>
<text x="606" y="170" font-size="11.5" fill="#1c2333">• config/, api/stats.json</text>
<text x="606" y="200" font-size="11.5" fill="#1c2333">• DATA_WEB/, uploads/</text>
<rect x="608" y="298" width="150" height="24" rx="12" fill="#fff" stroke="#e67700"/>
<text x="683" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e67700">common to everyone</text>
<text x="400" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1c2333">An anonymous visitor writes nothing on the server, except three anonymous counters.</text>
</svg>
