<text x="220.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">themes.css</text>
<text x="220.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">dark / light</text>
<rect x="286" y="252" width="150" height="62" rx="10" fill="#fff4e6" stroke="#e67700" stroke-width="1.8"/>
<text x="361.0" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">config/theme.css</text>
<text x="361.0" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">YOUR brand</text>
<rect x="442" y="252" width="215" height="62" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/>
<text x="549.5" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">base · components · layout…</text>
<text x="549.5" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">layout</text>
<rect x="663" y="252" width="109" height="62" rx="10" fill="#eef0f5" stroke="#4a5468" stroke-width="1.2"/>
<text x="717.5" y="278" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#1c2333" text-anchor="middle" xml:space="preserve">tools.css</text>
<text x="717.5" y="298" font-family="Inter, sans-serif" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="middle" xml:space="preserve">tools</text>
<rect x="24" y="334" width="752" height="70" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2"/>
<text x="40" y="358" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">A served file (not an injected &lt;style&gt;): the site's security policy forbids injected styles.</text>
<text x="40" y="378" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" xml:space="preserve">So the theme is there from the first paint. The preview changes variables one by one.</text>
</svg>
