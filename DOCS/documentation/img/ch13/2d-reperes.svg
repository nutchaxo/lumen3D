<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 372" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="372" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Trois repères, une seule relation d'échelle</text><rect x="20" y="56" width="232" height="130" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.4" /><text x="34" y="80.8" font-size="13.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >① Image (ix, iy)</text><text x="34" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Les pixels de la photographie telle</text><text x="34" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >que stockée (1920 × 1440 sur la</text><text x="34" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >démo).</text><line x1="254" y1="120" x2="282" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="284" y="56" width="232" height="130" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.4" /><text x="298" y="80.8" font-size="13.5" font-weight="800" fill="#7048e8" text-anchor="start" >② Orientée (ox, oy)</text><text x="298" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Après le miroir, puis la rotation</text><text x="298" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >autour du centre. Boîte englobante :</text><text x="298" y="134.47" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >l = L·|cos θ| + H·|sin θ|.</text><line x1="518" y1="120" x2="546" y2="120" stroke="#4a5468" stroke-width="2.2" marker-end="url(#arr)" /><rect x="548" y="56" width="232" height="130" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="562" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >③ Canevas (sx, sy)</text><text x="562" y="101.35" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Pixels CSS de l'écran : sx =</text><text x="562" y="117.91" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >ox·scale + tx, sy = oy·scale + ty.</text><text x="268" y="206" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" >miroir + rotation</text><text x="532" y="206" font-size="11.5" font-weight="700" fill="#4a5468" text-anchor="middle" >zoom + déplacement</text><rect x="20" y="222" width="760" height="132" rx="12" fill="#f1f3f5" stroke="#c5cbd8" stroke-width="1" /><text x="36" y="246" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >La seule relation de calibration</text><text x="36" y="272" font-size="13" font-weight="700" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">longueur L (µm)  →  L / pixelSizeUm × scale  pixels CSS, dans les trois repères</text><text x="36" y="298" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >Une rotation est rigide : elle ne change pas l'échelle. Exemple : 2 µm par pixel, scale = 0,5 → 1 pixel de l'image = 0,5 pixel</text><text x="36" y="314.56" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >d'écran, donc 100 µm = 100 / 2 × 0,5 = 25 pixels CSS. La barre d'échelle, la grille, les mesures et la vue divisée s'appuient</text><text x="36" y="331.12" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start" >toutes sur cette seule ligne.</text></svg>