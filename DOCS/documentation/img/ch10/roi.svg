<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="Inter, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker>
  <pattern id="c" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#bac8ff" stroke="#fff" stroke-width="2"/></pattern>
  <pattern id="f" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#8ce99a" stroke="#fff" stroke-width="1"/></pattern></defs>
  <rect width="800" height="340" rx="16" fill="#f8f9fd"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Mode « Détail au zoom » : du fin seulement là où vous regardez</text>
  <!-- left : zoomed out -->
  <rect x="24" y="52" width="360" height="230" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <text x="204" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#3b5bdb">Vue d'ensemble</text>
  <rect x="64" y="92" width="280" height="160" fill="url(#c)"/>
  <text x="204" y="270" text-anchor="middle" font-size="12.5" fill="#1c2333">1 voxel ≤ 1,5 pixel : le niveau choisi suffit</text>
  <!-- right: zoomed -->
  <rect x="416" y="52" width="360" height="230" rx="14" fill="#fff" stroke="#c5cbd8"/>
  <text x="596" y="76" text-anchor="middle" font-size="13.5" font-weight="800" fill="#2b8a3e">Après un zoom</text>
  <rect x="456" y="92" width="280" height="160" fill="url(#c)"/>
  <rect x="536" y="132" width="120" height="80" fill="url(#f)" stroke="#2b8a3e" stroke-width="2"/>
  <text x="596" y="270" text-anchor="middle" font-size="12.5" fill="#1c2333">1 voxel &gt; 1,5 pixel : on charge un niveau plus fin, dans la vue</text>
  <line x1="388" y1="167" x2="412" y2="167" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/>
  <rect x="24" y="294" width="752" height="34" rx="10" fill="#fff" stroke="#c5cbd8"/>
  <text x="400" y="316" text-anchor="middle" font-size="12.5" fill="#1c2333">Bleu : niveau de qualité choisi · Vert : briques plus fines chargées pour la zone visible (après 350 ms d'immobilité)</text>
</svg>
