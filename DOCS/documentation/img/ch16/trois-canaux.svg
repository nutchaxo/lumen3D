<text x="550" y="244" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">la langue du visiteur.</text>
<text x="550" y="280" font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#4a5468" text-anchor="start">Pourquoi</text>
<text x="550" y="298" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">Les fichiers de langue restent</text>
<text x="550" y="314" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#1c2333" text-anchor="start">neutres : aucun « embryon » écrit</text>
