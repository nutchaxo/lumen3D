<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="420" rx="16" fill="#f8f9fd"/><text x="400" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#1c2333">Le trajet d'une valeur, de l'octet à la couleur du pixel</text><rect x="24" y="56" width="158" height="130" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="56" width="158" height="30" rx="12" fill="#e8edff"/><rect x="24" y="72" width="158" height="14" fill="#e8edff"/><text x="103.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">1 · OCTET</text><text x="103.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">la valeur stockée</text><text x="103.0" y="125" text-anchor="middle" font-size="12.5" fill="#1c2333">de 0 à 255</text><text x="103.0" y="142" text-anchor="middle" font-size="12.5" fill="#1c2333">(8 bits)</text><rect x="222" y="56" width="158" height="130" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="56" width="158" height="30" rx="12" fill="#f3f0ff"/><rect x="222" y="72" width="158" height="14" fill="#f3f0ff"/><text x="301.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#7048e8">2 · PLANCHER</text><text x="301.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">« fond » écrasé</text><text x="301.0" y="125" text-anchor="middle" font-size="12.5" fill="#1c2333">à 0, le reste</text><text x="301.0" y="142" text-anchor="middle" font-size="12.5" fill="#1c2333">étiré</text><text x="301.0" y="159" text-anchor="middle" font-size="12.5" fill="#1c2333">(invisible)</text><rect x="420" y="56" width="158" height="130" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="56" width="158" height="30" rx="12" fill="#ebfbee"/><rect x="420" y="72" width="158" height="14" fill="#ebfbee"/><text x="499.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#2b8a3e">3 · FENÊTRE</text><text x="499.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">min → 0</text><text x="499.0" y="125" text-anchor="middle" font-size="12.5" fill="#1c2333">max → 1</text><text x="499.0" y="142" text-anchor="middle" font-size="12.5" fill="#1c2333">(poignées</text><text x="499.0" y="159" text-anchor="middle" font-size="12.5" fill="#1c2333">gauche et droite)</text><rect x="618" y="56" width="158" height="130" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="618" y="56" width="158" height="30" rx="12" fill="#fff4e6"/><rect x="618" y="72" width="158" height="14" fill="#fff4e6"/><text x="697.0" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">4 · GAMMA</text><text x="697.0" y="108" text-anchor="middle" font-size="12.5" fill="#1c2333">x puissance gamma</text><text x="697.0" y="125" text-anchor="middle" font-size="12.5" fill="#1c2333">(poignée du</text><text x="697.0" y="142" text-anchor="middle" font-size="12.5" fill="#1c2333">milieu)</text><line x1="186" y1="121" x2="220" y2="121" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="121" x2="418" y2="121" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="582" y1="121" x2="616" y2="121" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><path d="M697 188 V210 H103 V224" fill="none" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="226" width="158" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="24" y="226" width="158" height="30" rx="12" fill="#e3fafc"/><rect x="24" y="242" width="158" height="14" fill="#e3fafc"/><text x="103.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#0c8599">5 · OPACITÉ</text><text x="103.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">× 0,7 / 0,42 / 1</text><text x="103.0" y="295" text-anchor="middle" font-size="12.5" fill="#1c2333">(bouton goutte)</text><rect x="222" y="226" width="158" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="222" y="226" width="158" height="30" rx="12" fill="#fff0f0"/><rect x="222" y="242" width="158" height="14" fill="#fff0f0"/><text x="301.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#c92a2a">6 · COULEUR</text><text x="301.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">× couleur du canal</text><text x="301.0" y="295" text-anchor="middle" font-size="12.5" fill="#1c2333">(pastille)</text><rect x="420" y="226" width="158" height="110" rx="12" fill="#fff" stroke="#c5cbd8"/><rect x="420" y="226" width="158" height="30" rx="12" fill="#e8edff"/><rect x="420" y="242" width="158" height="14" fill="#e8edff"/><text x="499.0" y="247" text-anchor="middle" font-size="13" font-weight="800" fill="#3b5bdb">7 · COMBINER</text><text x="499.0" y="278" text-anchor="middle" font-size="12.5" fill="#1c2333">les canaux sont</text><text x="499.0" y="295" text-anchor="middle" font-size="12.5" fill="#1c2333">additionnés selon</text><text x="499.0" y="312" text-anchor="middle" font-size="12.5" fill="#1c2333">le mode de rendu</text><line x1="186" y1="281" x2="220" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><line x1="384" y1="281" x2="418" y2="281" stroke="#4a5468" stroke-width="2" marker-end="url(#a)"/><rect x="618" y="226" width="158" height="110" rx="12" fill="#fff8db" stroke="#e67700" stroke-width="2"/><text x="697" y="256" text-anchor="middle" font-size="13" font-weight="800" fill="#e67700">LE PIXEL</text><text x="697" y="280" text-anchor="middle" font-size="12.5" fill="#1c2333">× exposition</text><text x="697" y="298" text-anchor="middle" font-size="12.5" fill="#1c2333">(curseur global)</text><line x1="582" y1="281" x2="614" y2="281" stroke="#e67700" stroke-width="2" marker-end="url(#a)"/><rect x="24" y="354" width="752" height="48" rx="10" fill="#fff" stroke="#c5cbd8"/><text x="400" y="375" text-anchor="middle" font-size="13" fill="#1c2333">Les étapes 3 à 5 se règlent canal par canal. L'étape 2 n'a aucun réglage : elle est décidée à partir</text><text x="400" y="393" text-anchor="middle" font-size="13" fill="#1c2333">de l'histogramme du jeu de données, au moment du décodage des briques.</text></svg>