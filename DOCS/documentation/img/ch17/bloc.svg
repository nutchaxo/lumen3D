<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 504" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker><marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker></defs><rect width="800" height="504" rx="16" fill="#f8f9fd"/><text x="400" y="32" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Un bloc, de la lecture à l'écriture</text><text x="400" y="52" font-size="12.5" font-weight="400" fill="#4a5468" text-anchor="middle" >Le fichier bricks/l0/c1/p00001.bin du jeu de démonstration (329 046 octets) découpé en blocs de 256 Kio.</text><text x="24" y="84" font-size="12" font-weight="700" fill="#4a5468" text-anchor="start" >le fichier</text><rect x="24.0" y="94" width="599.1025206202172" height="30" rx="4" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.5" /><text x="323.5512603101086" y="114" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle" >bloc 0</text><rect x="623.1025206202172" y="94" width="152.8974793797828" height="30" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5" /><text x="699.5512603101085" y="114" font-size="12" font-weight="700" fill="#7048e8" text-anchor="middle" >bloc 1</text><text x="24" y="142" font-size="11.5" font-weight="400" fill="#4a5468" text-anchor="start" >262 144 octets (256 Kio) par bloc ; le dernier prend le reste : 66 902 octets  (par défaut, 8 Mio)</text><rect x="24" y="170" width="178" height="126" rx="12" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.7" /><circle cx="44" cy="194" r="12" fill="#3b5bdb" stroke="none" stroke-width="1"/><text x="44" y="199" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="62" y="199" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" >Lire et hacher</text><text x="34" y="226" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >le Worker lit la tranche</text><text x="34" y="245" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >SHA-256 = ae4231f32b…</text><text x="34" y="264" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >(crypto.subtle : HTTPS exigé)</text><rect x="215" y="170" width="178" height="126" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.7" /><circle cx="235" cy="194" r="12" fill="#7048e8" stroke="none" stroke-width="1"/><text x="235" y="199" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="253" y="199" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="start" >Envoyer</text><text x="225" y="226" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >POST ?action=chunk</text><text x="225" y="245" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >&amp;path=…&amp;index=1</text><text x="225" y="264" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >&amp;sha256=…&amp;fid=4</text><line x1="202" y1="232" x2="215" y2="232" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="406" y="170" width="178" height="126" rx="12" fill="#fff4e6" stroke="#e67700" stroke-width="1.7" /><circle cx="426" cy="194" r="12" fill="#e67700" stroke="none" stroke-width="1"/><text x="426" y="199" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="444" y="199" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" >Le serveur contrôle</text><text x="416" y="226" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >chemin permis ? numéro de fichier</text><text x="416" y="245" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >↔ chemin ? longueur attendue ?</text><text x="416" y="264" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >SHA-256 recalculé = annoncé ?</text><line x1="393" y1="232" x2="406" y2="232" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="597" y="170" width="178" height="126" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.7" /><circle cx="617" cy="194" r="12" fill="#2b8a3e" stroke="none" stroke-width="1"/><text x="617" y="199" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="635" y="199" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Écrire, noter</text><text x="607" y="226" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >écrit à l'offset index × taille</text><text x="607" y="245" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >fsync puis 16 octets ajoutés</text><text x="607" y="264" font-size="10.6" font-weight="400" fill="#1c2333" text-anchor="start" >au journal des blocs</text><line x1="584" y1="232" x2="597" y2="232" stroke="#4a5468" stroke-width="2" marker-end="url(#arr)"/><rect x="24" y="312" width="752" height="92" rx="12" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="40" y="334" font-size="13" font-weight="800" fill="#1c2333" text-anchor="start" >Ce que répond le serveur</text><rect x="40" y="345" width="36" height="17" rx="8" fill="#2b8a3e" stroke="#2b8a3e" stroke-width="0" /><text x="58" y="358" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >200</text><text x="84" y="358" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" >reçu, écrit, noté</text><rect x="410" y="345" width="36" height="17" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="0" /><text x="428" y="358" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >400</text><text x="454" y="358" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >checksum_required · bad_chunk_length</text><rect x="40" y="366" width="36" height="17" rx="8" fill="#e67700" stroke="#e67700" stroke-width="0" /><text x="58" y="379" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >409</text><text x="84" y="379" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >file_not_planned (replanifier)</text><rect x="410" y="366" width="36" height="17" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="0" /><text x="428" y="379" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >413</text><text x="454" y="379" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >chunk_too_large (&gt; 16 Mio)</text><rect x="40" y="387" width="36" height="17" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="0" /><text x="58" y="400" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >422</text><text x="84" y="400" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >checksum_mismatch (le client renvoie)</text><rect x="410" y="387" width="36" height="17" rx="8" fill="#c92a2a" stroke="#c92a2a" stroke-width="0" /><text x="428" y="400" font-size="10.8" font-weight="800" fill="#fff" text-anchor="middle" >507</text><text x="454" y="400" font-size="11" font-weight="400" fill="#1c2333" text-anchor="start" font-family="'DejaVu Sans Mono', 'Liberation Mono', monospace" >insufficient_disk (fin du transfert)</text><rect x="24" y="418" width="752" height="70" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.5" /><text x="40" y="440" font-size="13" font-weight="800" fill="#2b8a3e" text-anchor="start" >Quand tous les blocs sont là : file_done</text><text x="40" y="460" font-size="11.3" font-weight="400" fill="#1c2333" text-anchor="start" >le client envoie root = SHA-256 de la suite des empreintes de blocs = 0c7c826a73d9…</text><text x="40" y="477" font-size="11.3" font-weight="400" fill="#4a5468" text-anchor="start" >Le serveur vérifie aussi la taille sur disque et le contenu (signature WebP, JSON valide, en-tête d'index…).</text></svg>