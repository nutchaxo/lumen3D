<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Inter, sans-serif"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5468"/></marker></defs><rect width="800" height="520" rx="16" fill="#f8f9fd"/><text x="400" y="34" font-size="18" font-weight="800" fill="#1c2333" text-anchor="middle" >Ce qu'est un « document » du Studio</text><rect x="20" y="56" width="440" height="448" rx="14" fill="#fff" stroke="#c5cbd8" stroke-width="1.2" /><text x="36" y="82" font-size="14" font-weight="800" fill="#1c2333" text-anchor="start" >document (version 2)</text><rect x="34" y="104" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="129" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">dataset</text><text x="222" y="124" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >id, nom, type, chemin, dimensions</text><rect x="34" y="150" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="175" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">timepoint · sourceSlice</text><text x="222" y="170" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >image, taille et qualité de la coupe</text><rect x="34" y="196" width="410" height="40" rx="9" fill="#e8edff" stroke="#3b5bdb" stroke-width="1.1" /><text x="46" y="221" font-size="12.5" font-weight="800" fill="#3b5bdb" text-anchor="start" font-family="JetBrains Mono, monospace">planeSpec</text><text x="222" y="209.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >le plan : mode, axe, lacet, tangage,</text><text x="222" y="223" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >roulis, épaisseur</text><rect x="34" y="242" width="410" height="40" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.1" /><text x="46" y="267" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">channelState[ ]</text><text x="222" y="255.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >couleur, min, max, gamma, opacité de</text><text x="222" y="269" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >chaque canal</text><rect x="34" y="288" width="410" height="40" rx="9" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.1" /><text x="46" y="313" font-size="12.5" font-weight="800" fill="#2b8a3e" text-anchor="start" font-family="JetBrains Mono, monospace">calibration</text><text x="222" y="301.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >µm par pixel (x et y), étendue, taille</text><text x="222" y="315" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >physique</text><rect x="34" y="334" width="410" height="40" rx="9" fill="#fff4e6" stroke="#e67700" stroke-width="1.1" /><text x="46" y="359" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" font-family="JetBrains Mono, monospace">layers[ ]</text><text x="222" y="347.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >les annotations, du dessous vers le</text><text x="222" y="361" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >dessus</text><rect x="34" y="380" width="410" height="40" rx="9" fill="#fff4e6" stroke="#e67700" stroke-width="1.1" /><text x="46" y="405" font-size="12.5" font-weight="800" fill="#e67700" text-anchor="start" font-family="JetBrains Mono, monospace">guides[ ] · groups[ ]</text><text x="222" y="400" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >repères d'alignement · regroupements</text><rect x="34" y="426" width="410" height="40" rx="9" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.1" /><text x="46" y="451" font-size="12.5" font-weight="800" fill="#7048e8" text-anchor="start" font-family="JetBrains Mono, monospace">viewport</text><text x="222" y="446" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >zoom, déplacement, rotation de la vue</text><rect x="34" y="472" width="410" height="40" rx="9" fill="#e3fafc" stroke="#0c8599" stroke-width="1.1" /><text x="46" y="497" font-size="12.5" font-weight="800" fill="#0c8599" text-anchor="start" font-family="JetBrains Mono, monospace">layoutMaps[ ]</text><text x="222" y="485.5" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >Comparer : une cellule par panneau</text><text x="222" y="499" font-size="11.5" font-weight="400" fill="#1c2333" text-anchor="start" >(rectangle, µm/px, canaux)</text><rect x="484" y="56" width="296" height="176" rx="12" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.4" /><text x="498" y="80.8" font-size="13.5" font-weight="800" fill="#2b8a3e" text-anchor="start" >Dans le fichier JSON</text><text x="498" y="101.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Tout ce qui précède, en texte : calques,</text><text x="498" y="118.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >repères, canaux, plan, calibration, cellules de</text><text x="498" y="135.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Comparer. Aucun pixel. Un fichier de 5 Mo, 2</text><text x="498" y="153.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >000 calques ou 10 000 points est refusé à la</text><text x="498" y="170.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >lecture.</text><rect x="484" y="246" width="296" height="258" rx="12" fill="#fff0f0" stroke="#c92a2a" stroke-width="1.4" /><text x="498" y="270.8" font-size="13.5" font-weight="800" fill="#c92a2a" text-anchor="start" >Jamais dans le fichier</text><text x="498" y="291.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >Les valeurs brutes des canaux (raw), le</text><text x="498" y="308.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >cadre de la page (iframe) et la coupe</text><text x="498" y="325.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >elle-même (sliceResult) : trois champs</text><text x="498" y="343.1" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >d'exécution, retirés par _portableDocument()</text><text x="498" y="360.35" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >à chaque export et à chaque copie</text><text x="498" y="377.6" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >d'historique légère. Ils vivent en mémoire</text><text x="498" y="394.85" font-size="12.5" font-weight="400" fill="#1c2333" text-anchor="start" >tant que le Studio est ouvert.</text></svg>